   Regras (nesta ordem):
     1. Se o usuário JÁ TREINOU nesse dia → devolve o treino registrado com
        jaTreinou:true. Sem tentativa de "sugerir por cima".
     2. Calcula a LETRA BASE = override manual (S.planejado[perfil][data].musc)
        OU o schedule fixo do dia da semana.
     3. Sem letra base (dia de descanso) → schedRest:true, musc:null.
     4. ANTI-REPETIÇÃO UNIVERSAL: olha os eventos musc dos ÚLTIMOS 3 DIAS
        antes de dataISO. Se a letra base foi feita em algum deles, escolhe a
        alternativa A/B/C/D parada há mais tempo (excluindo todas que
        aparecem nesses 3 dias). Isso resolve o bug recorrente: "Gabriel fez
        B ontem, hoje o schedule pede B → app continuava mostrando B".

   Retorno estável:
     { musc, motivo, jaTreinou, override, letraOriginal,
       schedRest, schedJiu, schedNota }
============================================================================ */
function sugestaoTreino(perfil, dataISO){
  const days = dayset(perfil);

  // 1) Já treinou nesse dia?
  const evJa = S.events.find(e=>e.perfil===perfil && e.data===dataISO && e.tipo==='musc');
  if(evJa){
    return {
      musc: evJa.dia,
      motivo: `Você registrou o treino <b>${evJa.dia}</b> neste dia.`,
      jaTreinou: true, override: false, letraOriginal: null,
      schedRest: false, schedJiu: false, schedNota: ''
    };
  }

  // 2) Letra base = override manual OU schedule fixo do dia da semana
  const d = new Date(dataISO+'T12:00:00');
  const sched = getSchedule(perfil);
  const diaSched = sched ? (sched[WDK[d.getDay()]] || null) : null;
  const plan = (S.planejado && S.planejado[perfil] && S.planejado[perfil][dataISO]) || null;
  const muscOverride = (plan && Object.prototype.hasOwnProperty.call(plan,'musc')) ? plan.musc : null;
  const jiu  = !!(diaSched && diaSched.jiu) || !!(plan && plan.jiu);
  const nota = (diaSched && diaSched.nota) || '';
  const letraBase = (muscOverride !== null ? muscOverride : (diaSched ? diaSched.musc : null));

  // 3) Sem letra base → descanso
  if(!letraBase){
    const diaSem = WDL[d.getDay()];
    return {
      musc: null,
      motivo: `Cronograma de ${diaSem}: <b>${nota||'sem musculação'}</b>${jiu?' · Jiu à noite':''}.`,
      jaTreinou: false, override: false, letraOriginal: null,
      schedRest: true, schedJiu: jiu, schedNota: nota
    };
  }

  // 4) Anti-repetição: verifica os 3 dias anteriores
  const recentes = [];
  for(let i=1; i<=3; i++){
    const dPrev = new Date(d); dPrev.setDate(dPrev.getDate()-i);
    const isoPrev = iso(dPrev);
    const ev = S.events.find(e=>e.perfil===perfil && e.data===isoPrev && e.tipo==='musc');
    if(ev && ev.dia) recentes.push({dia: ev.dia, distancia: i});
  }
  const recSet = new Set(recentes.map(x=>x.dia));

  if(recSet.has(letraBase)){
    // Escolhe alternativa parada há mais tempo (excluindo letras dos 3 dias)
    const alternativas = ORDER.filter(L => !recSet.has(L) && days[L]);
    if(alternativas.length > 0){
      const rank = alternativas.map(L => {
        const ultEv = S.events
          .filter(e=>e.perfil===perfil && e.tipo==='musc' && e.dia===L && e.data<dataISO)
          .sort((a,b)=> a.data<b.data?1:-1)[0];
        const diasParado = ultEv
          ? Math.floor((d - new Date(ultEv.data+'T12:00:00'))/86400000)
          : 999;
        return {L, diasParado};
      }).sort((a,b)=> b.diasParado-a.diasParado || ORDER.indexOf(a.L)-ORDER.indexOf(b.L));
      const escolhida = rank[0];
      const rec = recentes.find(x=>x.dia===letraBase);
      const qdo = rec.distancia===1 ? 'ontem'
                : rec.distancia===2 ? 'anteontem'
                : `há ${rec.distancia} dias`;
      const desdeTxt = escolhida.diasParado===999 ? 'nunca feito'
                     : (escolhida.diasParado===1 ? 'parado há 1 dia'
                                                 : `parado há ${escolhida.diasParado} dias`);
      const diaSem = WDL[d.getDay()];
      return {
        musc: escolhida.L,
        motivo: `Você fez <b>${letraBase}</b> ${qdo}. O cronograma de ${diaSem} pediria <b>${letraBase}</b> de novo — sugerindo <b>${escolhida.L}</b> (${desdeTxt}) pra não repetir.`,
        jaTreinou: false, override: true, letraOriginal: letraBase,
        schedRest: false, schedJiu: jiu, schedNota: nota
      };
    }
  }

  // 5) Letra base OK — sem repetição recente
  const diaSem = WDL[d.getDay()];
  let motivo;
  if(muscOverride !== null){
    motivo = `Override manual: treino <b>${letraBase}</b>${nota?` — ${nota}`:''}.`;
  } else {
    motivo = `Cronograma de ${diaSem}: <b>${letraBase}</b>${nota?` — ${nota}`:''}.`;
  }
  if(jiu) motivo += ' Jiu à noite — mantenha RIR 2-3 nos compostos.';
  return {
    musc: letraBase, motivo,
    jaTreinou: false, override: false, letraOriginal: null,
    schedRest: false, schedJiu: jiu, schedNota: nota
  };
}

function avaliar(p){
  const ref = REF();
  const musc = evs(p,"musc").filter(e=>e.data<=ref);
  const ultimo = musc[0];
  const days = dayset(p);
  const eH = temExtra(p,0), eO = temExtra(p,-1), eA = temExtra(p,1);

  /* ==== v30: Schedule fixo delega pra sugestaoTreino (anti-repetição universal) ==== */
  const sched = getSchedule(p);
  if(sched){
    const sug = sugestaoTreino(p, ref);
    if(!sug.musc){
      // Dia sem musc (recuperação/descanso)
      const fallbackD = ORDER[0];
      const win = { d:fallbackD, score:0, bloq:"sem musc hoje", notas:[], desde:0,
                    motivo: sug.motivo, schedJiu: sug.schedJiu, schedNota: sug.schedNota, schedRest: true };
      const resto = ORDER.filter(d=>d!==fallbackD).map(d=>({d,score:0,notas:[],desde:0}));
      return { win, resto, descanso:true, schedRest:true, schedJiu:sug.schedJiu };
    }
    const win = {
      d: sug.musc, score: 0,
      bloq: sug.jaTreinou ? "já treinou neste dia" : null,
      notas: sug.schedNota ? [sug.schedNota] : [],
      desde: 0,
      motivo: sug.motivo,
      schedJiu: sug.schedJiu, schedNota: sug.schedNota,
      antiRepeticao: sug.override, letraOriginal: sug.letraOriginal
    };
    const resto = ORDER.filter(d=>d!==sug.musc).map(d=>({d,score:0,notas:[],desde:0}));
    return { win, resto, descanso:false, schedRest:false, schedJiu:sug.schedJiu };
  }


  const desde = {};
  ORDER.forEach(d=>{ const u = musc.find(e=>e.dia===d); desde[d] = u ? dias(u.data) : 99; });

  const cand = ORDER.map(d=>{
    const c = days[d].cat;
    let score = Math.min(desde[d],14);
    const notas = []; let bloq = null;

    if(ultimo && ultimo.data===ref) bloq = "já treinou neste dia";
    else if(ultimo && days[ultimo.dia].cat===c && dias(ultimo.data) < 2)
      bloq = (c==="sup"?"superiores":"inferiores") + " em recuperação do " + ultimo.dia;

    if(p==="gabriel"){
      if(eA && d==="C"){ score -= 7; notas.push("tatame no dia seguinte e puxada pesada entrega a pegada morta para o kimono"); }
      else if(eH && d==="C"){ score -= 6; notas.push("puxada pesada não combina com o tatame do dia"); }
      else if(eO && d==="C"){ score -= 2; notas.push("pegada vem cansada do tatame da véspera, use straps"); }
      if((eH||eA) && d==="A"){ score += 3; notas.push("empurrar quase não usa pegada, é o que menos compromete o tatame"); }
      if(eA && d==="B"){ score += 1; notas.push("perna na véspera do tatame é aceitável, só não force a última série"); }
      if(d==="D"){
        if(eA){ score -= 3; notas.push("pule o farmer walk, tem tatame no dia seguinte"); }
        else if(eH||eO){ score -= 1; notas.push("farmer walk leve, a pegada já está em uso"); }
        else notas.push("dias livres à frente, bom momento para o trabalho de pegada");
      }
    }else{
      if(c==="inf"){
        if(eA){ score -= 6; notas.push("corrida no dia seguinte, perna hoje derruba o ritmo"); }
        else if(eH){ score -= 6; notas.push("correu no dia, perna logo depois atrapalha as duas coisas"); }
        else if(eO){ score -= 6; notas.push("correu na véspera, dê 48 h antes de perna"); }
      }else if(eH||eO||eA){ score += 2; notas.push("superiores não conflita com a corrida"); }
    }
    return {d,score,bloq,notas,desde:desde[d]};
  });

  const livres = cand.filter(x=>!x.bloq);
  const lista = (livres.length?livres:cand).sort((a,b)=> b.score-a.score || ORDER.indexOf(a.d)-ORDER.indexOf(b.d));
  const resto = cand.filter(x=>x.d!==lista[0].d).sort((a,b)=> (a.bloq?1:0)-(b.bloq?1:0) || b.score-a.score);
  const win = lista[0];

  const marcas = [eO&&"na véspera", eH&&"no dia", eA&&"no dia seguinte"].filter(Boolean);
  let motivo;
  if(win.notas.length) motivo = win.notas[0].charAt(0).toUpperCase()+win.notas[0].slice(1)+".";
  else if(ultimo) motivo = `Último treino foi o <b>${ultimo.dia}</b>${dias(ultimo.data)===0?" neste dia":" há "+dias(ultimo.data)+(dias(ultimo.data)===1?" dia":" dias")}. O ${win.d} é o que está parado há mais tempo.`;
  else motivo = "Sem registros ainda. Comece pelo A e siga a rotação.";
  if(marcas.length) motivo += ` <b>${meta(p).extra} marcado ${marcas.join(", ")}.</b>`;

  return { win:Object.assign({},win,{motivo}), resto, descanso: livres.length===0 };
}

/* ==========================================================================
   PaceScoring (v31) — histórico real dos últimos 14 dias + IA validadora
   -----------------------------------------------------------------------
   Módulo puro determinístico que:
     - carrega histórico de 14 dias (S.events)
     - calcula fadiga por grupo com decay meia-vida 2 dias
     - conta dias desde último estímulo por grupo
     - jiu conta como cardio + core + 30% fadiga em perna (MI leve)
     - devolve top-1 candidato + evita 48h entre grupos grandes
   Depois entrega tudo pra IA (edge function pace-sugestao-ia).
   ========================================================================== */
const PACE_IA_URL = 'https://ojqyjbzlkmsayxmigsay.supabase.co/functions/v1/pace-sugestao-ia';

const PACE_GRUPOS_LETRA = {
  gabriel: {
    A: ['peito','costas','triceps','biceps','core'],
    B: ['perna_ant','core'],
    C: ['costas','ombro','triceps','biceps'],
    D: ['perna_post','core','antebraco']
  },
  // v35: A glúteo/posterior · B costas + barra (TAF) · C quadríceps · D ombros + abdominal (TAF)
  eduarda: {
    A: ['perna_post','core'],
    B: ['costas','biceps','antebraco'],
    C: ['perna_ant','core'],
    D: ['ombro','peito','triceps','core']
  }
};
const PACE_META_SEMANAL = {
  gabriel: { peito:1, costas:2, perna_ant:1, perna_post:1, ombro:1, biceps:2, triceps:2, core:2, cardio:2, antebraco:1, panturrilha:0 },
  eduarda: { peito:1, costas:2, perna_ant:1, perna_post:1, ombro:2, biceps:1, triceps:1, core:3, cardio:2, panturrilha:0, antebraco:1 }
};
function _paceContribMusc(perfil, letra){
  const grupos = (PACE_GRUPOS_LETRA[perfil]||{})[letra] || [];
  const c = {};
  grupos.forEach(g=>{ c[g] = (g==='core'||g==='panturrilha'||g==='antebraco') ? 0.5 : 1.0; });
  return c;
}
function _paceContribJiu(){
  // v31.2: impactos ajustados — pesa na decisão, mas não zera. Consciência > bloqueio.
  return { cardio: 1.0, core: 0.7, perna_ant: 0.5, perna_post: 0.5, panturrilha: 0.4 };
}
function _paceContribAtiv(atividade){
  atividade = String(atividade||'').toLowerCase();
  if(atividade==='jiu') return _paceContribJiu();
  if(atividade==='corrida') return { cardio: 1.0, perna_ant: 0.4, perna_post: 0.4, panturrilha: 0.5 };
  if(atividade==='bike')    return { cardio: 0.8, perna_ant: 0.3, perna_post: 0.2 };
  if(atividade==='futebol') return { cardio: 1.0, perna_ant: 0.5, perna_post: 0.5, core: 0.3 };
  if(atividade==='caminhada') return { cardio: 0.4 };
  if(atividade==='natacao')   return { cardio: 1.0, costas: 0.3, ombro: 0.4, core: 0.3 };
  return {};
}
const PaceScoring = {
  carregarHistorico(perfil, n){
    n = Number(n||14);
    const hoje = REF();
    const limite = shift(-n);
    return (S.events||[])
      .filter(e=>e.perfil===perfil && e.data>=limite && e.data<=hoje)
      .sort((a,b)=> a.data<b.data ? 1 : -1);
  },
  calcularFadiga(perfil, hist){
    const hoje = new Date(REF()+'T12:00:00');
    const fad = {};
    (hist||[]).forEach(e=>{
      const dEv = new Date(e.data+'T12:00:00');
      const dias = Math.max(0, Math.floor((hoje - dEv)/86400000));
      const decay = Math.pow(0.5, dias/2);
      let contrib = {};
      if(e.tipo==='musc' && e.dia) contrib = _paceContribMusc(perfil, e.dia);
      else if(e.tipo==='extra')    contrib = _paceContribAtiv(e.atividade);
      Object.entries(contrib).forEach(([g,peso])=>{ fad[g] = (fad[g]||0) + peso*decay; });
    });
    return fad;
  },
  diasDesde(perfil, hist){
    const hoje = new Date(REF()+'T12:00:00');
    const all = new Set();
    Object.values(PACE_GRUPOS_LETRA[perfil]||{}).forEach(gs=> gs.forEach(g=> all.add(g)));
    all.add('cardio');
    const gap = {};
    all.forEach(g=>{ gap[g] = 999; });
    (hist||[]).forEach(e=>{
      let contrib = {};
      if(e.tipo==='musc' && e.dia) contrib = _paceContribMusc(perfil, e.dia);
      else if(e.tipo==='extra')    contrib = _paceContribAtiv(e.atividade);
      const dEv = new Date(e.data+'T12:00:00');
      const dias = Math.max(0, Math.floor((hoje - dEv)/86400000));
      Object.keys(contrib).forEach(g=>{
        if(contrib[g] >= 0.5 && dias < gap[g]) gap[g] = dias;
      });
    });
    return gap;
  },
  scoreCandidato(perfil){
    const hist = this.carregarHistorico(perfil, 14);
    const fad  = this.calcularFadiga(perfil, hist);
    const gap  = this.diasDesde(perfil, hist);
    const meta = PACE_META_SEMANAL[perfil] || {};
    const gruposDia = PACE_GRUPOS_LETRA[perfil] || {};
    const GRANDES = new Set(['peito','costas','perna_ant','perna_post']);

    // v31.2: pós-jiu vira consciência (não bloqueio). Fadiga já penaliza o score
    // via _paceContribJiu; a IA + flag avisoJiu cuidam da justificativa.
    const MS_GROUPS = new Set(['peito','costas','ombro','biceps','triceps','antebraco']);
    const MI_CORE   = new Set(['perna_ant','perna_post','panturrilha','core']);
    const hoje0 = new Date(REF()+'T12:00:00');
    const jiuDias = (hist||[])
      .filter(e=>e.tipo==='extra' && String(e.atividade||'').toLowerCase()==='jiu')
      .map(e=>Math.max(0, Math.floor((hoje0 - new Date(e.data+'T12:00:00'))/86400000)));
    const jiu24  = jiuDias.some(d=>d<=1);       // treinou jiu nas últimas 24h
    const jiu72_2x = jiuDias.filter(d=>d<=3).length >= 2; // sinal informativo, não bloqueio
    const jiu48    = jiuDias.some(d=>d<=2);

    const scores = ORDER.map(letra=>{
      const grupos = gruposDia[letra] || [];
      let s = 0, bloq = null;
      grupos.forEach(g=>{
        const w = meta[g] || 1;
        const gapG = gap[g]==null ? 999 : gap[g];
        const fadG = fad[g] || 0;
        s += (Math.min(gapG,7) * w) - fadG;
        if(GRANDES.has(g) && (fadG > 0.6 || gapG < 2)) bloq = g;
      });
      return { letra, score: s, bloq, grupos };
    });

    // Preferir letras livres. Se todas bloqueadas por regra pós-jiu, cair pra MS
    // ordenado por maior dias_desde; se nada de MS, sinalizar descanso.
    let livres = scores.filter(x=>!x.bloq);
    let fallbackDescanso = false;
    if(!livres.length){
      const somenteMS = scores.filter(x=>{
        const gs = x.grupos || [];
        return gs.length && gs.every(g=> MS_GROUPS.has(g));
      });
      if(somenteMS.length){
        // reordena MS por maior dias_desde do grupo primário
        somenteMS.sort((a,b)=>{
          const ga = Math.max(...a.grupos.map(g=> gap[g]==null?0:gap[g]));
          const gb = Math.max(...b.grupos.map(g=> gap[g]==null?0:gap[g]));
          return gb - ga;
        });
        livres = somenteMS;
      } else {
        fallbackDescanso = true;
      }
    }
    const lista = (livres.length ? livres : scores).sort((a,b)=> b.score - a.score);
    const win = lista[0];
    // v31.2: se o vencedor toca MI/core E houve jiu nas últimas 24h → marca aviso
    const winGrupos = fallbackDescanso ? [] : (win.grupos || []);
    const avisoJiu = !fallbackDescanso && jiu24 && winGrupos.some(g=>MI_CORE.has(g));
    const intensidade = fallbackDescanso ? 'descanso'
      : (avisoJiu ? 'leve'
        : (win.bloq ? 'leve' : (Object.values(fad).some(v=>v>1.5) ? 'moderada' : 'forte')));
    return {
      candidato: {
        letra: fallbackDescanso ? 'DESCANSO' : win.letra,
        grupos_alvo: winGrupos,
        intensidade,
        avisoJiu,
        descricao_sugerida: avisoJiu ? 'curto e leve (volume reduzido pós-jiu)' : null,
        bloqueio_pos_jiu: null,
        jiu_recente: { jiu24, jiu48, jiu72_2x }
      },
      fadiga: fad,
      dias_desde: gap,
      score_detalhado: scores,
      historico: hist.map(e=>({
        data: e.data,
        tipo: e.tipo,
        grupos: e.tipo==='musc' ? (gruposDia[e.dia]||[]) : Object.keys(_paceContribAtiv(e.atividade||'')),
        duracao_min: e.duracao || null,
        intensidade: e.intensidade || null,
        atividade: e.atividade || null,
        dia_musc: e.dia || null
      }))
    };
  }
};

const PaceIA = {
  cache: {},
  _boundOnce: false,
  async hydrate(){
    const holder = document.getElementById('pace-ia-card');
    if(!holder) return;
    const perfil = ui.perfil;
    const hoje = REF();

    let s;
    try { s = PaceScoring.scoreCandidato(perfil); }
    catch(err){ console.warn('[PaceScoring]', err); return; }
    const meta = PACE_META_SEMANAL[perfil] || {};

    const gaps = Object.entries(s.dias_desde)
      .filter(([g,d])=>d<99 && (meta[g]||0)>0)
      .sort((a,b)=> b[1]-a[1])
      .slice(0,3);
    const gapsHtml = gaps.map(([g,d])=>`<span class="pace-gap-chip">${g}: ${d}d</span>`).join('');
    const detTxt = `Regra: <b>${s.candidato.letra}</b> · alvo ${s.candidato.grupos_alvo.join(', ')} · ${s.candidato.intensidade}`;

    holder.innerHTML = `
      <div class="pace-ia-box">
        <div class="pace-ia-head">
          <div class="pace-ia-t">Por que esse treino hoje?</div>
          <button class="pace-ia-toggle" type="button" data-pace-toggle>▾</button>
        </div>
        <div class="pace-ia-body">
          <div class="pace-ia-det">${detTxt}</div>
          <div class="pace-ia-gaps">${gapsHtml || '<span class="pace-ia-muted">sem gaps grandes</span>'}</div>
          <div class="pace-ia-ai"><span class="pace-ia-muted">IA analisando os últimos 14 dias…</span></div>
        </div>
      </div>`;

    const tog = holder.querySelector('[data-pace-toggle]');
    if(tog) tog.onclick = (ev)=>{
      const box = holder.querySelector('.pace-ia-box');
      if(!box) return;
      box.classList.toggle('collapsed');
      ev.currentTarget.textContent = box.classList.contains('collapsed') ? '▸' : '▾';
    };

    const key = perfil+':'+hoje;
    if(this.cache[key]){ this._render(this.cache[key]); return; }

    const payload = {
      perfil, hoje,
      ultimos_14_dias: s.historico,
      meta_semanal: meta,
      candidato_regras: s.candidato,
      fadiga_atual: s.fadiga,
      dias_desde: s.dias_desde
    };
    try {
      const resp = await fetch(PACE_IA_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      if(!resp.ok){ this._renderErr('IA indisponível ('+resp.status+') — usando só as regras.'); return; }
      const j = await resp.json();
      this.cache[key] = j;
      this._render(j);
    } catch(e){
      this._renderErr('Offline ou rede falhou — usando só as regras.');
    }
  },
  _render(j){
    const holder = document.getElementById('pace-ia-card'); if(!holder) return;
    const aiEl = holder.querySelector('.pace-ia-ai'); if(!aiEl) return;
    const t = j.treino_hoje || {};
    const th = `<div class="pace-ia-th"><b>IA:</b> ${esc(String(t.letra||'?'))} — ${esc(String(t.nome||''))} · ${esc(String(t.intensidade||''))}</div>`;
    const jus = j.justificativa ? `<div class="pace-ia-jus">${esc(j.justificativa)}</div>` : '';
    const alerta = j.alerta ? `<div class="pace-ia-alerta">${pic("alert","sm")} ${esc(j.alerta)}</div>` : '';
    const prox = Array.isArray(j.proximos_3_dias) && j.proximos_3_dias.length
      ? '<div class="pace-ia-prox"><div class="pace-ia-prox-t">Próximos 3 dias</div>' +

function resumo(ex,sets){
  if(!sets) return null;
  const a = sets.map(s=>{
    if(!s) return null;
    if(ex.ty==="time") return s.sec?s.sec+"s":null;
    if(ex.ty==="reps") return s.reps||null;
    if(!s.kg&&!s.reps) return null;
    return (s.kg||"?")+"×"+(s.reps||"?");
  }).filter(Boolean);
  return a.length?a.join("  "):null;
}

/* Render seguro contra digitação: se o usuário está com foco num input
   editável (kg/reps/obs de série, campos [data-f] de exercício, [data-meta]
   de perfil), adia o render pra não destruir o DOM debaixo do teclado do
   iOS — que fecha silenciosamente e faz "focou mas não digita". */
function safeRender(){
  try{
    const ae = document.activeElement;
    if(ae && ae.matches && (
        ae.matches('input[data-cex]') ||
        ae.matches('input[data-cob]') ||
        ae.matches('input[data-f]')   ||
        ae.matches('[data-meta]')     ||
        ae.matches('textarea')
    )){
      clearTimeout(safeRender._t);
      safeRender._t = setTimeout(safeRender, 800);
      return;
    }
  }catch(e){}
  render();
}

/* --------------------------- Aviso pré-treino: conflito com schedule/plan --- */
function verificarConflitoIniciar(p, dEscolhido){
  const dataRef = REF();
  const sch = schedHoje(p);
  const avisos = [];
  if(sch){
    if(sch.musc && sch.musc !== dEscolhido){
      const diaSem = WDL[new Date(dataRef+"T12:00").getDay()];
      let av = `Schedule de ${diaSem} sugere treino ${sch.musc}${sch.nota?" ("+sch.nota+")":""}, mas você escolheu ${dEscolhido}.`;
      if(sch.jiu && (dEscolhido==="B" || dEscolhido==="D")) av += " Tem jiu à noite — pernas pesadas antes podem prejudicar o tatame.";
      avisos.push(av);
    } else if(!sch.musc && (dEscolhido==="B" || dEscolhido==="D") && sch.jiu){
      avisos.push(`Hoje é dia de recuperação + jiu à noite. Treino ${dEscolhido} (pernas) pode sobrecarregar antes do tatame.`);
    }
  }
  // v30: passa a letra escolhida efetiva pra conflitoPlan (não schedule bruto),
  // consistente com o card principal que também usa a letra pós-anti-repetição.
  const conf = (typeof conflitoPlan==="function") ? conflitoPlan(p, dataRef, dEscolhido) : null;
  if(conf && (dEscolhido==="B" || dEscolhido==="D") && (!sch || sch.musc===dEscolhido)){
    avisos.push(conf.msg.replace(/<[^>]+>/g,""));
  }
  return avisos.length ? avisos.join("\n\n") + "\n\nContinuar mesmo assim?" : null;
}

function sessaoCard(s,days,acoes){

    <span style="font-family:var(--mono);font-size:12px;color:var(--faint)">${brd(s.data)}</span></div>` +

      return r?`<div class="hist"><span class="n">${esc(ex.n)}</span><span class="v">${r}</span></div>`:""; }).join("") + (acoes||"") + `</div>`;
}

/* ---------- treino em andamento (rascunho datado) ---------- */
function marcaDraft(p, d){
  if(!S.draftMeta) S.draftMeta = {};
  const k = p+":"+d, m = S.draftMeta[k];
  if(!m || m.data !== REF()) S.draftMeta[k] = { data: REF(), inicio: Date.now() };
}
function limpaDraftMeta(p, d){ if(S.draftMeta) delete S.draftMeta[p+":"+d]; }
function contaSeries(t, dr){
  let total = 0, ok = 0, pre = 0;
  t.ex.forEach(e=>{ total += e.s; (dr[e.id]||[]).slice(0,e.s).forEach(x=>{ if(!x) return; if(x.ok) ok++; if(x.kg||x.reps||x.sec) pre++; }); });
  return { total, ok, pre };
}
/* Um treino só está "em andamento" se tem rascunho com valores iniciado HOJE e ainda não foi salvo. */
function sessaoAberta(p){
  const hoje = shift(0);
  for(const L of ORDER){
    const k = p+":"+L, m = S.draftMeta && S.draftMeta[k], dr = S.draft && S.draft[k], t = dayset(p)[L];
    if(m && m.data===hoje && dr && t && temValores(dr)) return Object.assign({ L, t, inicio:m.inicio }, contaSeries(t, dr));
  }
  return null;
}

/* ---------- toast com desfazer (fora do render) ---------- */
function toastUndo(msg, undo){
  const old = document.getElementById("pcToast"); if(old) old.remove();
  clearTimeout(toastUndo._t);
  const el = document.createElement("div"); el.id = "pcToast"; el.className = "pc-toast"; el.setAttribute("role","status");
  el.innerHTML = `<span>${esc(msg)}</span>${undo?`<button type="button">Desfazer</button>`:""}`;
  document.body.appendChild(el);
  if(undo) el.querySelector("button").onclick = ()=>{ el.remove(); undo(); };
  toastUndo._t = setTimeout(()=>el.remove(), undo ? 5000 : 2400);
}

/* teclado aberto: a barra fixa do treino vira bloco normal para não cobrir os campos */
(function(){
  if(typeof window==="undefined" || !window.visualViewport) return;
  let base = window.innerHeight;
  const chk = ()=> document.body && document.body.classList.toggle("kb-open", window.visualViewport.height < base - 150);
  window.visualViewport.addEventListener("resize", chk);
  window.addEventListener("orientationchange", ()=>setTimeout(()=>{ base = window.innerHeight; chk(); }, 400));
})();

function pcRefeicoesDia(p){

/* ------------------------------------------------------------------ HOJE */
function viewHoje(p,m){
  const days = dayset(p), hj = shift(0);
  const treinoDoDia = S.events.find(e=>e.perfil===p && e.tipo==="musc" && e.data===REF());
  const modoAmanha = !!(treinoDoDia && ui.off === 0);
  let r;
  if(modoAmanha){ const sv = ui.off; ui.off = sv + 1; try{ r = avaliar(p); } finally{ ui.off = sv; } }
  else r = avaliar(p);
  const d = days[r.win.d];
  const ab = ui.off===0 ? sessaoAberta(p) : null;

  let out = pcTopo() + `<h1 class="pc-h1">${pcTituloDia()}</h1>` + pcDataNav();

  // ---- destaque único: estado real do treino do dia ----

  if(ab){
    out += `<section class="pc-hl" aria-label="Treino em andamento"><div class="ey"><span class="dot"></span>Treino em andamento</div>
      <div class="ttl">${esc(ab.t.t)}</div>

    if(treinoDoDia) out += `<p class="pc-why">Você já registrou o treino ${treinoDoDia.dia} neste dia. Ao salvar este, o app pergunta se deve substituir.</p>`;
  } else if(treinoDoDia){
    const tf = days[treinoDoDia.dia];
    const nSer = Object.values(treinoDoDia.entries||{}).reduce((a,arr)=>a+(arr||[]).filter(x=>x&&(x.kg||x.reps||x.sec)).length,0);
    out += `<section class="pc-hl" aria-label="Treino concluído"><div class="ey">${pic("check","sm")}${ui.off===0?"Treino concluído":"Treino registrado neste dia"}</div>
      <div class="ttl">${esc(tf?tf.t:"Treino "+treinoDoDia.dia)}</div>

  } else if(r.schedRest && ui.off===0){
    const nota = r.win.schedNota || "Descanso";
    out += `<section class="pc-hl" aria-label="Dia sem musculação"><div class="ey">Pelo seu cronograma${tagJiu}</div>
      <div class="ttl">${esc(nota)}</div>
      <div class="meta">Sem musculação hoje</div>
      <button class="pc-btn hl" data-picktreino="1"><span>Treinar mesmo assim</span>${pic("arrow")}</button></section>`;
  } else {
    const passado = REF() < hj;
    out += `<section class="pc-hl" aria-label="Treino sugerido"><div class="ey">${ui.off===0?"Sugerido para hoje":passado?"Treino deste dia":"Sugerido para este dia"}${tagJiu}</div>
      <div class="ttl">${esc(d.t)}</div>
      <div class="meta">Treino ${r.win.d} · ${d.ex.length} exercícios · ${d.ex.reduce((a,e)=>a+e.s,0)} séries</div>
      <button class="pc-btn hl" data-abrir="${r.win.d}"><span>${passado?"Registrar treino "+r.win.d:"Iniciar treino"}</span>${pic("arrow")}</button></section>`;

    if(ui.off===0) out += `<div id="pace-ia-card" class="pace-ia-slot"></div>`;
  }

  // conflito (atividade planejada × pernas)
  const dataRef = REF();
  const conflito = conflitoPlan(p, dataRef, r.win.d);
  if(conflito && !treinoDoDia && !ab){
    out += `<div class="pc-warn">${conflito.msg} Sugestão: trocar para o <b>${conflito.sugere}</b>.

    out += pcSec("Sua semana", `<span class="aside">${feitos} de ${metaS} concluídos</span>`) + pcSemana(p);

  }

  // ---- atividades do dia ----
  const planHoje = getPlanejado(p, dataRef) || {};
  const quicks = ATIV_QUICK[p] || ["jiu","corrida","bike"];
  out += pcSec(ui.off===0 ? "Planejar hoje" : "Atividades do dia");
  out += `<div class="chips" style="margin-bottom:10px">${quicks.map(a=>{
    const on = !!planHoje[a];

      <button class="pc-btn sm ghost" data-rmatv="${e.id}">Remover</button></div>`;
  });
  out += `<button class="pc-row" data-atv="1">${pic("run")}<div class="main"><div class="t">Registrar atividade extra</div><div class="s">${esc(m.extra)}, corrida, bike, caminhada…</div></div><span class="chev">${pic("right")}</span></button>

  </div>`;
  return out;
}

  if(ui.edit){

      out += `<div class="card ed">
        <input class="ed-f" data-ex="${ex.id}" data-f="n" value="${esc(ex.n)}" placeholder="nome do exercício">
        <input class="ed-f" data-ex="${ex.id}" data-f="ap" value="${esc(ex.ap)}" placeholder="aparelho, pegada ou observação">
        <div class="ed-row">
          <input class="ed-f" style="margin:0;flex:1" data-ex="${ex.id}" data-f="p" value="${esc(ex.p)}" placeholder="repetições">
          <div class="step"><button data-step="${ex.id}:-1" aria-label="Menos uma série">−</button><span class="v">${ex.s}</span><button data-step="${ex.id}:1" aria-label="Mais uma série">+</button></div>
        </div>
        <div class="ed-row tys">${[["load","carga e reps"],["time","tempo"],["reps","só reps"]].map(([k,l])=>`<button class="ty ${ex.ty===k?"on":""}" data-ty="${ex.id}:${k}">${l}</button>`).join("")}</div>
        <div class="ed-row" style="margin-bottom:0">
          <button class="del" data-mv="${ex.id}:-1" style="width:48px" aria-label="Subir">↑</button>
          <button class="del" data-mv="${ex.id}:1" style="width:48px" aria-label="Descer">↓</button>
          <button class="del" data-del="${ex.id}">Remover exercício</button></div></div>`;
    });
    out += `<button class="addx" data-add="1">+ Adicionar exercício</button><button class="reset" data-reset="1">Restaurar o treino ${d} original</button><div style="height:70px"></div>`;
    return out;
  }

  if(Object.keys(ant).length) out += `<div style="display:flex;justify-content:flex-end"><button class="pc-link ac" data-loadlast="1">Preencher tudo com a última vez</button></div>`;
  const atual = pcSerieAtual(treino, dr);
  treino.ex.forEach(ex=>{
    const sets = dr[ex.id]||[], a = ant[ex.id]||[];
    const meta = [`${ex.s} séries · ${esc(ex.p)}${ex.ty==="time"?"":" rep"}`, `${segDescanso(ex)} s de descanso`, ex.no?esc(ex.no):"", ex.notas?esc(ex.notas):""].filter(Boolean).join(" · ");
    const obsAberto = !!ui.obsOpen[ex.id+":*"];
    out += `<section class="pc-ex" aria-label="${esc(ex.n)}">
      <div class="pc-exh"><button class="pc-exn ex-link" data-exhist="${ex.id}">${esc(ex.n)}<small>Ver histórico</small></button></div>
      <div class="pc-exm">${meta}</div>
      <input class="ap" data-ex="${ex.id}" data-f="ap" value="${esc(ex.ap)}" placeholder="aparelho, pegada ou observação" aria-label="Observação do exercício">
      <div class="pc-sh" aria-hidden="true"><span>Série</span><span>Anterior</span>${ex.ty==="load"?`<span class="c">kg</span><span class="c">Reps</span>`:`<span class="c" style="grid-column:span 2">${ex.ty==="time"?"Segundos":"Repetições"}</span>`}<span class="c">${pic("check","sm")}</span></div>`;
    for(let i=0;i<ex.s;i++){
      const s = sets[i]||{}, av = a[i]||null, cur = atual && atual.ex.id===ex.id && atual.i===i;
      out += `<div class="pc-sr set ${s.ok?"done":""} ${cur?"cur":""}"><span class="ix">${i+1}</span><span class="pv">${av?pcFmtSet(ex,av):"—"}</span>`;
      if(ex.ty==="load") out += pcCampo(s.kg,ex.id,i,"kg",`Série ${i+1}, carga em kg`) + pcCampo(s.reps,ex.id,i,"reps",`Série ${i+1}, repetições`);
      else if(ex.ty==="time") out += `<span class="w2">${pcCampo(s.sec,ex.id,i,"sec",`Série ${i+1}, segundos`)}</span>`;
      else out += `<span class="w2">${pcCampo(s.reps,ex.id,i,"reps",`Série ${i+1}, repetições`)}</span>`;
      out += `<button class="set-ok ${s.ok?"on":""}" data-setok="${ex.id}:${i}" aria-pressed="${!!s.ok}" aria-label="${s.ok?`Reabrir série ${i+1} para corrigir`:`Concluir série ${i+1}`}">${pic("check")}</button></div>`;
      const temObs = !!(s.obs && String(s.obs).trim());
      if(temObs || obsAberto || ui.obsOpen[ex.id+":"+i]) out += `<div class="pc-obs">${campoObs(s.obs,ex.id,i)}</div>`;
    }
    out += `<div class="pc-exf"><button class="pc-link" data-exobs="${ex.id}">${obsAberto?"Ocultar observações":pic("plus","sm")+"<span>Observação por série</span>"}</button></div></section>`;
  });
  if(temValores(dr) && ui.editId==null) out += `<div class="pc-exf" style="justify-content:flex-start;margin-top:8px"><button class="pc-link" style="color:var(--danger)" data-descartar="1">Descartar rascunho deste treino</button></div>`;
  out += `<p class="pc-note">“Anterior” = ${antEv?`último treino ${d} (${brd(antEv.data)})`:"sem registro anterior"}; é só sugestão, não execução. Toque em ${pic("check","sm")} para concluir a série${pref("autoPreencher")?" (campos vazios usam o valor anterior)":""}; toque de novo para corrigir.</p>`;
  // barra inferior: opera sobre o MESMO estado do ✓ da linha
  const btn = atual
    ? `<button class="pc-btn pri" id="pcConcluir" data-concluir="${atual.ex.id}:${atual.i}" aria-label="Concluir série ${atual.i+1} de ${esc(atual.ex.n)}">Concluir série ${atual.i+1}</button>`
    : `<button class="pc-btn pri" data-salvarbottom="1">${ui.editId!=null?"Atualizar treino":"Salvar treino"}</button>`;
  out += `<div class="pc-bottom"><div class="in2"><div class="note">${atual?`${esc(atual.ex.n)} · rascunho salvo`:"Todas as séries concluídas · rascunho salvo"}</div>${btn}</div></div>`;
  return out;
}

/* ------------------------------------------------------------------ EVOLUÇÃO */
function pcMelhor(ex, arr){
  const v = (arr||[]).filter(x=>x && (x.kg||x.reps||x.sec));
  if(!v.length) return null;
  if(ex.ty==="time") return v.reduce((b,x)=> num(x.sec)>num(b.sec)?x:b);
  if(ex.ty==="reps") return v.reduce((b,x)=> num(x.reps)>num(b.reps)?x:b);
  return v.reduce((b,x)=>{ const kx=num(x.kg), kb=num(b.kg); if(kx!==kb) return kx>kb?x:b; return num(x.reps)>num(b.reps)?x:b; });
}
function viewCal(p,m){
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+ui.mes);
  const ano = base.getFullYear(), mes = base.getMonth(), ym = `${ano}-${String(mes+1).padStart(2,"0")}`;
  const tab = ui.evoTab || "resumo";
  let out = pcTopo() + `<h1 class="pc-h1">Evolução</h1><p class="pc-sub">Seu histórico, com contexto.</p>`;
  out += pcTabs("evo", [["resumo","Resumo"],["cal","Calendário"]], tab);
  out += `<div class="pc-period"><button class="pc-ib" data-mes="-1" aria-label="Mês anterior">${pic("left")}</button>
    <span class="lbl">${cap(MES[mes])} de ${ano}</span>
    <button class="pc-ib" data-mes="1" aria-label="Próximo mês" ${ui.mes>=0?"disabled":""}>${pic("right")}</button></div>`;
  if(tab==="cal") return out + pcCalendario(p, m, ano, mes);

  const days = dayset(p), hj = shift(0);
  const ses = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.data.startsWith(ym)).sort((a,b)=>a.data<b.data?-1:1);
  const ab = ym===hj.slice(0,7) ? sessaoAberta(p) : null;
  const semana = ym===hj.slice(0,7) ? treinosNaSemana(p, inicioSemana(hj)) : null;
  out += `<section class="pc-hl" aria-label="Treinos concluídos no mês"><div class="ey">Treinos concluídos</div>
    <div style="display:flex;align-items:baseline;gap:14px;margin-top:6px"><span class="big">${ses.length}</span><span style="font-size:18px">em ${MES[mes]}</span></div>
    <div class="meta" style="margin:8px 0 0">${semana!=null?`${semana} nesta semana · meta de ${metaSemanal(p)}`:"mês encerrado"}${ab?" · 1 em andamento (não conta)":""}</div></section>`;

  // por exercício — só exercícios presentes nas sessões do período
  const todos = ORDER.flatMap(L=>(days[L]?days[L].ex:[]).map(ex=>Object.assign({L}, ex)));
  const presentes = todos.filter(ex=>ses.some(e=>e.dia===ex.L && pcMelhor(ex,(e.entries||{})[ex.id])));
  if(!presentes.find(x=>x.id===ui.evoEx)) ui.evoEx = presentes.length ? presentes[0].id : null;
  out += pcSec("Por exercício");
  if(!ui.evoEx){ out += `<p class="pc-note" style="font-size:15px">Nenhum treino concluído neste período.</p>`; }
  else{
    const ex = presentes.find(x=>x.id===ui.evoEx);
    const comE = ses.filter(e=>e.dia===ex.L && pcMelhor(ex,(e.entries||{})[ex.id]));
    const un = ex.ty==="time" ? "segundos" : ex.ty==="reps" ? "repetições" : "kg (como anotado no treino)";
    out += `<button class="pc-sel" data-evoex="1" aria-label="Escolher exercício"><span>${esc(ex.n)}</span>${pic("down")}</button>
      <p class="pc-note" style="font-size:14px">Treino ${ex.L} · unidade: ${un} · ${comE.length} ${comE.length===1?"sessão":"sessões"} no período</p>`;
    const a = comE[0], b = comE[comE.length-1], bA = pcMelhor(ex,a.entries[ex.id]), bB = pcMelhor(ex,b.entries[ex.id]);
    const val = x => ex.ty==="time" ? `${x.sec}<small> s</small>` : ex.ty==="reps" ? `${x.reps}<small> rep</small>` : `${x.kg}<small> kg</small> × ${x.reps||"—"}`;
    if(comE.length===1){
      out += `<div class="pc-cmp" style="grid-template-columns:1fr"><div><div class="d">${brd(a.data)} · Treino ${a.dia}</div><div class="v">${val(bA)}</div></div></div>
        <p class="pc-crit">Só uma sessão com este exercício no período — sem comparação.</p>`;
    } else {
      const dif = ex.ty==="time" ? num(bB.sec)-num(bA.sec) : ex.ty==="reps" ? num(bB.reps)-num(bA.reps) : num(bB.kg)-num(bA.kg);
      const u = ex.ty==="time" ? "s" : ex.ty==="reps" ? "rep" : "kg";
      out += `<div class="pc-cmp"><div><div class="d">${brd(a.data)} · primeira do mês</div><div class="v">${val(bA)}</div></div>
        <div><div class="d">${brd(b.data)} · última do mês</div><div class="v">${val(bB)}</div>
        <span class="pc-delta ${dif<0?"neg":""}">${dif>0?"+":""}${Math.round(dif*100)/100} ${u}</span></div></div>`;
    }
    out += `<p class="pc-crit">Série exibida: a de <b>maior ${ex.ty==="load"?"carga":ex.ty==="time"?"tempo":"número de repetições"}</b> em cada sessão${ex.ty==="load"?"; em empate, a com mais repetições":""}. Comparação entre a primeira e a última sessão do período que contêm este exercício.</p>`;
    out += `<div class="pc-list" style="margin-top:10px">${comE.slice().reverse().map(e=>`<button class="pc-row" style="min-height:56px" data-evodt="${e.data}">
      <div class="main"><div class="t" style="font-size:16px">${brd(e.data)} · Treino ${e.dia}</div><div class="s">${(e.entries[ex.id]||[]).filter(x=>x&&(x.kg||x.reps||x.sec)).map(x=>pcFmtSet(ex,x)).join(" · ")}</div></div>
      <span class="end">${pcFmtSet(ex, pcMelhor(ex,e.entries[ex.id]))}</span></button>`).join("")}</div>`;
  }

  // últimas sessões
  out += pcSec("Últimas sessões") + `<div class="pc-list">`;
  if(ab) out += `<button class="pc-row" data-continuar="${ab.L}"><div class="main"><div class="t">Hoje, ${brd(hj)}</div><div class="s">Treino ${ab.L} · ${esc(ab.t.t)}</div></div><span class="pc-pill">Em andamento</span><span class="chev">${pic("right")}</span></button>`;
  const lista = ses.slice().reverse().slice(0, 6);
  lista.forEach(e=>{ const t = days[e.dia];
    out += `<button class="pc-row" data-evodt="${e.data}"><div class="main"><div class="t">${e.data===hj?"Hoje, ":""}${brd(e.data)}</div><div class="s">Treino ${e.dia}${t?" · "+esc(t.t):""}</div></div>
      <span class="pc-pill" style="background:transparent"><span class="pc-st-ok" style="width:22px;height:22px">${pic("check")}</span>Concluído</span><span class="chev">${pic("right")}</span></button>`; });
  if(!ab && !lista.length) out += `<p class="pc-note" style="font-size:15px">Sem sessões neste período.</p>`;
  out += `</div>`;
  return out;
}
function pcCalendario(p, m, ano, mes){
  const days = dayset(p);
  const prim = new Date(ano,mes,1), nd = new Date(ano,mes+1,0).getDate(), inicio = (prim.getDay()+6)%7;
  const sel = REF(), hj = shift(0), ab = sessaoAberta(p);
  let out = `<div class="cal"><div class="grid">${["seg","ter","qua","qui","sex","sáb","dom"].map(x=>`<div class="gh">${x}</div>`).join("")}`;
  for(let i=0;i<inicio;i++) out += `<div class="cell out"></div>`;
  let nT=0, nX=0, nS=0;
  for(let d=1; d<=nd; d++){
    const dt = `${ano}-${String(mes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const mmAll = S.events.filter(e=>e.perfil===p&&e.tipo==="musc"&&e.data===dt), mm = mmAll[0];
    const xx = S.events.find(e=>e.perfil===p&&e.tipo==="extra"&&e.data===dt);
    const sk = skipDoDia(p,dt), prog = !mm && ab && dt===hj;
    if(mm) nT++; if(xx) nX++; if(sk) nS++;
    const skipCls = (!mm && !xx && sk) ? " skipd" : "";
    out += `<button class="cell${skipCls} ${dt===sel?"sel":""} ${dt===hj?"hoje":""}" data-dt="${dt}" aria-label="${d} de ${MES[mes]}${mm?", treino "+mm.dia+" concluído":prog?", treino em andamento":""}">
      <span class="n">${d}</span>
      ${mm?`<span class="l">${mm.dia}${mmAll.length>1?`<sup class="mult">${mmAll.length}</sup>`:""}</span>`
        : prog ? `<span class="l" style="color:var(--ac)">${pic("clock","sm")}</span>`
        : (sk&&!xx?`<span class="l skip" style="font-size:11px">—</span>`:`<span class="l" style="color:transparent">·</span>`)}
      ${xx?`<span class="dot"></span>`:`<span class="dot" style="background:transparent"></span>`}</button>`;
  }
  out += `</div></div>`;
  out += `<div class="pc-legend"><span><b style="color:var(--ac)">A–D</b> treino concluído</span><span>${pic("clock","sm")} em andamento</span><span><i class="x"></i>extra</span><span>— descanso</span></div>`;
  out += `<div class="pc-macros" style="margin-top:14px"><div><b>${nT}</b><span>musculação</span></div><div><b>${nX}</b><span>extras</span></div><div><b>${nS}</b><span>descansos</span></div></div>`;

  const ss = S.events.filter(e=>e.perfil===p&&e.tipo==="musc"&&e.data===sel);
  const xs = extrasDoDia(p,sel), sk = skipDoDia(p,sel);
  out += pcSec(cap(dataLonga(sel)));
  if(sk) out += `<div class="pc-row">${pic("moon")}<div class="main"><div class="t">Marcado como descanso</div>${sk.motivo?`<div class="s">${esc(sk.motivo)}</div>`:""}</div><button class="pc-btn sm ghost" data-skip="1">Desfazer</button></div>`;
  xs.forEach(e=>{
    out += `<div class="pc-row">${pic("run")}<div class="main"><div class="t">${e.atividade?esc(e.atividade):esc(m.extra)}</div><div class="s">${e.duracao?e.duracao+" min":""}${e.nota?(e.duracao?" · ":"")+esc(e.nota):""}</div></div><button class="pc-btn sm ghost" data-rmatv="${e.id}">Remover</button></div>`;
  });
  if(ss.length>1) out += `<div class="warn-dup">Há ${ss.length} treinos registrados neste dia. Exclua os repetidos ou edite para mudar a data.</div>`;
  ss.forEach(ev=>{ out += sessaoCard(ev,days,`<div class="cal-acts"><button data-caledit="${ev.id}">Editar ou mudar data</button><button class="del-x" data-caldel="${ev.id}">Excluir</button></div>`); });
  if(!ss.length && ab && sel===hj) out += `<button class="pc-row" data-continuar="${ab.L}"><div class="main"><div class="t">Treino ${ab.L} · ${esc(ab.t.t)}</div><div class="s">${ab.ok} de ${ab.total} séries concluídas</div></div><span class="pc-pill">Em andamento</span></button>`;
  if(!ss.length && sel<=hj && !(ab && sel===hj)) out += `<button class="pc-btn ghost cal-reg" style="margin-top:14px" data-calreg="1">${pic("plus","sm")} Registrar treino em ${brd(sel)}</button>`;
  if(!ss.length && !xs.length && !sk && !(ab && sel===hj)) out += `<p class="pc-note" style="font-size:14px">Sem registro neste dia.</p>`;
  return out;
}

/* ===================== v34 · semana, descanso, histórico, resumo ===================== */
const num = v => { const n = parseFloat(String(v==null?"":v).replace(",", ".")); return isFinite(n) ? n : 0; };
const e1rm = (kg, reps) => { kg = num(kg); reps = num(reps); return (kg>0 && reps>0) ? kg*(1+reps/30) : 0; };
function metaSemanal(p){
  const fixa = Number(pref("metaSemana")); if(fixa > 0) return fixa;
  const sch = getSchedule(p); if(!sch) return 4;
  return Object.values(sch).filter(x=>x && x.musc).length || 4;
}
function inicioSemana(isoData){ const d = new Date(isoData+"T12:00"); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return iso(d); }
function somaDias(isoData, n){ const d = new Date(isoData+"T12:00"); d.setDate(d.getDate()+n); return iso(d); }
function treinosNaSemana(p, ini){
  const fim = somaDias(ini, 6);
  return new Set(S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.data>=ini && e.data<=fim).map(e=>e.data)).size;
}
function semanaCard(p){
  const ref = REF(), ini = inicioSemana(ref), hojeIso = shift(0), meta = metaSemanal(p);
  const feitos = treinosNaSemana(p, ini);
  let seq = 0; for(let k=1;k<=52;k++){ if(treinosNaSemana(p, somaDias(ini, -7*k)) >= meta) seq++; else break; }
  if(feitos >= meta) seq++;
  const dias = ["S","T","Q","Q","S","S","D"].map((l,i)=>{
    const dt = somaDias(ini, i);
    const m = S.events.some(e=>e.perfil===p && e.tipo==="musc" && e.data===dt);
    const x = S.events.some(e=>e.perfil===p && e.tipo==="extra" && e.data===dt);
    return `<button class="wk-d ${m?"m":""} ${x?"x":""} ${dt===ref?"sel":""} ${dt===hojeIso?"hj":""}" data-dt="${dt}" aria-label="${dataLonga(dt)}"><span>${l}</span><i></i></button>`;
  }).join("");
  const pctv = Math.min(1, feitos/meta), C = 2*Math.PI*21;
  return `<div class="wk">
    <div class="wk-ring"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" class="bg"/><circle cx="25" cy="25" r="21" class="fg" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pctv)}"/></svg><b>${feitos}<small>/${meta}</small></b></div>
    <div class="wk-r"><div class="wk-t">${feitos>=meta?"Meta da semana batida":"Treinos nesta semana"}</div>
      <div class="wk-s">${seq>0?`${seq} ${seq===1?"semana":"semanas"} seguidas na meta`:(meta-feitos===1?"Falta 1 treino para a meta":`Faltam ${Math.max(0,meta-feitos)} treinos para a meta`)}</div>
      <div class="wk-days">${dias}</div></div>
  </div>`;
}
/* ---- cronômetro de descanso (fica fora do render) ---- */
const REST = { fim:0, total:0, t:null };
function segDescanso(ex){
  if(pref("descansoDoEx") && ex){
    if(Number(ex.d) > 0) return Math.round(Number(ex.d));
    const t = String(ex.descanso || ""); const n = parseFloat(t.replace(",", "."));
    if(isFinite(n) && n > 0) return /min/i.test(t) ? Math.round(n*60) : Math.round(n);

}
function iniciarDescanso(seg){
  REST.total = seg; REST.fim = Date.now() + seg*1000;
  clearInterval(REST.t); REST.t = setInterval(tickDescanso, 250); tickDescanso();
}
function pararDescanso(){ clearInterval(REST.t); REST.t=null; const el=document.getElementById("restBar"); if(el) el.remove(); }
function tickDescanso(){
  let el = document.getElementById("restBar");
  if(!el){
    el = document.createElement("div"); el.id = "restBar"; el.className = "rest-bar";
    el.innerHTML = `<div class="rb-p"><i></i></div><button data-rb="-15">−15</button><div class="rb-t"><small>Descanso</small><b></b></div><button data-rb="15">+15</button><button data-rb="0" class="rb-x">Pular</button>`;
    document.body.appendChild(el);
    el.querySelectorAll("[data-rb]").forEach(b=>b.onclick=()=>{
      const v = Number(b.dataset.rb); if(v===0){ pararDescanso(); return; }
      REST.fim = Math.max(Date.now(), REST.fim + v*1000); REST.total = Math.max(REST.total + v, 1); tickDescanso();
    });
  }
  const rest = Math.max(0, Math.round((REST.fim - Date.now())/1000));
  el.querySelector("b").textContent = `${Math.floor(rest/60)}:${String(rest%60).padStart(2,"0")}`;
  el.querySelector(".rb-p i").style.width = (REST.total ? (1 - rest/REST.total)*100 : 100) + "%";
  if(rest<=0){
    clearInterval(REST.t); REST.t=null;
    vibrar([220,120,220]);
    el.classList.add("fim"); el.querySelector("small").textContent = "Descanso concluído";
    setTimeout(()=>{ if(!REST.t) pararDescanso(); }, 2500);
  }
}
function concluirSerie(exId, i){

    if(!(cur.kg || cur.reps || cur.sec)){ toast("Preencha a série antes de concluir."); return; }
  }

  if(ui.editId==null) marcaDraft(p,d);

/* ---- histórico de um exercício ---- */
function abrirHistoricoEx(exId){
  const p = ui.perfil, ex = Object.values(dayset(p)).flatMap(x=>x.ex||[]).find(e=>e.id===exId); if(!ex) return;
  const lista = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.entries && e.entries[exId])
    .map(e=>{ const sets=(e.entries[exId]||[]).filter(x=>x&&(x.kg||x.reps||x.sec));
      const best = Math.max(0,...sets.map(x=>e1rm(x.kg,x.reps))); const top = Math.max(0,...sets.map(x=>num(x.kg)));
      return {data:e.data, sets, best, top}; })
    .filter(x=>x.sets.length).sort((a,b)=> a.data<b.data?1:-1);

  else{
    const pts = lista.slice(0,12).reverse(), vals = pts.map(x=>ex.ty==="load"?x.best:num(x.sets[0].sec||x.sets[0].reps));
    const mx = Math.max(...vals,1), mn = Math.min(...vals), W=300, H=70;
    const xy = vals.map((v,i)=>[pts.length>1? i*(W/(pts.length-1)) : W/2, H-6-((v-mn)/((mx-mn)||1))*(H-16)]);
    const pr = Math.max(...lista.map(x=>x.best));
    corpo += `<div class="hx-kpis"><div><b>${pr?Math.round(pr):"—"}</b><span>1RM estimado (kg)</span></div><div><b>${Math.max(...lista.map(x=>x.top))||"—"}</b><span>maior carga (kg)</span></div><div><b>${lista.length}</b><span>sessões</span></div></div>`;
    if(pts.length>1) corpo += `<svg class="hx-ch" viewBox="-6 0 312 ${H}" preserveAspectRatio="none"><polyline points="${xy.map(a=>a.join(",")).join(" ")}" /><g>${xy.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3"/>`).join("")}</g></svg><div class="hx-leg">evolução do 1RM estimado nas últimas ${pts.length} sessões</div>`;
    corpo += lista.slice(0,15).map(x=>`<div class="hx-row"><span class="dt">${brd(x.data)}</span><span class="v">${resumo(ex,x.sets)||""}</span>${x.best && x.best===pr?`<span class="pr">PR</span>`:""}</div>`).join("");

/* ---- resumo do treino (após salvar) ---- */
function resumoTreino(p, d, entries, data, evId){
  const days = dayset(p), treino = days[d]; let vol=0, series=0; const prs=[];
  treino.ex.forEach(ex=>{
    const sets = (entries[ex.id]||[]).filter(x=>x&&(x.kg||x.reps||x.sec));
    series += sets.length;
    sets.forEach(x=>{ vol += num(x.kg)*num(x.reps); });
    if(ex.ty==="load"){
      const best = Math.max(0,...sets.map(x=>e1rm(x.kg,x.reps)));
      const antes = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.data<data && String(e.id)!==String(evId) && e.entries && e.entries[ex.id])
        .flatMap(e=>e.entries[ex.id]||[]).map(x=>x?e1rm(x.kg,x.reps):0);
      const prevBest = Math.max(0,...antes);
      if(best>0 && prevBest>0 && best>prevBest+0.01){
        const bs = sets.reduce((a,x)=> e1rm(x.kg,x.reps)>e1rm(a.kg,a.reps)?x:a, sets[0]);
        prs.push({n:ex.n, txt:`${bs.kg} kg × ${bs.reps}`, ganho: Math.round((best/prevBest-1)*100)});
      }
    }
  });
  const ult = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.dia===d && e.data<data && String(e.id)!==String(evId))
    .sort((a,b)=>a.data<b.data?1:-1)[0];
  let volAnt = 0, serAnt = 0;
  if(ult) treino.ex.forEach(ex=>(ult.entries[ex.id]||[]).forEach(x=>{ if(x && (x.kg||x.reps||x.sec)){ serAnt++; volAnt += num(x.kg)*num(x.reps); } }));
  const comparavel = volAnt>0 && series >= serAnt*0.7;
  return { vol:Math.round(vol), series, prs, delta: comparavel ? Math.round((vol/volAnt-1)*100) : null, parcial: volAnt>0 && !comparavel, dataAnt: ult ? ult.data : null };
}
function mostrarResumo(d, data, r){

    <button class="sug-save" data-sugclose="1" style="margin-top:14px">Fechar</button>`;

function upd(p,d,exId,i,k,v){
  const key = p+":"+d;
  S.draft[key] = S.draft[key]||{};
  S.draft[key][exId] = S.draft[key][exId]||[];
  S.draft[key][exId][i] = Object.assign({}, S.draft[key][exId][i], {[k]:v});
  if(ui.editId==null) marcaDraft(p,d);
  ui.saved = false; salvaSoft(); atualizaBarraSalvar();
}
function atualizaBarraSalvar(){
  const bt = document.getElementById("salvar"); if(!bt) return;
  const treino = dayset(ui.perfil)[ui.dia]; if(!treino) return;
  const dr = S.draft[ui.perfil+":"+ui.dia] || {};
  const total = treino.ex.reduce((a,e)=>a+e.s,0);
  const feitas = treino.ex.reduce((a,e)=>a+((dr[e.id]||[]).slice(0,e.s).filter(x=>x&&(x.kg||x.reps||x.sec)).length),0);
  const pg = document.getElementById("pcProg");
  if(pg){ const c = contaSeries(treino, dr); pg.textContent = `${c.ok} de ${c.total} séries concluídas${c.pre>c.ok?` · ${c.pre-c.ok} preenchidas`:""}`; }
}
async function salvar(){
  if(ui.saving) return;
  const p = ui.perfil, d = ui.dia, key = p+":"+d, dr = S.draft[key]||{};
  if(!temValores(dr)){ toast("Preencha pelo menos uma série antes de salvar."); return; }
  const _c = contaSeries(dayset(p)[d], dr);
  if(_c.ok>0 && _c.pre>_c.ok && !(await confirmar(`Salvar o treino ${d}?\n\n${_c.ok} ${_c.ok===1?"série concluída":"séries concluídas"} e ${_c.pre-_c.ok} só ${_c.pre-_c.ok===1?"preenchida":"preenchidas"}. As preenchidas também entram no histórico — apague as que não fez.`, {ok:"Salvar"}))) return;
  // O treino é gravado na data mostrada no topo da tela (a que o usuário escolheu).
  const data = REF(), hoje = shift(0);
  if(data > hoje && !(await confirmar(`${dataLonga(data)} é uma data futura.\n\nRegistrar o treino nesse dia mesmo assim?`, {ok:"Registrar assim mesmo"}))) return;
  const outro = S.events.find(e=>e.perfil===p && e.tipo==="musc" && e.data===data && String(e.id)!==String(ui.editId));
  if(outro && !(await confirmar(`Já existe o treino ${outro.dia} registrado em ${brd(data)}.\n\nSe continuar, ele será substituído pelo treino ${d}.`, {ok:"Substituir", perigo:true}))) return;
  ui.saving = true;
  if(outro) S.events.splice(S.events.indexOf(outro), 1);
  const entries = clone(dr);
  Object.values(entries).forEach(arr=>(arr||[]).forEach(x=>{ if(x) delete x.ok; }));
  const ed = ui.editId!=null ? S.events.find(e=>String(e.id)===String(ui.editId)) : null;
  if(ed){ ed.data = data; ed.dia = d; ed.entries = entries; }
  else S.events.unshift({id:Date.now(),perfil:p,tipo:"musc",data,dia:d,entries});
  ui.editId = null;
  S.draft[key] = {};
  limpaDraftMeta(p,d);
  ui.obsOpen = {};
  const evSalvo = ed || S.events[0];
  const rs = resumoTreino(p, d, entries, data, evSalvo && evSalvo.id);
  pararDescanso();
  const ok = await store.set(S);
  ui.saved = true; ui.toast = ok?null:"Não deu para salvar. Anote as cargas e tente de novo.";
  vibrar([30,60,30]);
  render();
  setTimeout(()=>{
    ui.saved=false; ui.saving=false; ui.view="hoje"; ui.dia = avaliar(ui.perfil).win.d;
    window.scrollTo(0,0); render();
    if(ok && pref("resumo")) mostrarResumo(d, data, rs);
    else if(ok) toast(`Treino ${d} salvo.`);
  },700);
}

const SUGESTAO_URL = 'https://ojqyjbzlkmsayxmigsay.supabase.co/functions/v1/treino-sugestao';
function fecharSugestao(){
  const m = document.getElementById('sugModal'); if(m) m.innerHTML='';
  document.body.style.overflow='';

function _escSug(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _renderSugestaoShell(titulo, subtitulo, corpoHTML){
  const m = document.getElementById('sugModal');
  m.innerHTML = `<div class="sug-overlay" data-sugclose="1">
    <div class="sug-sheet" onclick="event.stopPropagation()">
      <div class="sug-head">
        <div><div class="t">${_escSug(titulo)}</div><div class="s">${_escSug(subtitulo)}</div></div>
        <button class="sug-close" data-sugclose="1" aria-label="Fechar">&times;</button>
      </div>
      <div id="sugCorpo">${corpoHTML}</div>

  </div>`;
  document.body.style.overflow='hidden';
  m.querySelectorAll('[data-sugclose]').forEach(el=>el.onclick=fecharSugestao);
}
async function abrirSugestao(refId){
  const p = ui.perfil, D = S.dieta[p], r = D.refs.find(x=>x.id===refId);
  if(!r) return;
  const perfilNome = p==='gabriel'?'Gabriel':'Eduarda';
  _renderSugestaoShell(r.nome||'Sugestões', 'Alternativas para essa refeição', `<div class="sug-load">Buscando 3 sugestões com IA...</div>`);
  try{
    const resp = await fetch(SUGESTAO_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ perfil: perfilNome, refeicao: r.nome||'', itens_atuais: r.itens||'' })
    });
    const j = await resp.json();
    if(!resp.ok || !j.sugestoes){
      document.getElementById('sugCorpo').innerHTML = `<div class="sug-err">Não consegui buscar sugestões agora. ${_escSug(j.error||'')}</div>`;
      return;
    }
    const html = j.sugestoes.map((s,i)=>`<div class="sug-card">
      <div class="n">&#127869;&#65039; ${_escSug(s.nome)}</div>
      <div class="i">${_escSug(s.itens)}</div>
      <button class="u" data-usar="${i}">Usar essa</button>
    </div>`).join('');
    document.getElementById('sugCorpo').innerHTML = html;
    document.querySelectorAll('#sugCorpo [data-usar]').forEach(b=>b.onclick=async ()=>{
      const idx = Number(b.dataset.usar);
      const s = j.sugestoes[idx];
      if(!s) return;
      const rNow = S.dieta[p].refs.find(x=>x.id===refId);
      if(!rNow) return;
      if(!(await confirmar(`Substituir os itens de "${rNow.nome}" pela sugestão "${s.nome}"?`, {ok:"Substituir"}))) return;
      rNow.itens = s.itens;
      if(s.nome && !rNow.nome) rNow.nome = s.nome;
      await store.set(S);
      fecharSugestao();
      render();
    });
  }catch(e){
    const c = document.getElementById('sugCorpo');
    if(c) c.innerHTML = `<div class="sug-err">Erro de rede: ${_escSug(String(e&&e.message||e))}</div>`;
  }
}

const COACH_URL = 'https://ojqyjbzlkmsayxmigsay.supabase.co/functions/v1/treino-coach';

function _resumoSeries(ex, sets){
  if(!Array.isArray(sets) || !sets.length) return '';
  return sets.map(s=>{
    if(!s) return null;
    if(ex && ex.ty==='time') return s.sec ? s.sec+'s' : null;
    if(ex && ex.ty==='reps') return s.reps || null;
    if(!s.kg && !s.reps) return null;
    return (s.kg||'?')+'x'+(s.reps||'?');
  }).filter(Boolean).join(' ');
}

function _historicoParaCoach(p, n){
  n = n || 20;
  const evts = S.events.filter(e=>e.perfil===p).sort((a,b)=> a.data<b.data?1:-1).slice(0,n);
  const plan = dayset(p);
  return evts.map(e=>{
    const base = { data: e.data, tipo: e.tipo };
    if(e.tipo==='musc'){
      const dia = plan[e.dia];
      const exArr = [];
      if(dia && dia.ex){
        dia.ex.forEach(ex=>{
          const sets = (e.entries||{})[ex.id];
          const s = _resumoSeries(ex, sets);
          if(s) exArr.push({ nome: ex.n, series: s });
        });
      }
      return Object.assign(base, { dia: e.dia, titulo: dia ? dia.t : '', exercicios: exArr });
    }
    if(e.tipo==='extra'){
      return Object.assign(base, { atividade: e.atividade||'', duracao: e.duracao||null, nota: e.nota||'' });
    }
    if(e.tipo==='skip'){
      return Object.assign(base, { motivo: e.motivo||'' });
    }
    return base;
  });
}

let _coachUltimo = null;

async function abrirCoach(){
  const p = ui.perfil, m = meta(p);
  const r = avaliar(p);
  const days = dayset(p);
  const d = days[r.win.d];
  const perfilNome = p==='gabriel' ? 'Gabriel' : 'Eduarda';
  const D = S.dieta[p] || {};
  const check = (S.check && S.check[p+':'+REF()]) || {};

  const limiteLog = shift(-14);
  const dieta_log = (D.log||[])
    .filter(l=>l.data>=limiteLog)
    .slice()
    .sort((a,b)=> (a.data<b.data)?1:(a.data>b.data)?-1:(a.hora<b.hora?1:-1))
    .slice(0,30)
    .map(l=>({ data:l.data, hora:l.hora, refeicao:l.refNome, texto:l.texto }));

  const payload = {
    perfil: p,
    hoje: REF(),
    plano_dia_sugerido: {
      id: r.win.d,
      nome: d.t,
      ex: d.ex.map(x=>({ n:x.n, p:x.p, s:x.s, ty:x.ty }))
    },
    historico_recente: _historicoParaCoach(p, 20),
    dieta_atual: {
      alvo: D.alvo || {},
      refs: (D.refs||[]).map(r=>({ nome:r.nome, itens:r.itens })),
      extras: (D.extras||[]).map(x=>({ nome:x.nome })),
      nota: D.nota || ''
    },
    dieta_log,
    checks: check,
    schedule: getSchedule(p) || null,
    dias_tipo: getDietaDias(p) || null,
    alvos_dia: getAlvosDia(p) || null,
    planejado_hoje: getPlanejado(p, REF()) || {},
    planejado_amanha: getPlanejado(p, shift(1)) || {},
    planejado_semana: (function(){
      const out = {};
      for(let i=0;i<7;i++){
        const iso = shift(i);
        const pl = getPlanejado(p, iso);
        if(pl && Object.keys(pl).length){
          const d = new Date(iso+"T12:00");
          out[WDK[d.getDay()]+"_"+iso] = pl;
        }
      }
      return out;
    })()
  };

  _renderSugestaoShell(
    'Análise do coach',
    `${perfilNome} · ${brd(REF())||'hoje'}`,
    `<div class="sug-load">O coach está analisando seu histórico, dieta e recuperação...<br><br><span style="font-size:11px;color:var(--faint)">isso leva uns 5–10 segundos</span></div>`
  );

  try{
    const resp = await fetch(COACH_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const j = await resp.json();
    if(!resp.ok){
      document.getElementById('sugCorpo').innerHTML = `<div class="sug-err">Não consegui buscar a análise agora. ${_escSug(j.error||resp.status)}</div>`;
      return;
    }
    _coachUltimo = j;
    _renderCoach(j);
  }catch(e){
    const c = document.getElementById('sugCorpo');
    if(c) c.innerHTML = `<div class="sug-err">Erro de rede: ${_escSug(String(e&&e.message||e))}</div>`;
  }
}

function _extraiLetraDia(reco){
  const m = String(reco||'').match(/[A-D]/);
  return m ? m[0] : null;
}

  }

      <div class="hd"><span class="em">&#129382;</span><span>Dieta hoje</span></div>
      <div class="coach-body">${_escSug(j.dieta_hoje)}</div>

  if(j.alerta_recuperacao && String(j.alerta_recuperacao).trim()){

  document.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{
    const k = ui.perfil+":"+REF(), id = b.dataset.chk;
    const mk = S.check[k] || {};
    const atual = mk[id] || null;
    if(atual===null) mk[id] = "ok";
    else if(atual==="ok") mk[id] = "no";
    else delete mk[id];
    S.check[k] = mk; store.set(S); render(); });
  document.querySelectorAll("[data-mealmenu]").forEach(b=>b.onclick=()=>abrirMealMenu(b.dataset.mealmenu));
  document.querySelectorAll("[data-diario]").forEach(b=>b.onclick=()=>abrirDiario());
  document.querySelectorAll("[data-openia]").forEach(b=>b.onclick=()=>{ if(typeof abrirCoach==='function') abrirCoach(); });
  document.querySelectorAll("[data-metas]").forEach(b=>b.onclick=()=>{ ui.view="config"; render(); window.scrollTo(0,0); });
  document.querySelectorAll("[data-dieta]").forEach(el=>el.oninput=()=>{
    const D = S.dieta[ui.perfil], parts = el.dataset.dieta.split(".");
    if(parts[0]==="alvo") D.alvo[parts[1]] = el.value;
    else if(parts[0]==="nota") D.nota = el.value;
    else if(parts[0]==="ref"){ const r = D.refs.find(x=>x.id===parts[1]); if(r) r[parts[2]] = el.value; }
    else if(parts[0]==="extra"){ const x = D.extras.find(y=>y.id===parts[1]); if(x) x[parts[2]] = el.value; }
    salvaSoft(); });

  /* ---- Config handlers ---- */
  document.querySelectorAll("[data-cfp]").forEach(b=>b.onclick=()=>{
    const alvo = b.dataset.cfp;
    if(alvo === ui.perfil) return;
    ui.perfil = alvo; ui.dia = avaliar(alvo).win.d; ui.edit=false; ui.edieta=false;
    render();
  });
  /* IMPORTANTE: filtrar por button[data-theme]. Sem o `button` prefixo, o
     selector pega também <html data-theme="dark">, e como esse elemento é
     ancestral de TUDO, qualquer click no app bubbles até ele e dispara
     render() — destruindo o input embaixo do dedo do usuário. Era o bug
     do "tap curto não foca, long-press foca". */
  document.querySelectorAll("button[data-theme]").forEach(b=>b.onclick=()=>{
    setTheme(b.dataset.theme); render();
  });
  document.querySelectorAll("button[data-pref]").forEach(b=>b.onclick=()=>{
    const k = b.dataset.pref; setPref(k, !pref(k));
    if(k==="descanso" && !pref(k)) pararDescanso();
    if(k==="vibrar" && pref(k)) vibrar(15);
    render();
  });
  document.querySelectorAll("button[data-prefv]").forEach(b=>b.onclick=()=>{
    setPref(b.dataset.prefv, Number(b.dataset.v)); render();
  });
  document.querySelectorAll("[data-editplan]").forEach(b=>b.onclick=()=>{
    ui.dia = avaliar(ui.perfil).win.d; ui.view="treino"; ui.edit=true; render(); window.scrollTo(0,0);
  });
  document.querySelectorAll("[data-editdieta]").forEach(b=>b.onclick=()=>{
    ui.view="dieta"; ui.edieta=true; render(); window.scrollTo(0,0);
  });
  document.querySelectorAll("[data-logout]").forEach(b=>b.onclick=async ()=>{
    if(await confirmar("Sair da conta?", {ok:"Sair", perigo:true})) logout();
  });
  /* [data-meta] tratado pela delegação global (ligarDelegacaoUmaVez) */
}

/* Delegação global de INPUT nas séries — registrada UMA vez.
   Corrige bug em que oninput deixava de disparar após re-renders (pull remoto,
   store.set etc). Como o listener vive no document, novos inputs criados por
   render() automaticamente são cobertos — sem race, sem re-registro. */
let _delegacaoInputLigada = false;
function ligarDelegacaoUmaVez(){
  if(_delegacaoInputLigada) return;
  _delegacaoInputLigada = true;
  // v25: delegação global de clique pros chips de Planejar hoje (garantia extra
  // além dos onclick registrados em ligar()). Cobre casos em que o re-render
  // ainda não rodou ou o listener direto foi perdido.
  document.addEventListener('click', function(e){
    const el = e.target && e.target.closest ? e.target.closest('[data-planq]') : null;
    if(el){
      e.preventDefault();
      const ativ = el.getAttribute('data-planq');
      try{ togglePlanejado(ui.perfil, REF(), ativ); }catch(err){ console.error('[deleg planq]', err); }
      return;
    }
    const el2 = e.target && e.target.closest ? e.target.closest('[data-plansugmusc]') : null;
    if(el2){
      e.preventDefault();
      const letra = el2.getAttribute('data-plansugmusc');
      try{ setPlanejadoMusc(ui.perfil, REF(), letra); }catch(err){ console.error('[deleg plansugmusc]', err); }
      return;
    }
  }, false);
  document.addEventListener('input', function(e){
    const el = e.target;
    if(!el || !el.matches) return;
    // kg / reps / obs de série
    if(el.matches('input[data-cex]')){
      const exId = el.dataset.cex, i = Number(el.dataset.ci), k = el.dataset.ck;
      const raw = el.value;
      const v = (k==="obs") ? raw : String(raw).replace(",",".");
      upd(ui.perfil, ui.dia, exId, i, k, v);
      return;
    }
    // título do treino / campos de exercício em modo edit
    if(el.matches('input[data-f]')){
      const f = el.dataset.f;
      if(f==="titulo"){ dayset(ui.perfil)[ui.dia].t = el.value; }
      else { const ex = acha(el.dataset.ex); if(ex) ex[f] = el.value; }
      salvaSoft();
      return;
    }
    // config de perfil (peso/kcal/prot etc)
    if(el.matches('[data-meta]')){
      if(!S.metas) S.metas={};
      if(!S.metas[ui.perfil]) S.metas[ui.perfil] = {};
      S.metas[ui.perfil][el.dataset.meta] = el.value;
      salvaSoft();
      return;
    }
  }, false); // bubble phase — safer on iOS

  // v31: se a tela do dia tem o slot PaceIA, hidrata (determinístico já cai imediato + IA async)
  try { if(ui.view==='hoje' && document.getElementById('pace-ia-card')) PaceIA.hydrate(); }
  catch(err){ console.warn('[PaceIA hydrate]', err); }
}

/* ================================================================ início */
(async function(){
  const AUTH = getAuth();
  if(!AUTH){ mostraLogin(); return; }
  ligarDelegacaoUmaVez();
  await syncEngine.bootstrap();
  if(!S.events) S.events = [];
  if(!S.draft) S.draft = {};
  if(!S.plan) S.plan = { gabriel: clone(BASE.gabriel.days), eduarda: clone(BASE.eduarda.days) };
  if(!S.dieta) S.dieta = clone(DIETA);
  if(!S.check) S.check = {};
  if(!S.metas) S.metas = {};
  Object.keys(S.check).forEach(k=>{
    if(Array.isArray(S.check[k])){
      const novo = {}; S.check[k].forEach(id=>novo[id]="ok"); S.check[k] = novo;
    }
  });
  ["gabriel","eduarda"].forEach(p=>{
    if(!S.dieta[p]) S.dieta[p] = clone(DIETA[p]);
    if(!Array.isArray(S.dieta[p].log)) S.dieta[p].log = [];
    if(Array.isArray(S.dieta[p].refs)) S.dieta[p].refs.forEach(r=>{ if(typeof r.hora !== 'string') r.hora = ''; });
  });
  ORDER.forEach(d=>{ ["gabriel","eduarda"].forEach(p=>{
    if(!S.plan[p][d]) S.plan[p][d] = clone(BASE[p].days[d]);
    S.plan[p][d].ex.forEach(e=>{ if(e.ap===undefined) e.ap=""; }); }); });
  // Seed schedule/dias/alvos_dia se faltarem (v22)
  if(S.plan.gabriel && !S.plan.gabriel.schedule) S.plan.gabriel.schedule = clone(SCHED_GABRIEL);
  if(S.plan.eduarda && !S.plan.eduarda.schedule) S.plan.eduarda.schedule = clone(SCHED_EDUARDA);
  if(S.dieta.gabriel){
    if(!S.dieta.gabriel.dias) S.dieta.gabriel.dias = clone(DIETA_DIAS_GABRIEL);
    if(!S.dieta.gabriel.alvos_dia) S.dieta.gabriel.alvos_dia = clone(DIETA_ALVOS_DIA_GABRIEL);
    // v27: garante presença dos novos tipos de dia jejum / jejum_jiu
    if(S.dieta.gabriel.alvos_dia){
      if(!S.dieta.gabriel.alvos_dia.jejum) S.dieta.gabriel.alvos_dia.jejum = clone(DIETA_ALVOS_DIA_GABRIEL.jejum);
      if(!S.dieta.gabriel.alvos_dia.jejum_jiu) S.dieta.gabriel.alvos_dia.jejum_jiu = clone(DIETA_ALVOS_DIA_GABRIEL.jejum_jiu);
    }
    // Migração: remove extras x1/x2 (água/creatina) — agora só r1 tem hidratação
    if(Array.isArray(S.dieta.gabriel.extras)){
      S.dieta.gabriel.extras = S.dieta.gabriel.extras.filter(x=>x && x.id!=='x1' && x.id!=='x2');
    }
  }
  if(S.dieta.eduarda){
    if(!S.dieta.eduarda.dias) S.dieta.eduarda.dias = clone(DIETA_DIAS_EDUARDA);
    if(!S.dieta.eduarda.alvos_dia) S.dieta.eduarda.alvos_dia = clone(DIETA_ALVOS_DIA_EDUARDA);
  }
  // v23: Sistema de atividades planejadas (jiu/corrida/futebol/bike + override musc por dia)
  if(!S.planejado) S.planejado = {gabriel:{},eduarda:{}};
  if(!S.planejado.gabriel) S.planejado.gabriel = {};
  if(!S.planejado.eduarda) S.planejado.eduarda = {};
  try{
    Object.keys(S.draft||{}).forEach(k=>{
      const [pp,dd] = k.split(":"); const ant = ultimaSessao(pp,dd);
      if(Object.keys(ant).length && JSON.stringify(S.draft[k])===JSON.stringify(ant)) S.draft[k] = {};
    });
  }catch(e){}
  // v35: aplica uma única vez o novo B/D da Eduarda (costas/ombro + TAF) e corrige as notas da semana
  let migrouPlano = false;
  try{
    if(!S.planVer) S.planVer = {};
    if((S.planVer.eduarda||0) < 35 && S.plan.eduarda){
      S.plan.eduarda.B = clone(EDU_V35.B);
      S.plan.eduarda.D = clone(EDU_V35.D);
      const sc = S.plan.eduarda.schedule;
      if(sc) Object.keys(SCHED_EDUARDA).forEach(k=>{ if(sc[k] && sc[k].musc===SCHED_EDUARDA[k].musc) sc[k].nota = SCHED_EDUARDA[k].nota; });
      S.planVer.eduarda = 35; migrouPlano = true;
    }
  }catch(e){ console.warn('[migração plano v35]', e); }
  ui.perfil = AUTH.perfil;
  ui.dia = avaliar(ui.perfil).win.d;
  render();
  syncEngine.start();
  if(migrouPlano) store.set(S);
})();
</script>

    .map(e=>{ const sets=(e.entries[exId]||[]).filter(x=>x&&(x.kg||x.reps||x.sec));
      const best = Math.max(0,...sets.map(x=>e1rm(x.kg,x.reps))); const top = Math.max(0,...sets.map(x=>num(x.kg)));
      return {data:e.data, sets, best, top}; })
    .filter(x=>x.sets.length).sort((a,b)=> a.data<b.data?1:-1);

  if(!lista.length) corpo = `<div class="sug-load" style="padding:28px 10px">Ainda sem registros deste exercício.</div>`;
  else{
    const pts = lista.slice(0,12).reverse(), vals = pts.map(x=>ex.ty==="load"?x.best:num(x.sets[0].sec||x.sets[0].reps));
    const mx = Math.max(...vals,1), mn = Math.min(...vals), W=300, H=70;
    const xy = vals.map((v,i)=>[pts.length>1? i*(W/(pts.length-1)) : W/2, H-6-((v-mn)/((mx-mn)||1))*(H-16)]);
    const pr = Math.max(...lista.map(x=>x.best));
    corpo += `<div class="hx-kpis"><div><b>${pr?Math.round(pr):"—"}</b><span>1RM estimado (kg)</span></div><div><b>${Math.max(...lista.map(x=>x.top))||"—"}</b><span>maior carga (kg)</span></div><div><b>${lista.length}</b><span>sessões</span></div></div>`;

function resumoTreino(p, d, entries, data, evId, tUsado){
  const days = dayset(p), treino = tUsado || days[d]; let vol=0, series=0; const prs=[];
  treino.ex.forEach(ex=>{
    const sets = (entries[ex.id]||[]).filter(x=>x&&(x.kg||x.reps||x.sec));
    series += sets.length;
    sets.forEach(x=>{ vol += num(x.kg)*num(x.reps); });
    if(ex.ty==="load"){
      const best = Math.max(0,...sets.map(x=>e1rm(x.kg,x.reps)));
      const antes = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.data<data && String(e.id)!==String(evId) && e.entries && e.entries[ex.id])
        .flatMap(e=>e.entries[ex.id]||[]).map(x=>x?e1rm(x.kg,x.reps):0);
      const prevBest = Math.max(0,...antes);
      if(best>0 && prevBest>0 && best>prevBest+0.01){
        const bs = sets.reduce((a,x)=> e1rm(x.kg,x.reps)>e1rm(a.kg,a.reps)?x:a, sets[0]);
        prs.push({n:ex.n, txt:`${bs.kg} kg × ${bs.reps}`, ganho: Math.round((best/prevBest-1)*100)});
      }
    }
  });
  const ult = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.dia===d && e.data<data && String(e.id)!==String(evId))
    .sort((a,b)=>a.data<b.data?1:-1)[0];
  let volAnt = 0, serAnt = 0;
  if(ult) treino.ex.forEach(ex=>(ult.entries[ex.id]||[]).forEach(x=>{ if(x && (x.kg||x.reps||x.sec)){ serAnt++; volAnt += num(x.kg)*num(x.reps); } }));
  const comparavel = volAnt>0 && series >= serAnt*0.7;
  return { vol:Math.round(vol), series, prs, delta: comparavel ? Math.round((vol/volAnt-1)*100) : null, parcial: volAnt>0 && !comparavel, dataAnt: ult ? ult.data : null };
}

/* o: { entries, rapido } quando o conteúdo já foi montado por finalizarTreino (encerrar antes do fim);
   chamado direto pelo botão, recebe o evento do clique e grava o rascunho como está */
async function salvar(o){
  o = (o && o.entries) ? o : null;
  if(ui.saving) return;
  const p = ui.perfil, d = ui.dia, key = p+":"+d, dr = S.draft[key]||{};
  if(!o){
    if(!temValores(dr)){ toast("Preencha pelo menos uma série antes de salvar."); return; }
    const _c = contaSeries(treinoSessao(p, d), dr);
    if(_c.ok>0 && _c.pre>_c.ok && !(await confirmar(`Salvar o treino ${d}?\n\n${_c.ok} ${_c.ok===1?"série concluída":"séries concluídas"} e ${_c.pre-_c.ok} só ${_c.pre-_c.ok===1?"preenchida":"preenchidas"}. As preenchidas também entram no histórico — apague as que não fez.`, {ok:"Salvar"}))) return;
  }
  // O treino é gravado na data mostrada no topo da tela (a que o usuário escolheu).
  const data = REF(), hoje = shift(0);
  if(data > hoje && !(await confirmar(`${dataLonga(data)} é uma data futura.\n\nRegistrar o treino nesse dia mesmo assim?`, {ok:"Registrar assim mesmo"}))) return;
  const outro = S.events.find(e=>e.perfil===p && e.tipo==="musc" && e.data===data && String(e.id)!==String(ui.editId));
  if(outro && !(await confirmar(`Já existe o treino ${outro.dia} registrado em ${brd(data)}.\n\nSe continuar, ele será substituído pelo treino ${d}.`, {ok:"Substituir", perigo:true}))) return;
  ui.saving = true;
  const tUsado = treinoSessao(p, d), mUsado = metaSessao(p, d) || {};
  const extraEv = ev=>{
    ["trocas","curto","leve"].forEach(k=>delete ev[k]);
    if(mUsado.trocas && Object.keys(mUsado.trocas).length) ev.trocas = clone(mUsado.trocas);
    if(mUsado.curto) ev.curto = true;
    if(mUsado.leve) ev.leve = true;
  };
  if(outro) S.events.splice(S.events.indexOf(outro), 1);
  const entries = o ? clone(o.entries) : clone(dr);
  Object.values(entries).forEach(arr=>(arr||[]).forEach(x=>{ if(x) delete x.ok; }));
  const ed = ui.editId!=null ? S.events.find(e=>String(e.id)===String(ui.editId)) : null;
  if(ed){ ed.data = data; ed.dia = d; ed.entries = entries; delete ed.rapido; extraEv(ed); }
  else {
    const novo = {id:Date.now(),perfil:p,tipo:"musc",data,dia:d,entries};
    if(o && o.rapido) novo.rapido = o.rapido;   // nº de séries que entraram com o valor da última vez
    extraEv(novo);
    S.events.unshift(novo);
  }
  ui.prVisto = {};
  ui.editId = null;
  S.draft[key] = {};
  limpaDraftMeta(p,d);
  ui.obsOpen = {};
  const evSalvo = ed || S.events[0];
  const rs = resumoTreino(p, d, entries, data, evSalvo && evSalvo.id, tUsado);
  pararDescanso();
  const ok = await store.set(S);
  ui.saved = true; ui.toast = ok?null:"Não deu para salvar. Anote as cargas e tente de novo.";
  vibrar([30,60,30]);
  render();
  setTimeout(()=>{
    ui.saved=false; ui.saving=false; ui.view="hoje"; ui.dia = avaliar(ui.perfil).win.d;
    window.scrollTo(0,0); render();
    if(ok && pref("resumo") && rs.series>0) mostrarResumo(d, data, rs);
    else if(ok) toast(`Treino ${d} salvo.`);
  },700);
}

/* ===================== v43 · encerrar antes do fim e marcar treino como feito ===================== */
/* Monta o que entra no histórico sem exigir o ✓ em cada série.
   modo "feitas": só as séries concluídas; "preenchidas": as séries com valor;
   "todas": todas as séries do plano, e as vazias recebem o valor do último registro do exercício.
   Uma observação escrita numa série que fica de fora é mantida (sem valores). */
function entradasParaSalvar(p, d, dr, modo){
  const t = treinoSessao(p, d), ant = modo==="todas" ? ultimaSessao(p, d) : {}, out = {};
  let usouAnterior = 0, series = 0;
  const temV = s => !!(s && (s.kg || s.reps || s.sec));
  const soObs = s => (s && s.obs && String(s.obs).trim()) ? { obs: s.obs } : null;
  if(!t) return { entries: out, usouAnterior, series };
  t.ex.forEach(ex=>{
    const arr = (dr||{})[ex.id] || [], a = ant[ex.id] || [], lin = [];
    for(let i=0; i<ex.s; i++){
      const s = arr[i] ? Object.assign({}, arr[i]) : null;
      let r = null;
      if(modo==="feitas") r = (s && s.ok && temV(s)) ? s : soObs(s);
      else if(modo==="preenchidas") r = temV(s) ? s : soObs(s);
      else if(temV(s)) r = s;
      else {
        const v = a[i] || {}, novo = {};
        ["kg","reps","sec"].forEach(k=>{ if(v[k]) novo[k] = v[k]; });
        if(temV(novo)){ r = Object.assign(s || {}, novo); usouAnterior++; }
        else r = soObs(s);
      }
      if(r){ delete r.ok; if(temV(r)) series++; }
      lin.push(r);
    }
    while(lin.length && lin[lin.length-1]==null) lin.pop();
    if(lin.length) out[ex.id] = lin;
  });
  return { entries: out, usouAnterior, series };
}

/* Folha com várias opções (mesmo visual da confirmação). Devolve a chave escolhida ou null. */
function escolher(titulo, corpo, opcoes, o){
  o = o || {};
  return new Promise(res=>{

    if(velho){ try{ velho._fim && velho._fim(false); }catch(e){} }

    el.innerHTML = `<div class="cfm-bg" data-k=""></div>

        <div class="cfm-t" id="cfmT">${esc(titulo)}</div>${corpo?`<div class="cfm-x">${esc(corpo)}</div>`:""}
        <div class="cfm-ops">${opcoes.map(x=>`<button class="cfm-op${x.pri?" pri":""}" data-k="${esc(x.k)}"><span class="ot">${esc(x.t)}${x.tag?`<em>${esc(x.tag)}</em>`:""}</span>${x.s?`<span class="os">${esc(x.s)}</span>`:""}</button>`).join("")}</div>
        <button class="cfm-no cfm-cx" data-k="">${esc(o.cancelar||"Cancelar")}</button>
      </div>`;
    let feito = false;

    function fim(v){ if(feito) return; feito = true; document.removeEventListener("keydown", kd);
      el.id = ""; el.classList.remove("on"); setTimeout(()=>el.remove(), 200); res(v || null); }
    el._fim = ()=>fim(null);

    document.addEventListener("keydown", kd);

  });
}

/* Encerrar (barra de cima, barra de baixo ou "Marcar treino como feito" em dia anterior) */
async function finalizarTreino(){
  if(ui.saving) return;
  if(ui.editId!=null) return salvar();                       // editando um registro: grava o que está na tela
  const p = ui.perfil, d = ui.dia, t = treinoSessao(p, d); if(!t) return;
  const dr = S.draft[p+":"+d] || {}, c = contaSeries(t, dr);
  if(c.total && c.ok >= c.total) return salvar();            // tudo concluído: fluxo de sempre
  const data = REF(), passado = data < shift(0) && !passouMeiaNoite(S.draftMeta && S.draftMeta[p+":"+d], data);
  const pl = (n, um, varios) => n===1 ? um : varios;
  const parcial = entradasParaSalvar(p, d, dr, c.ok>0 ? "feitas" : "preenchidas");
  const todas = entradasParaSalvar(p, d, dr, "todas");
  const ops = [];
  if(parcial.series > 0 && parcial.series < c.total){
    const n = parcial.series, fora = c.total - n, semMarcar = c.ok>0 ? Math.max(0, c.pre - c.ok) : 0;
    ops.push({ k:"parcial", pri: !passado,
      t: c.ok>0 ? `Salvar só ${pl(n, "a série feita", `as ${n} séries feitas`)}` : `Salvar ${pl(n, "a série preenchida", `as ${n} séries preenchidas`)}`,
      s: `${pl(fora, "A outra fica", `As outras ${fora} ficam`)} fora do histórico${semMarcar>0 ? `, inclusive ${pl(semMarcar, "1 preenchida sem marcar", `${semMarcar} preenchidas sem marcar`)}` : ""}.` });
  }
  ops.push({ k:"todas", pri: passado || !ops.length,
    t: "Marcar o treino inteiro como feito",
    s: todas.usouAnterior ? `${pl(todas.usouAnterior, "1 série vazia recebe", `${todas.usouAnterior} séries vazias recebem`)} o valor da última vez.`
      : todas.series ? "Entram os valores que estão na tela."
      : "Ainda não há registro anterior deste treino: fica registrado sem cargas." });
  const corpo = c.ok>0 ? `${c.ok} de ${c.total} séries concluídas.`
    : c.pre>0 ? `${c.pre} de ${c.total} séries preenchidas, nenhuma concluída.`
    : "Nenhuma série marcada.";
  const k = await escolher(passado ? `Registrar o treino ${d} em ${brd(data)}` : `Encerrar o treino ${d}?`, corpo, ops,
    { cancelar: passado ? "Voltar" : "Continuar treinando" });
  if(k==="parcial") return salvar({ entries: parcial.entries });
  if(k==="todas") return salvar({ entries: todas.entries, rapido: todas.usouAnterior });
}

async function marcarFeitoRapido(){
  const p = ui.perfil, data = REF(), days = dayset(p);
  if(data > shift(0)) return;
  const ja = S.events.find(e=>e.perfil===p && e.tipo==="musc" && e.data===data);
  if(ja){ toast(`Já existe o treino ${ja.dia} em ${brd(data)}.`); return; }
  const sug = (sugestaoTreino(p, data)||{}).musc || avaliar(p).win.d;
  const ops = letras(p).filter(L=>days[L]).map(L=>{
    const u = evs(p,"musc").find(e=>e.data<data && e.dia===L);
    return { k:L, pri: L===sug, tag: L===sug ? "sugerido" : "",
      t: `Treino ${L} · ${days[L].t}`, s: u ? `Última vez em ${brd(u.data)}` : "Sem registro anterior" };
  });
  const L = await escolher("Qual treino você fez?", `${cap(dataLonga(data))}. Entra no histórico com o valor da última vez de cada exercício; dá para editar depois.`, ops);
  if(!L || !days[L]) return;
  if(S.events.some(e=>e.perfil===p && e.tipo==="musc" && e.data===data)) return;   // registrado em outro aparelho enquanto escolhia
  const r = entradasParaSalvar(p, L, {}, "todas");
  const ev = { id: Date.now(), perfil:p, tipo:"musc", data, dia:L, entries:r.entries };
  if(r.usouAnterior) ev.rapido = r.usouAnterior;
  S.events.unshift(ev);
  vibrar([30,60,30]);
  await store.set(S); render();
  toastUndo(`Treino ${L} registrado em ${brd(data)}`, async ()=>{
    const i = S.events.findIndex(e=>String(e.id)===String(ev.id)); if(i>=0) S.events.splice(i,1);
    await store.set(S); render();
  });
}

function pcOpcoesRefeicao(txt){
  if(!txt || !String(txt).trim()) return `<p class="pc-note" style="font-size:14px">Nenhuma opção cadastrada para esta refeição. Use “Editar refeição” para preencher.</p>`;
  const blocos = String(txt).replace(/\r/g,"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const eTitulo = l => l.length <= 70 && /:$/.test(l);
  return `<div class="mo">${blocos.map(b=>{
    const linhas = b.split("\n").map(l=>l.trim()).filter(Boolean);
    let h = "", corpo = linhas;
    const m1 = linhas[0].match(/^((?:OP[CÇ][AÃ]O|PRATO)\s*\d*)\s*[—–:-]?\s*(.*)$/i);
    if(m1){ h = m1[1].trim(); const resto = m1[2].trim(); corpo = (resto ? [resto] : []).concat(linhas.slice(1)); }
    else if(eTitulo(linhas[0])){ h = linhas[0].replace(/:$/,""); corpo = linhas.slice(1); }
    const obs = !h && /^obs\b/i.test(linhas[0]);
    if(obs) return `<div class="mo-b mo-obs">${esc(b.replace(/\n/g," "))}</div>`;
    let html = "", aberto = false;
    corpo.forEach(l=>{
      if(eTitulo(l) && !/^[•\-]/.test(l)){ if(aberto){ html += "</ul>"; aberto = false; } html += `<div class="mo-sub">${esc(l.replace(/:$/,""))}</div>`; }
      else { if(!aberto){ html += "<ul>"; aberto = true; } html += `<li>${esc(l.replace(/^[•\-]\s*/,""))}</li>`; }
    });
    if(aberto) html += "</ul>";
    return `<div class="mo-b">${h?`<div class="mo-h">${esc(h)}</div>`:""}${html}</div>`;
  }).join("")}</div>`;
}

function _escSug(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _renderSugestaoShell(titulo, subtitulo, corpoHTML){

async function abrirSugestao(refId){
  const p = ui.perfil, D = S.dieta[p], r = D.refs.find(x=>x.id===refId);
  if(!r) return;
  const mp = meta(p);
  _renderSugestaoShell(r.nome||'Sugestões', 'Alternativas para essa refeição', `<div class="sug-load">Buscando 3 sugestões com IA...</div>`);
  try{
    let j;

    catch(e){ j = { error: e.message }; }
    if(!j || !Array.isArray(j.sugestoes) || !j.sugestoes.length){
      const c0 = document.getElementById('sugCorpo');
      if(c0) c0.innerHTML = `<div class="sug-err">Não consegui buscar sugestões agora. ${_escSug((j && j.error)||'')}</div>`;
      return;

      <div class="n">${_escSug(s.nome)}</div>
      <div class="i">${_escSug(s.itens)}</div>
      <button class="u" data-usar="${i}">Usar essa</button>
    </div>`).join('');

    document.querySelectorAll('#sugCorpo [data-usar]').forEach(b=>b.onclick=async ()=>{
      const idx = Number(b.dataset.usar);
      const s = j.sugestoes[idx];
      if(!s) return;
      const rNow = S.dieta[p].refs.find(x=>x.id===refId);
      if(!rNow) return;
      if(!(await confirmar(`Substituir os itens de "${rNow.nome}" pela sugestão "${s.nome}"?`, {ok:"Substituir"}))) return;
      rNow.itens = s.itens;
      if(s.nome && !rNow.nome) rNow.nome = s.nome;

      fecharSugestao();
      render();
    });

    const c = document.getElementById('sugCorpo');
    if(c) c.innerHTML = `<div class="sug-err">Erro de rede: ${_escSug(String(e&&e.message||e))}</div>`;
  }

/* ================================================================ coach IA */

function _resumoSeries(ex, sets){
  if(!Array.isArray(sets) || !sets.length) return '';
  return sets.map(s=>{
    if(!s) return null;
    if(ex && ex.ty==='time') return s.sec ? s.sec+'s' : null;
    if(ex && ex.ty==='reps') return s.reps || null;
    if(!s.kg && !s.reps) return null;
    return (s.kg||'?')+'x'+(s.reps||'?');
  }).filter(Boolean).join(' ');
}

function _historicoParaCoach(p, n){
  n = n || 20;
  const evts = S.events.filter(e=>e.perfil===p).sort((a,b)=> a.data<b.data?1:-1).slice(0,n);
  const plan = dayset(p);
  return evts.map(e=>{
    const base = { data: e.data, tipo: e.tipo };
    if(e.tipo==='musc'){
      const dia = treinoDaSessao(e, plan);
      const exArr = [];
      if(dia && dia.ex){
        dia.ex.forEach(ex=>{
          const sets = (e.entries||{})[ex.id];
          const s = _resumoSeries(ex, sets);
          if(s) exArr.push({ nome: ex.n, series: s });
        });
      }
      // exercícios registrados nesta sessão que saíram do plano depois
      const vistos = new Set(((dia && dia.ex) || []).map(x=>x.id));
      Object.keys(e.entries||{}).forEach(id=>{
        if(vistos.has(id)) return;
        const ex = exInfo(p, id); if(!ex) return;
        const s = _resumoSeries(ex, e.entries[id]);
        if(s) exArr.push({ nome: ex.n, series: s });
      });
      return Object.assign(base, { dia: e.dia, titulo: dia ? dia.t : '', exercicios: exArr });
    }
    if(e.tipo==='extra'){
      return Object.assign(base, { atividade: e.atividade||'', duracao: e.duracao||null, nota: e.nota||'' });
    }
    if(e.tipo==='skip'){
      return Object.assign(base, { motivo: e.motivo||'' });
    }
    return base;
  });
}

let _coachUltimo = null;

/* v45: cronograma mandado para o coach sem o jiu "fixo" — jiu só vale quando marcado no dia
   (vai em planejado_hoje/amanha/semana). Dia que era livre por causa do jiu aparece como livre. */
function scheduleParaIA(p){
  const sch = getSchedule(p); if(!sch) return null;
  const out = {};
  Object.keys(sch).forEach(k=>{
    const dia = Object.assign({}, sch[k] || {});
    if(dia.jiu){
      dia.jiu = false;
      dia.nota = dia.musc ? "" : "livre (sem jiu marcado, pode treinar)";
    }
    out[k] = dia;
  });
  return out;
}

function _payloadCoach(p){
  const m = meta(p);
  const r = avaliar(p);
  const days = dayset(p);
  const d = days[r.win.d] || { t:'', ex:[] };
  const perfilNome = m.label;
  const D = S.dieta[p] || {};
  const check = (S.check && S.check[p+':'+REF()]) || {};

  const limiteLog = shift(-14);
  const dieta_log = (D.log||[])
    .filter(l=>l.data>=limiteLog)
    .slice()
    .sort((a,b)=> (a.data<b.data)?1:(a.data>b.data)?-1:(a.hora<b.hora?1:-1))
    .slice(0,30)
    .map(l=>({ data:l.data, hora:l.hora, refeicao:l.refNome, texto:l.texto }));

  const payload = Object.assign(iaPerfil(p), {
    perfil: p,
    hoje: REF(),
    plano_dia_sugerido: {
      id: r.win.d,
      nome: d.t,
      ex: d.ex.map(x=>({ n:x.n, p:x.p, s:x.s, ty:x.ty }))
    },
    historico_recente: _historicoParaCoach(p, 20),
    dieta_atual: {
      alvo: D.alvo || {},
      refs: (D.refs||[]).map(r=>({ nome:r.nome, itens:r.itens })),
      extras: (D.extras||[]).map(x=>({ nome:x.nome })),
      nota: D.nota || ''
    },
    dieta_log,
    checks: check,
    schedule: scheduleParaIA(p),
    dias_tipo: getDietaDias(p) || null,
    alvos_dia: getAlvosDia(p) || null,
    planejado_hoje: getPlanejado(p, REF()) || {},
    planejado_amanha: getPlanejado(p, shift(1)) || {},
    planejado_semana: (function(){
      const out = {};
      for(let i=0;i<7;i++){
        const iso = shift(i);
        const pl = getPlanejado(p, iso);
        if(pl && Object.keys(pl).length){
          const d = new Date(iso+"T12:00");
          out[WDK[d.getDay()]+"_"+iso] = pl;
        }
      }
      return out;
    })()
  });

  return payload;
}

}
/* perguntas rápidas conforme o dia */
function coachPerguntas(p){
  return _semRef(()=>{
    const hj = REF(), r = avaliar(p), days = dayset(p), out = [];
    const feito = S.events.find(e=>e.perfil===p && e.tipo==="musc" && e.data===hj);
    const ativs = atividadesMarcadas(p, hj), plan = getPlanejado(p, hj) || {};
    if(feito){
      out.push("Como foi meu treino de hoje?");
      out.push("O que comer depois do treino?");
    } else if(r.schedRest){
      out.push(plan.jejum ? "Como fazer o jejum de hoje?" : "Posso treinar hoje mesmo assim?");
    } else {
      const t = days[r.win.d], ex = t && (t.ex||[]).find(x=>x.ty==="load");
      out.push("O que treino hoje?");
      if(ex) out.push(`Que carga usar no ${ex.n}?`);
    }
    if(ativs.includes("jiu")) out.push("O que comer antes do jiu?");
    else if(!feito) out.push("Estou cansado, como ajusto?");
    out.push("__analise");
    if(semanaResumoIni()) out.unshift("__semana");
    return out.slice(0, 4);
  });
}
const _rotQ = q => q==="__analise" ? "Análise do dia" : q==="__semana" ? "Resumo da semana" : q;
function pcCoachBar(p, r){
  const qs = coachPerguntas(p).slice(0, 3);
  const h = coachHist(p), ult = h.length ? h[h.length-1] : null;
  return `<section class="pc-coach" aria-label="Coach">
    <button class="pc-coach-in" data-coach="1">${pic("spark","sm")}<span>${ult?"Continuar conversa com o coach":"Pergunte ao coach…"}</span>${pic("right","sm")}</button>
    <div class="pc-coach-q">${qs.map(q=>`<button class="chip" data-coachq="${esc(q)}">${esc(_rotQ(q))}</button>`).join("")}</div>
  </section>`;
}
function coachFmt(t){
  let html = "", lista = false;
  esc(String(t||"")).split("\n").forEach(l=>{
    const mm = l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(mm){ if(!lista){ html += "<ul>"; lista = true; } html += `<li>${mm[1]}</li>`; }
    else { if(lista){ html += "</ul>"; lista = false; } if(l.trim()) html += `<p>${l}</p>`; }
  });
  if(lista) html += "</ul>";
  return html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}
function coachMsgHTML(m){
  if(m.papel==="user") return `<div class="cc-m u"><div class="b">${esc(m.texto).replace(/\n/g,"<br>")}</div></div>`;
  const L = m.letra && dayset(ui.perfil)[m.letra] ? m.letra : null;
  return `<div class="cc-m c"><div class="b">${coachFmt(m.texto)}${L?`<button class="cc-act" data-ccletra="${L}"><span>Abrir treino ${L}</span>${pic("arrow","sm")}</button>`:""}</div></div>`;
}
function coachIntro(p){

  });
  return `<div class="cc-intro"><div class="cc-av">${pic("spark","sm")}</div><div><b>Oi, ${esc(m.label)}.</b> Eu vejo seu plano, as cargas de cada série, o que você marcou hoje e a sua dieta. ${esc(info)}<br>Pergunte o que quiser: o que treinar, quanto de carga, o que comer.</div></div>`;

async function coachPedir(p){
  _coachBusy = true; coachRender({ pendente:true });
  try{
    const h = coachHist(p);
    const j = await iaChamar('conversa', Object.assign(iaPerfil(p), {
      mensagens: h.slice(-14).map(m=>({ papel: m.papel, texto: m.texto })),
      dados: coachDados(p)
    }), { url: IA_CONVERSA_URL, tempo: 55000 });
    coachHist(p).push({ papel:"coach", texto: j.resposta, letra: j.treino_letra || null, sug: Array.isArray(j.sugestoes_rapidas) ? j.sugestoes_rapidas : [], t: Date.now() });
    coachSalva(p);
    _coachBusy = false; coachRender();
  }catch(e){ _coachBusy = false; coachRender({ erro: String(e && e.message || e) }); }
}
/* "Análise do dia": a análise estruturada de antes, agora como mensagem da conversa */
async function coachAnalise(repetir){
  const p = ui.perfil;
  if(!repetir){ coachHist(p).push({ papel:"user", texto:"Análise do dia", analise:true, t: Date.now() }); coachSalva(p); }
  _coachBusy = true; coachRender({ pendente:true });
  try{
    const j = await iaChamar('coach', _semRef(()=>_payloadCoach(p)), { tempo: 50000 });
    const L = _extraiLetraDia(j.recomendacao_treino);
    const partes = [`**${j.recomendacao_treino || "Treino de hoje"}**`, j.por_que || ""];
    const cargas = Array.isArray(j.cargas_sugeridas) ? j.cargas_sugeridas : [];
    if(cargas.length) partes.push("**Cargas**\n" + cargas.map(c=>`- ${c.exercicio}: ${c.sugestao}`).join("\n"));
    if(j.dieta_hoje) partes.push("**Alimentação** " + j.dieta_hoje);
    if(j.alerta_recuperacao) partes.push("**Recuperação** " + j.alerta_recuperacao);
    if(j.motivacional) partes.push(j.motivacional);
    coachHist(p).push({ papel:"coach", texto: partes.filter(Boolean).join("\n\n"), letra: L, sug: [], analise:true, t: Date.now() });
    coachSalva(p);
    _coachBusy = false; coachRender();
  }catch(e){ _coachBusy = false; coachRender({ erro: String(e && e.message || e) }); }
}
function coachEnviar(texto){
  texto = String(texto||"").trim();
  if(!texto || _coachBusy) return;
  if(texto==="__analise") return coachAnalise();
  const p = ui.perfil;
  if(texto==="__semana") texto = promptSemana(p);
  coachHist(p).push({ papel:"user", texto: texto.slice(0, 1500), t: Date.now() });
  coachSalva(p);
  coachPedir(p);
}

/* letra do plano no começo da recomendação ("B - Costas e Bíceps"), só se existir no plano */
function _extraiLetraDia(reco){
  const m = String(reco||'').trim().match(/^[^A-Za-z0-9]*([A-H])(?![A-Za-zÀ-ÿ])/);
  const L = m ? m[1] : null;
  return (L && dayset(ui.perfil)[L]) ? L : null;

/* Delegação global de INPUT nas séries — registrada UMA vez.
   Corrige bug em que oninput deixava de disparar após re-renders (pull remoto,
   store.set etc). Como o listener vive no document, novos inputs criados por
   render() automaticamente são cobertos — sem race, sem re-registro. */
let _delegacaoInputLigada = false;
function ligarDelegacaoUmaVez(){
  if(_delegacaoInputLigada) return;
  _delegacaoInputLigada = true;
  // v25: delegação global de clique pros chips de Planejar hoje (garantia extra
  // além dos onclick registrados em ligar()). Cobre casos em que o re-render
  // ainda não rodou ou o listener direto foi perdido.
  document.addEventListener('click', function(e){
    const el = e.target && e.target.closest ? e.target.closest('[data-planq]') : null;
    if(el){
      e.preventDefault();
      const ativ = el.getAttribute('data-planq');
      try{ togglePlanejado(ui.perfil, REF(), ativ); }catch(err){ console.error('[deleg planq]', err); }
      return;
    }
    const el2 = e.target && e.target.closest ? e.target.closest('[data-plansugmusc]') : null;
    if(el2){
      e.preventDefault();
      const letra = el2.getAttribute('data-plansugmusc');
      try{ setPlanejadoMusc(ui.perfil, REF(), letra); }catch(err){ console.error('[deleg plansugmusc]', err); }
      return;
    }
  }, false);
  document.addEventListener('input', function(e){
    const el = e.target;
    if(!el || !el.matches) return;
    // kg / reps / obs de série
    if(el.matches('input[data-cex]')){
      const exId = el.dataset.cex, i = Number(el.dataset.ci), k = el.dataset.ck;
      const raw = el.value;
      const v = (k==="obs") ? raw : String(raw).replace(",",".");
      upd(ui.perfil, ui.dia, exId, i, k, v);
      return;
    }
    // título do treino / campos de exercício em modo edit
    if(el.matches('input[data-f]')){
      const f = el.dataset.f;
      if(f==="titulo"){ dayset(ui.perfil)[ui.dia].t = el.value; }
      else { const ex = acha(el.dataset.ex); if(ex) ex[f] = el.value; }
      salvaSoft();
      return;
    }
    // perfil (orientações para o coach)
    if(el.matches('[data-perfil]')){
      perfilEditavel(ui.perfil)[el.dataset.perfil] = el.value;
      salvaSoft();
      return;
    }
    // config de perfil (peso/kcal/prot etc)
    if(el.matches('[data-meta]')){
      if(!S.metas) S.metas={};
      if(!S.metas[ui.perfil]) S.metas[ui.perfil] = {};
      S.metas[ui.perfil][el.dataset.meta] = el.value;
      salvaSoft();
      return;
    }
  }, false); // bubble phase — safer on iOS

  // v31: se a tela do dia tem o slot PaceIA, hidrata (determinístico já cai imediato + IA async)
  try { if(ui.view==='hoje' && document.getElementById('pace-ia-card')) PaceIA.hydrate(); }
  catch(err){ console.warn('[PaceIA hydrate]', err); }
}

/* ================================================================ estrutura do documento
   Garante as partes que o app usa para cada perfil do grupo (plano, dieta, perfil). */
function prepararEstado(){
  if(!Array.isArray(S.events)) S.events = [];
  if(!S.draft || typeof S.draft!=="object") S.draft = {};
  if(!S.check || typeof S.check!=="object") S.check = {};
  if(!S.metas || typeof S.metas!=="object") S.metas = {};
  if(!S.plan || typeof S.plan!=="object") S.plan = {};
  if(!S.dieta || typeof S.dieta!=="object") S.dieta = {};
  if(!S.perfis || typeof S.perfis!=="object") S.perfis = {};
  if(!S.planejado || typeof S.planejado!=="object") S.planejado = {};
  Object.keys(S.check).forEach(k=>{
    if(Array.isArray(S.check[k])){ const novo = {}; S.check[k].forEach(id=>novo[id]="ok"); S.check[k] = novo; }
  });
  perfisDaConta().forEach(({ perfil:p, nome })=>{
    if(!S.plan[p] || typeof S.plan[p]!=="object") S.plan[p] = {};
    if(!S.dieta[p] || typeof S.dieta[p]!=="object") S.dieta[p] = { alvo:{}, nota:"", refs:[], extras:[], log:[] };
    const D = S.dieta[p];
    if(!D.alvo || typeof D.alvo!=="object") D.alvo = {};
    if(!Array.isArray(D.refs)) D.refs = [];
    if(!Array.isArray(D.extras)) D.extras = [];
    if(!Array.isArray(D.log)) D.log = [];
    D.refs.forEach(r=>{ if(typeof r.hora !== 'string') r.hora = ''; });
    if(!S.perfis[p] || typeof S.perfis[p]!=="object") S.perfis[p] = { label: primeiroNome(nome) || p };
    if(!S.planejado[p] || typeof S.planejado[p]!=="object") S.planejado[p] = {};
    letras(p).forEach(L=>{ (S.plan[p][L].ex||[]).forEach(e=>{ if(e.ap===undefined) e.ap=""; }); });
  });
}
const novoId = pre => pre + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
/* perfil gravável (cria o registro do perfil no documento se ainda não existir) */
function perfilEditavel(p){
  if(!S.perfis) S.perfis = {};
  if(!S.perfis[p] || typeof S.perfis[p]!=="object") S.perfis[p] = { label: meta(p).label };
  return S.perfis[p];
}
/* guarda o plano atual antes de trocar: o histórico continua mostrando os exercícios antigos */
function arquivarPlano(p){
  const atual = dayset(p), so = {};
  letras(p).forEach(L=>{ so[L] = clone(atual[L]); });
  if(!Object.keys(so).length) return;
  if(!S.planHist) S.planHist = {};
  const h = Array.isArray(S.planHist[p]) ? S.planHist[p] : [];
  h.unshift({ em: new Date().toISOString(), plano: so });
  S.planHist[p] = h.slice(0, 8);
}
/* exercício pelo id: plano atual primeiro, depois planos arquivados */
function exInfo(p, id){
  const atual = dayset(p);
  for(const L of letras(p)){ const e = (atual[L].ex||[]).find(x=>x.id===id); if(e) return e; }
  for(const h of ((S.planHist && S.planHist[p]) || [])){

function paraBase64(blob){
  return new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(String(r.result).split(",")[1] || ""); r.onerror = ()=>rej(r.error); r.readAsDataURL(blob); });
}
async function comprimirImagem(f){
  const url = URL.createObjectURL(f);
  try{
    const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>rej(new Error("imagem")); i.src = url; });
    const fator = Math.min(1, 2000 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
    const w = Math.max(1, Math.round((img.naturalWidth || 1) * fator)), h = Math.max(1, Math.round((img.naturalHeight || 1) * fator));
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    const b64 = (c.toDataURL("image/jpeg", 0.85).split(",")[1]) || "";
    if(!b64) throw new Error("imagem");
    return { mime:"image/jpeg", base64:b64, tam: Math.round(b64.length * 0.75) };
  } finally { URL.revokeObjectURL(url); }
}
async function lerArquivosImportar(files){
  let erro = "";
  for(const f of files){
    const tipo = String(f.type || "").toLowerCase(), nome = f.name || "arquivo";
    if(IMP.arquivos.length >= 6){ erro = "Envie no máximo 6 arquivos por vez."; break; }
    try{
      if(tipo==="text/plain" || /\.txt$/i.test(nome)){
        const t = await f.text();
        IMP.texto = ((IMP.texto ? IMP.texto + "\n\n" : "") + t).slice(0, 30000);
      } else if(tipo==="application/pdf" || /\.pdf$/i.test(nome)){
        if(f.size > 8*1024*1024){ erro = `${nome}: PDF grande demais (máximo de 8 MB). Envie só as páginas do ${IMP.tipo==="treino" ? "treino" : "plano"}.`; continue; }
        IMP.arquivos.push({ nome, mime:"application/pdf", base64: await paraBase64(f), tam: f.size });
      } else if(tipo.startsWith("image/") || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(nome)){
        const im = await comprimirImagem(f);
        IMP.arquivos.push(Object.assign({ nome }, im));
      } else {
        erro = `${nome}: formato não aceito. Envie PDF, foto, print ou texto.`;
      }
    }catch(e){
      erro = `${nome}: não consegui abrir o arquivo. Tente um print da tela ou um PDF.`;
    }
  }
  let total = IMP.arquivos.reduce((a,x)=>a + x.base64.length, 0);
  while(total > 12000000 && IMP.arquivos.length){
    const x = IMP.arquivos.pop(); total -= x.base64.length;
    erro = "Arquivos grandes demais juntos (cerca de 9 MB no total). Envie menos páginas.";
  }
  return erro;
}

const normNome = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\([^)]*\)/g, " ").replace(/[^a-z0-9]+/g, " ").trim();
function aplicarTreinoImportado(p, r){
  const atual = dayset(p);
  // mesmo exercício (mesmo nome) mantém o id: o histórico e a "última vez" continuam ligados a ele
  const idx = new Map();
  letras(p).forEach(L=>(atual[L].ex || []).forEach(e=>{ const k = normNome(e.n); if(k && !idx.has(k)) idx.set(k, e.id); }));
  ((S.planHist && S.planHist[p]) || []).forEach(h=>Object.values(h.plano || {}).forEach(t=>(t.ex || []).forEach(e=>{ const k = normNome(e.n); if(k && !idx.has(k)) idx.set(k, e.id); })));
  const usados = new Set(), novo = {};
  Object.keys(r.plano || {}).forEach(L=>{
    const t = r.plano[L];
    novo[L] = { t: t.t, cat: t.cat || "full", grupos: Array.isArray(t.grupos) ? t.grupos : [], ex: (t.ex || []).map(e=>{
      let id = idx.get(normNome(e.n));
      if(!id || usados.has(id)) id = novoId("e");
      usados.add(id);
      const out = { id, n: e.n, p: e.p || "", s: Number(e.s) || 3, ty: e.ty || "load", ap: "" };
      if(e.d) out.d = e.d;
      if(e.no) out.no = e.no;
      return out;
    }) };
  });
  const schedAntigo = getSchedule(p);
  if(temPlano(p)) arquivarPlano(p);
  if(r.schedule) novo.schedule = r.schedule;
  else if(schedAntigo && cronogramaCompativel(p, novo)) novo.schedule = schedAntigo;
  // rascunhos de treinos que deixaram de existir
  letras(p).forEach(L=>{ if(!novo[L]){ if(S.draft) delete S.draft[p+":"+L]; limpaDraftMeta(p, L); } });
  S.plan[p] = novo;
  if(!S.padrao) S.padrao = {};
  const pad = {}; Object.keys(novo).filter(k=>k!=="schedule").forEach(k=>{ pad[k] = clone(novo[k]); });
  S.padrao[p] = pad;
  if(Array.isArray(r.atividades) && r.atividades.length){
    const a = meta(p).ativ.slice();
    r.atividades.forEach(x=>{ if(ATIV_LABEL[x] && !a.includes(x)) a.push(x); });
    perfilEditavel(p).ativ = Object.keys(ATIV_LABEL).filter(x=>a.includes(x));
  }
}
function aplicarDietaImportada(p, r){
  if(!S.dieta[p]) S.dieta[p] = { log:[] };
  const D = S.dieta[p], d = r.dieta || {}, A = d.alvo || {};
  D.alvo = { kcal: A.kcal || "", prot: A.prot || "", carb: A.carb || "", gord: A.gord || "" };
  D.nota = d.nota || "";
  D.refs = (d.refs || []).map(x=>{ const o = { id: novoId("r"), nome: x.nome, hora: x.hora || "", itens: x.itens || "" }; if(x.kcal) o.kcal = x.kcal; return o; });
  D.extras = (d.extras || []).map(x=>({ id: novoId("x"), nome: x.nome }));
  delete D.alvos_dia;   // metas por tipo de dia eram do plano anterior
  if(!Array.isArray(D.log)) D.log = [];
  const pf = perfilEditavel(p);
  if(r.agua) pf.agua = r.agua;
  pf.onb = true;
}

const linkAcesso = tok => location.origin + location.pathname + "#acesso=" + tok;
async function carregarAdmin(){
  ui.adm = Object.assign({ tab:"contas", nome:"", email:"" }, ui.adm || {}, { carregando:true, erro:"" });
  try{
    const [contas, fb] = await Promise.all([
      rpc("pace_admin_contas", { p_token: SESSAO.token }),
      rpc("pace_admin_feedback", { p_token: SESSAO.token })
    ]);
    ui.adm.contas = Array.isArray(contas) ? contas : [];
    ui.adm.feedback = Array.isArray(fb) ? fb : [];
  }catch(e){
    if(e.sessao){ sessaoEncerrada(); return; }
    ui.adm.erro = /restrito/i.test(e.message) ? "Acesso restrito ao administrador." : (navigator.onLine ? "Não foi possível carregar agora." : "Sem internet.");
  }
  ui.adm.carregando = false;
  if(ui.view==="admin") render();
}
function blocoLinkAdmin(L){
  return `<section class="pc-hl" aria-label="Link de acesso" style="margin-top:14px">
    <div class="ey">${pic("lock","sm")}${L.primeiro ? "Primeiro acesso" : "Senha nova"} · ${esc(primeiroNome(L.nome))}</div>
    <div class="adm-link" id="admLinkTxt">${esc(L.url)}</div>
    <div class="meta">Vale uma vez, até ${esc(brdHora(L.expira))}. Quem abrir o link cria a própria senha.</div>
    <div class="adm-acts">
      <button class="pc-btn sm hl" data-admcopiar="1">Copiar link</button>
      <button class="pc-btn sm hl" data-admzap="1">WhatsApp</button>
      ${navigator.share ? `<button class="pc-btn sm hl" data-admshare="1">Compartilhar</button>` : ""}
    </div></section>`;
}
function viewAdmin(p, m){
  const A = ui.adm || { carregando:true, tab:"contas" };
  let out = `<div class="tbar" style="margin-bottom:6px"><div class="t">Acessos</div><button class="edt" data-view="config">Voltar</button></div>
    <p class="pc-sub" style="font-size:15px;margin-bottom:6px">Crie acessos para os amigos testarem e leia o que eles comentaram.</p>`;
  if(!souAdmin()) return out + `<p class="pc-note">Acesso restrito ao administrador.</p>`;
  const novos = (A.feedback || []).filter(f=>!f.lido).length;
  out += pcTabs("adm", [["contas","Acessos"],["coment", novos ? `Comentários (${novos})` : "Comentários"]], A.tab || "contas");
  if(A.erro) out += `<div class="pc-warn">${esc(A.erro)}<div class="acts"><button class="pc-btn sm oac" data-admrecarregar="1">Tentar de novo</button></div></div>`;
  if(A.carregando && !A.contas) return out + `<div class="sug-load">Carregando…</div>`;
  if((A.tab || "contas")==="contas"){
    out += pcSec("Novo acesso") + `<div class="cfg-list" style="padding:14px 16px">
      <label class="eyebrow" for="admNome" style="display:block;margin-bottom:6px">Nome</label>
      <input class="ed-f" id="admNome" autocomplete="off" placeholder="Nome e sobrenome" value="${esc(A.nome || "")}">
      <label class="eyebrow" for="admEmail" style="display:block;margin-bottom:6px">E-mail (vira o usuário)</label>
      <input class="ed-f" id="admEmail" type="email" inputmode="email" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="nome@exemplo.com" value="${esc(A.email || "")}">
      <button class="pc-btn pri" id="admCriar">Criar acesso e gerar link</button>
      <p class="pc-note" style="font-size:12.5px">Cada acesso novo tem os próprios dados: ninguém vê os treinos e a dieta de outra conta.</p>
    </div>`;
    if(A.link) out += blocoLinkAdmin(A.link);
    out += pcSec("Quem tem acesso", `<span class="aside">${(A.contas || []).length}</span>`) + `<div class="pc-list">`;
    (A.contas || []).forEach(c=>{
      const sit = c.situacao==="ativo" ? "Ativo" : c.situacao==="aguardando" ? "Ainda não entrou" : "Desativado";
      const ult = c.ultimo_uso ? "último uso " + brdHora(c.ultimo_uso) : "";
      out += `<div class="pc-row adm-row"><div class="main">
        <div class="t">${esc(c.nome)}${c.eu ? " (você)" : ""}</div>
        <div class="s">${esc(c.login)} · ${sit}${ult && c.situacao!=="desativado" ? " · " + ult : ""}${c.ia_30d ? " · IA " + c.ia_30d + "x em 30 dias" : ""}${c.compartilhado && !c.eu ? " · mesmo grupo que você" : ""}</div>
        <div class="adm-acts">
          ${c.ativo ? `<button class="pc-btn sm ghost" data-admlink="${esc(c.id)}">${c.situacao==="aguardando" ? "Gerar link de acesso" : "Link para senha nova"}</button>` : ""}
          ${c.eu ? "" : (c.ativo ? `<button class="pc-btn sm ghost adm-perigo" data-admativo="${esc(c.id)}:0">Desativar</button>` : `<button class="pc-btn sm ghost" data-admativo="${esc(c.id)}:1">Reativar</button>`)}
        </div></div></div>`;
    });
    out += `</div>`;
  } else {
    out += `<div class="pc-list" style="margin-top:14px">`;
    if(!(A.feedback || []).length) out += `<p class="pc-note" style="font-size:15px">Nenhum comentário ainda.</p>`;
    (A.feedback || []).forEach(f=>{
      out += `<div class="pc-row adm-row ${f.lido ? "lido" : ""}"><div class="main">
        <div class="t">${esc(f.nome || "")} <small class="adm-data">${esc(brdHora(f.criado_em))}${f.tela ? " · tela " + esc(f.tela) : ""}</small></div>
        <div class="adm-txt">${esc(f.texto)}</div>
        <div class="adm-acts"><button class="pc-btn sm ghost" data-fblido="${f.id}:${f.lido ? 0 : 1}">${f.lido ? "Marcar como não lido" : "Marcar como lido"}</button></div>
      </div></div>`;
    });
    out += `</div>`;
  }
  return out;
}
function msgLinkAdmin(L){
  return L.primeiro
    ? `Oi, ${primeiroNome(L.nome)}. Este é o seu acesso ao Pace, o app de treino: ${L.url} . Abra o link e crie a sua senha (o link vale uma vez).`
    : `Oi, ${primeiroNome(L.nome)}. Este é o link para criar uma senha nova no Pace: ${L.url} (vale uma vez).`;
}
function ligarAdmin(){
  const A = ui.adm || {};
  document.querySelectorAll("[data-admrecarregar]").forEach(b=>b.onclick=()=>carregarAdmin());
  const nome = document.getElementById("admNome"), email = document.getElementById("admEmail");
  if(nome) nome.oninput = ()=>{ A.nome = nome.value; };
  if(email) email.oninput = ()=>{ A.email = email.value; };
  const criar = document.getElementById("admCriar");
  if(criar) criar.onclick = async ()=>{
    const n = (nome.value || "").trim(), e = (email.value || "").trim().toLowerCase();
    if(n.length < 2){ toastUndo("Informe o nome."); nome.focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(e)){ toastUndo("Informe um e-mail válido."); email.focus(); return; }
    criar.disabled = true; criar.textContent = "Criando…";
    try{
      const r = await rpc("pace_admin_criar", { p_token: SESSAO.token, p_nome: n, p_login: e });
      if(r && r.erro){ toastUndo(r.erro); return; }
      A.link = { nome: r.nome, url: linkAcesso(r.convite), expira: r.expira, primeiro: true };
      A.nome = ""; A.email = "";
      await carregarAdmin();
      window.scrollTo(0,0);
    }catch(err){
      if(err.sessao){ sessaoEncerrada(); return; }
      toastUndo(navigator.onLine ? "Não foi possível criar agora." : "Sem internet.");
    }finally{
      const b = document.getElementById("admCriar"); if(b){ b.disabled = false; b.textContent = "Criar acesso e gerar link"; }
    }
  };
  document.querySelectorAll("[data-admlink]").forEach(b=>b.onclick=async ()=>{
    b.disabled = true;
    try{
      const r = await rpc("pace_admin_link", { p_token: SESSAO.token, p_conta: b.dataset.admlink });
      if(r && r.erro){ toastUndo(r.erro); b.disabled = false; return; }
      A.link = { nome: r.nome, url: linkAcesso(r.convite), expira: r.expira, primeiro: !!r.primeiro };
      render(); window.scrollTo(0,0);
    }catch(err){
      if(err.sessao){ sessaoEncerrada(); return; }
      toastUndo("Não foi possível gerar o link agora."); b.disabled = false;
    }
  });
  document.querySelectorAll("[data-admativo]").forEach(b=>b.onclick=async ()=>{
    const [id, v] = b.dataset.admativo.split(":"), ativo = v==="1";
    const c = (A.contas || []).find(x=>String(x.id)===id); if(!c) return;
    if(!ativo && !(await confirmar(`Desativar o acesso de ${c.nome}?\n\nA pessoa sai do app em todos os aparelhos. Os dados dela continuam guardados e o acesso pode ser reativado.`, { ok:"Desativar", perigo:true }))) return;
    try{
      const r = await rpc("pace_admin_ativo", { p_token: SESSAO.token, p_conta: id, p_ativo: ativo });
      if(r && r.erro){ toastUndo(r.erro); return; }
      if(A.link && !ativo && A.link.nome===c.nome) A.link = null;
      await carregarAdmin();
    }catch(err){
      if(err.sessao){ sessaoEncerrada(); return; }
      toastUndo("Não foi possível alterar agora.");
    }
  });
  document.querySelectorAll("[data-fblido]").forEach(b=>b.onclick=async ()=>{
    const [id, v] = b.dataset.fblido.split(":");
    try{
      await rpc("pace_admin_feedback_lido", { p_token: SESSAO.token, p_id: Number(id), p_lido: v==="1" });
      const f = (A.feedback || []).find(x=>String(x.id)===id); if(f) f.lido = v==="1";
      render();
    }catch(err){ if(err.sessao){ sessaoEncerrada(); return; } toastUndo("Não foi possível marcar agora."); }
  });
  document.querySelectorAll("[data-admcopiar]").forEach(b=>b.onclick=async ()=>{
    if(!A.link) return;
    toastUndo((await copiarTexto(A.link.url)) ? "Link copiado." : "Não consegui copiar. Toque e segure o link para copiar.");
  });
  document.querySelectorAll("[data-admzap]").forEach(b=>b.onclick=()=>{
    if(!A.link) return;
    window.open("https://wa.me/?text=" + encodeURIComponent(msgLinkAdmin(A.link)), "_blank", "noopener");
  });
  document.querySelectorAll("[data-admshare]").forEach(b=>b.onclick=async ()=>{
    if(!A.link || !navigator.share) return;
    try{ await navigator.share({ title:"Pace", text: msgLinkAdmin(A.link) }); }catch(e){}
  });
}

/* ================================================================ início */
(async function(){
  // link de primeiro acesso ou de senha nova
  const mAcesso = /[#&]acesso=([A-Za-z0-9_-]{20,80})/.exec(location.hash || "");
  if(mAcesso){ mostraAtivacao(mAcesso[1]); return; }
  SESSAO = lerSessao();
  if(!SESSAO){ mostraLogin(); return; }
  try{ localStorage.removeItem("gt-auth-v1"); }catch(e){}
  ligarDelegacaoUmaVez();
  syncEngine.configurar(SESSAO.conta.grupo);
  await syncEngine.bootstrap();
  if(syncEngine.parado()) return;
  const antes = JSON.stringify(S);
  prepararEstado();
  try{
    Object.keys(S.draft||{}).forEach(k=>{
      const [pp,dd] = k.split(":"); if(!dayset(pp)[dd]) return;
      const ant = ultimaSessao(pp,dd);
      if(Object.keys(ant).length && JSON.stringify(S.draft[k])===JSON.stringify(ant)) S.draft[k] = {};
    });
  }catch(e){}
  ui.perfil = SESSAO.conta.perfil;
  ui.dia = avaliar(ui.perfil).win.d || letras(ui.perfil)[0] || "A";
  render();
  syncEngine.start();
  if(JSON.stringify(S) !== antes) store.set(S);
})();

<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="pace">
<meta name="theme-color" content="#0A0B0F" id="themeColor">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23121916'/%3E%3Cpath d='M32 13a19 19 0 1 1-19 19' fill='none' stroke='%23F5F4EF' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='18.6' cy='18.6' r='4.2' fill='%237ADBB5'/%3E%3C/svg%3E">
<title>pace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ============================================================
     PACE  ·  Design System v14 · iOS input hardening
     ------------------------------------------------------------
     Brand:   Pace — "Your training pace." EN/PT, direct.
     Type:    Instrument Serif (display, italic) + Inter (body)
              + JetBrains Mono (numerics/weights)
     Palette: Graphite paper + hierarchical neutrals; warm ember
              accent. No fitness-green cliche.
     Motion:  220ms cubic-bezier(.22,1,.36,1); tap = 0.98 scale.
     Grid:    4/8pt spacing; three radii, three shadows.
     Icons:   Lucide-family stroke SVGs (1.7 default).
     ============================================================ */

  :root{
    --paper:#0A0B0F;
    --surface:#14161B;
    --surface-2:#1B1E25;
    --sunk:#0E1015;
    --ink:#F5F5F0;
    --muted:#9099A6;
    --faint:#5B6270;
    --hair:rgba(255,255,255,.055);
    --hair-2:rgba(255,255,255,.11);
    --hair-3:rgba(255,255,255,.18);
    --ok:#4ADE80; --warn:#F5B946; --danger:#F87171; --info:#7EA9FF; --blue:#7EA9FF;
    --ac:#E85D3F; --ac-ink:#0A0B0F;
    --ac-soft:rgba(232,93,63,.10);
    --ac-glow:rgba(232,93,63,.28);
    --serif:'Instrument Serif','Iowan Old Style',Palatino,Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
    --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --r-sm:10px; --r-md:16px; --r-lg:22px;
    --sh-1:0 1px 2px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.02);
    --sh-2:0 6px 20px rgba(0,0,0,.42),0 0 0 .5px rgba(255,255,255,.03);
    --sh-3:0 22px 50px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.04);
    --shadow:var(--sh-1); --shadow-lg:var(--sh-2);
    --radius:14px; --radius-lg:18px;
    --ease:cubic-bezier(.22,1,.36,1); --dur:220ms; --dur-fast:160ms;
    --tab-bg:rgba(10,11,15,.78);
  }
  html[data-theme="light"]{
    --paper:#F7F6F1; --surface:#FFFFFF; --surface-2:#EFECE4; --sunk:#EAE7DE;
    --ink:#0A0B0F; --muted:#565E6C; --faint:#8B92A0;
    --hair:rgba(10,11,15,.07); --hair-2:rgba(10,11,15,.13); --hair-3:rgba(10,11,15,.20);
    --ac-ink:#FFFFFF;
    --sh-1:0 1px 2px rgba(20,22,30,.05),0 0 0 .5px rgba(20,22,30,.03);
    --sh-2:0 6px 20px rgba(20,22,30,.08),0 0 0 .5px rgba(20,22,30,.03);
    --sh-3:0 22px 50px rgba(20,22,30,.14),0 0 0 .5px rgba(20,22,30,.04);
    --shadow:var(--sh-1); --shadow-lg:var(--sh-2);
    --tab-bg:rgba(247,246,241,.85);
  }
  @media (prefers-color-scheme: light){
    html[data-theme="auto"]{
      --paper:#F7F6F1; --surface:#FFFFFF; --surface-2:#EFECE4; --sunk:#EAE7DE;
      --ink:#0A0B0F; --muted:#565E6C; --faint:#8B92A0;
      --hair:rgba(10,11,15,.07); --hair-2:rgba(10,11,15,.13); --hair-3:rgba(10,11,15,.20);
      --ac-ink:#FFFFFF;
      --sh-1:0 1px 2px rgba(20,22,30,.05),0 0 0 .5px rgba(20,22,30,.03);
      --sh-2:0 6px 20px rgba(20,22,30,.08),0 0 0 .5px rgba(20,22,30,.03);
      --sh-3:0 22px 50px rgba(20,22,30,.14),0 0 0 .5px rgba(20,22,30,.04);
      --shadow:var(--sh-1); --shadow-lg:var(--sh-2);
      --tab-bg:rgba(247,246,241,.85);
    }
  }
  .sync-badge{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:1000;
    font-size:9px;line-height:1;padding:5px 9px;border-radius:999px;background:rgba(20,22,27,.72);
    border:.5px solid var(--hair-2);color:var(--muted);font-family:var(--sans);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none;
    display:flex;align-items:center;gap:5px;transition:opacity .3s var(--ease),transform .3s var(--ease);
    opacity:0;transform:translateY(-4px)}
  .sync-badge.saving{color:var(--warn);opacity:1;transform:none}
  .sync-badge.offline{color:var(--danger);border-color:rgba(248,113,113,.4);opacity:1;transform:none}
  .sync-badge.ok{opacity:0;transform:translateY(-4px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--paper)}
  body{margin:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
       -moz-osx-font-smoothing:grayscale;font-size:15px;line-height:1.45;
       font-feature-settings:'ss03','cv11','cv06';
       letter-spacing:-.005em;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
  .wrap{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom))}
  button{font-family:inherit;border:none;background:none;color:inherit;font-size:inherit;cursor:pointer;letter-spacing:inherit}
  input,textarea{font-family:inherit;-webkit-appearance:none;color:var(--ink)}
  ::selection{background:var(--ac);color:var(--ac-ink)}
  :focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
  .eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}

  /* Brand bar */
  .head2{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;height:40px}
  .head2 .who{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px;
    line-height:1;letter-spacing:-.012em;color:var(--ink)}
  .head2 .who .logo{width:26px;height:26px;border-radius:8px;background:var(--ink);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .head2 .who .logo svg{width:14px;height:14px;color:var(--paper)}
  .head2 .who small{font-family:var(--sans);font-size:11.5px;color:var(--muted);font-weight:500;
    letter-spacing:-.005em;padding-left:8px;margin-left:2px;border-left:.5px solid var(--hair-2);
    text-transform:none}
  .head2 .cfg{width:38px;height:38px;border-radius:12px;background:var(--surface);
    border:.5px solid var(--hair-2);display:flex;align-items:center;justify-content:center;
    color:var(--muted);transition:all var(--dur-fast) var(--ease)}
  .head2 .cfg:active{transform:scale(.94);background:var(--surface-2);color:var(--ink)}
  .head2 .cfg svg{width:17px;height:17px;stroke-width:1.7}

  .datenav{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .arw{width:38px;height:38px;border-radius:12px;background:var(--surface);
       border:.5px solid var(--hair-2);display:flex;align-items:center;justify-content:center;
       flex-shrink:0;color:var(--muted);transition:all var(--dur-fast) var(--ease)}
  .arw:active{transform:scale(.94);background:var(--surface-2);color:var(--ink)}
  .arw svg{width:15px;height:15px;stroke-width:2}
  .dt{flex:1;text-align:center}
  .dt .d1{font-family:var(--serif);font-size:19px;line-height:1.15;color:var(--ink);letter-spacing:-.01em}
  .dt .d2{font-size:11px;color:var(--faint);margin-top:4px;letter-spacing:.02em}
  .dt .d2 b{color:var(--ac);font-weight:600}

  /* HERO */
  .hero{background:var(--surface);border:.5px solid var(--hair-2);border-radius:var(--r-lg);
        overflow:hidden;box-shadow:var(--sh-2);margin-bottom:14px;position:relative}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 60% at 0% 0%,var(--ac-soft),transparent 55%)}
  .hero .top{display:flex;gap:22px;padding:30px 24px 22px;position:relative;z-index:1;align-items:flex-start}
  .hero .letter{font-family:var(--serif);font-style:italic;font-size:120px;line-height:.78;
    color:var(--ac);letter-spacing:-.055em;flex-shrink:0;margin-top:-10px;
    text-shadow:0 12px 40px var(--ac-glow);font-feature-settings:'ss01'}
  .hero .info{flex:1;min-width:0;padding-top:10px}
  .hero .info .lbl{font-family:var(--display);font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:10px;
    display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px}
  .hero .info .lbl span{white-space:nowrap}
  .hero .info .ttl{font-family:var(--display);font-size:34px;line-height:1.04;
    letter-spacing:-.028em;color:var(--ink);margin-bottom:10px;font-weight:700;
    font-feature-settings:'ss03','cv11'}
  .hero .info .sub{font-family:var(--display);font-size:13.5px;color:var(--muted);
    letter-spacing:-.005em;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.35}
  .hero .why{padding:2px 24px 24px;font-family:var(--sans);font-size:14.5px;line-height:1.62;
    color:var(--muted);letter-spacing:-.005em;position:relative;z-index:1;font-weight:400}
  .hero .why b{color:var(--ink);font-weight:600;letter-spacing:-.01em}
  .hero.done{border-color:rgba(74,222,128,.35)}
  .hero.done::after{background:radial-gradient(120% 60% at 0% 0%,rgba(74,222,128,.10),transparent 55%)}
  .hero.done .letter{color:var(--ok);text-shadow:0 12px 40px rgba(74,222,128,.28)}
  .hero.done .info .lbl{color:var(--ok)}

  .go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;
      border-radius:16px;background:var(--ac);color:var(--ac-ink);
      font-size:15px;font-weight:600;margin-bottom:10px;letter-spacing:-.005em;
      box-shadow:0 10px 26px var(--ac-glow),inset 0 .5px 0 rgba(255,255,255,.22);
      transition:transform var(--dur-fast) var(--ease),opacity var(--dur-fast) var(--ease)}
  .go:active{transform:scale(.98);opacity:.94}
  .go svg{width:17px;height:17px;stroke-width:2.2}

  .coach-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;
      border-radius:15px;background:var(--surface);color:var(--ink);
      font-size:14px;font-weight:600;letter-spacing:-.005em;margin-bottom:10px;
      border:.5px solid var(--hair-2);box-shadow:var(--sh-1);
      transition:all var(--dur-fast) var(--ease)}
  .coach-btn:active{transform:scale(.98);background:var(--surface-2)}
  .coach-btn svg{width:17px;height:17px;color:var(--ac);stroke-width:1.9}

  .acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .act2{height:52px;border-radius:14px;background:var(--surface);border:.5px solid var(--hair-2);
       display:flex;align-items:center;justify-content:center;gap:8px;
       font-size:13.5px;color:var(--muted);font-weight:500;letter-spacing:-.005em;
       transition:all var(--dur-fast) var(--ease);box-shadow:var(--sh-1)}
  .act2:active{transform:scale(.98);background:var(--surface-2)}
  .act2 svg{width:16px;height:16px;stroke-width:1.7}
  .act2.on{border-color:var(--ok);color:var(--ok);background:rgba(74,222,128,.06)}

  .extras-list{margin:-4px 4px 14px;font-size:12.5px;color:var(--muted);line-height:1.7}
  .extras-list .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
  .extras-list .rm{color:var(--danger);font-size:11px;background:none;border:0;padding:0 4px}

  /* Session picker */
  .segs{display:flex;gap:6px;margin-bottom:18px}
  .sg{flex:1;height:64px;border-radius:14px;background:var(--surface);border:.5px solid var(--hair-2);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      transition:all var(--dur-fast) var(--ease);color:var(--muted)}
  .sg:active{transform:scale(.97)}
  .sg.on{border-color:var(--ac);background:var(--ac-soft);color:var(--ac)}
  .sg .l{font-family:var(--serif);font-style:italic;font-size:24px;line-height:1;letter-spacing:-.03em}
  .sg .s{font-size:10px;color:var(--faint);letter-spacing:.02em;margin-top:2px}
  .sg.on .s{color:var(--muted)}

  .tbar{display:flex;justify-content:space-between;align-items:center;margin:0 2px 18px;gap:10px}
  .tbar .t{font-family:var(--serif);font-size:24px;line-height:1.15;color:var(--ink);letter-spacing:-.012em}
  .edt{padding:9px 14px;border-radius:11px;border:.5px solid var(--hair-2);background:var(--surface);
       font-size:12.5px;color:var(--muted);flex-shrink:0;font-weight:500;
       transition:all var(--dur-fast) var(--ease)}
  .edt:active{transform:scale(.96);background:var(--surface-2)}
  .edt.on{border-color:var(--ac);color:var(--ac);font-weight:600;background:var(--ac-soft)}

  /* Cards / exercises */
  .card{background:var(--surface);border:.5px solid var(--hair-2);border-radius:16px;
        padding:16px;margin-bottom:10px;box-shadow:var(--sh-1)}
  .card.ed{border:1px dashed var(--ac);background:var(--ac-soft)}
  .ex-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .ex-n{font-size:15px;font-weight:600;line-height:1.3;color:var(--ink);letter-spacing:-.01em}
  .ex-p{font-family:var(--mono);font-size:12px;color:var(--ac);white-space:nowrap;font-weight:500;
    font-variant-numeric:tabular-nums}
  .ex-a{font-size:11.5px;margin:8px 0 12px;color:var(--faint);letter-spacing:.005em}
  .ex-a.has{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .ap{width:100%;height:36px;border:.5px dashed var(--hair-2);border-radius:10px;background:transparent;
      font-size:12.5px;color:var(--muted);padding:0 12px;margin:0 0 12px;outline:none;
      transition:all var(--dur-fast) var(--ease)}
  .ap:focus{border-style:solid;border-color:var(--ac);background:var(--sunk);color:var(--ink)}
  .ap::placeholder{color:var(--faint)}
  .set{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .set .i{width:20px;font-family:var(--mono);font-size:12px;color:var(--faint);flex-shrink:0;font-weight:600;
    font-variant-numeric:tabular-nums}
  .fw{position:relative;flex:1}
  .fw input{width:100%;height:46px;background:var(--sunk);border:.5px solid var(--hair-2);
    border-radius:12px;color:var(--ink);font-size:16px;text-align:center;outline:none;padding:0;
    font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;
    transition:all var(--dur-fast) var(--ease)}
  .fw input::placeholder{color:var(--faint);font-weight:400}
  .fw input:focus{border-color:var(--ac);background:var(--surface);box-shadow:0 0 0 3px var(--ac-soft)}
  /* iOS input — apenas caret visível e touch-action. NADA de -webkit-user-modify:
     read-write-plaintext-only aqui: essa propriedade é pra contenteditable e no
     iOS Safari faz o input exigir long-press pra focar (tap curto não abre teclado). */
  .fw input, .obs-in, .ed-f, .ap, .ta{
    -webkit-user-select: text; user-select: text;
    caret-color: var(--ac);
    touch-action: manipulation;
  }
  .fw span{position:absolute;right:11px;top:15px;font-size:10.5px;color:var(--faint);
    pointer-events:none;letter-spacing:.02em}
  .obs-row{margin:-2px 0 10px 28px}
  .obs-in{width:calc(100% - 28px);height:32px;background:transparent;border:.5px dashed var(--hair-2);
    border-radius:8px;color:var(--muted);font-size:12px;padding:0 10px;font-family:var(--sans);
    outline:none;transition:all var(--dur-fast) var(--ease)}
  .obs-in::placeholder{color:var(--faint);font-weight:400}
  .obs-in:focus{border-style:solid;border-color:var(--ac);background:var(--sunk);color:var(--ink)}

  .ed-f{width:100%;height:44px;border:.5px solid var(--hair-2);border-radius:11px;background:var(--sunk);
        padding:0 13px;font-size:14.5px;color:var(--ink);outline:none;margin-bottom:10px;
        transition:all var(--dur-fast) var(--ease)}
  .ed-f:focus{border-color:var(--ac);background:var(--surface);box-shadow:0 0 0 3px var(--ac-soft)}
  .ed-f::placeholder{color:var(--faint)}
  .ed-row{display:flex;gap:9px;align-items:center;margin-bottom:10px}
  .step{display:flex;align-items:center;border:.5px solid var(--hair-2);border-radius:11px;
    overflow:hidden;background:var(--sunk)}
  .step button{width:42px;height:44px;font-size:19px;color:var(--ac);font-weight:600}
  .step button:active{background:var(--surface-2)}
  .step .v{width:44px;text-align:center;font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600}
  .tys{display:flex;gap:5px;flex:1}
  .ty{flex:1;height:44px;border-radius:11px;border:.5px solid var(--hair-2);background:var(--sunk);
      font-size:11.5px;color:var(--muted);transition:all var(--dur-fast) var(--ease)}
  .ty:active{transform:scale(.97)}
  .ty.on{border-color:var(--ac);color:var(--ac);font-weight:600;background:var(--ac-soft)}
  .del{width:100%;height:40px;border-radius:11px;border:.5px solid var(--hair-2);color:var(--danger);
    font-size:12.5px;background:var(--surface);transition:all var(--dur-fast) var(--ease)}
  .del:active{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.35);transform:scale(.98)}
  .addx{width:100%;height:50px;border-radius:14px;border:1px dashed var(--ac);color:var(--ac);
        font-size:14px;font-weight:600;background:var(--ac-soft);margin-bottom:10px;
        transition:all var(--dur-fast) var(--ease)}
  .addx:active{transform:scale(.98)}
  .reset{width:100%;height:44px;border-radius:12px;border:.5px solid var(--hair-2);color:var(--muted);
    font-size:12.5px;background:var(--surface);transition:all var(--dur-fast) var(--ease)}
  .reset:active{background:var(--surface-2);transform:scale(.98)}

  .h-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .h-d{font-family:var(--serif);font-size:17px;color:var(--ink);letter-spacing:-.01em}
  .hist{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px;font-size:13px;padding:2px 0}
  .hist .n{color:var(--muted)}
  .hist .n{min-width:0;overflow-wrap:anywhere}
  @media (max-width:360px){ .hist{flex-wrap:wrap;gap:2px 12px} .hist .v{white-space:normal} }
  .hist .v{font-family:var(--mono);white-space:nowrap;font-size:12.5px;color:var(--ink);font-weight:500;
    font-variant-numeric:tabular-nums}

  .save-wrap{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));
    padding:0 16px;z-index:50;pointer-events:none}
  .save{pointer-events:auto;display:block;width:100%;max-width:488px;margin:0 auto;height:52px;
    border-radius:14px;background:var(--surface-2);color:var(--faint);
    font-size:15px;font-weight:600;letter-spacing:-.005em;box-shadow:var(--sh-2);
    border:.5px solid var(--hair-2);transition:all var(--dur) var(--ease)}
  .save.on{background:var(--ac);color:var(--ac-ink);border-color:transparent;
    box-shadow:0 10px 26px var(--ac-glow),inset 0 .5px 0 rgba(255,255,255,.22)}
  .save.done{background:var(--ok);color:#0A0B0F;border-color:transparent;
    box-shadow:0 10px 26px rgba(74,222,128,.32)}
  .save:active{transform:scale(.99)}

  /* Bottom nav */
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--tab-bg);
          backdrop-filter:saturate(1.6) blur(22px);-webkit-backdrop-filter:saturate(1.6) blur(22px);
          border-top:.5px solid var(--hair-2);padding-bottom:env(safe-area-inset-bottom);z-index:40}
  .tabbar .in{max-width:520px;margin:0 auto;display:flex;padding:8px 6px 0;gap:2px}
  .tb{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;color:var(--faint);font-size:10px;font-weight:500;border-radius:12px;
      letter-spacing:.01em;transition:all var(--dur-fast) var(--ease);position:relative;padding:0 2px}
  .tb::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);
    width:24px;height:2px;background:var(--ac);border-radius:0 0 2px 2px;
    transition:transform var(--dur) var(--ease)}
  .tb.on{color:var(--ink);font-weight:600}
  .tb.on::before{transform:translateX(-50%) scaleX(1)}
  .tb.on svg{color:var(--ac);stroke-width:2}
  .tb:active{transform:scale(.94)}
  .tb svg{width:20px;height:20px;stroke-width:1.7;transition:color var(--dur-fast) var(--ease)}

  .toast{position:fixed;left:16px;right:16px;bottom:150px;max-width:488px;margin:0 auto;
    border-radius:14px;padding:14px 16px;font-size:13.5px;background:var(--surface);color:var(--ink);
    border:.5px solid var(--hair-2);box-shadow:var(--sh-3);z-index:60;animation:toastup .28s var(--ease)}
  @keyframes toastup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* Calendar */
  .cal{background:var(--surface);border:.5px solid var(--hair-2);border-radius:18px;
    padding:18px 16px 16px;margin-bottom:16px;box-shadow:var(--sh-1)}
  .cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .cal-h .m{font-family:var(--serif);font-size:20px;color:var(--ink);letter-spacing:-.012em}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  @media (max-width:340px){ .grid .cell{min-width:0} }
  .gh{font-size:9px;text-align:center;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;
    padding-bottom:6px;font-weight:600}
  .cell{aspect-ratio:1;border-radius:10px;background:transparent;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:2px;border:.5px solid transparent;
        transition:all var(--dur-fast) var(--ease);color:var(--muted)}
  .cell.out{opacity:.30}
  .cell:active{transform:scale(.94)}
  .cell.sel{border-color:var(--ac);background:var(--ac-soft)}
  .cell .n{font-size:11px;color:var(--muted);line-height:1;font-family:var(--mono);
    font-variant-numeric:tabular-nums}
  .cell.hoje .n{font-weight:700;color:var(--ink)}
  .cell.hoje{background:var(--surface-2)}
  .cell .l{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ac);
    line-height:1;letter-spacing:-.02em}
  .cell .dot{width:5px;height:5px;border-radius:50%;background:var(--info)}
  .cell .skip{width:8px;height:2px;background:var(--faint);border-radius:1px}
  .cell.skipd{background:rgba(255,255,255,.02)}
  html[data-theme="light"] .cell.skipd{background:rgba(0,0,0,.02)}

  .sum{display:flex;gap:8px;margin-bottom:18px}
  .sum>div{flex:1;background:var(--surface);border:.5px solid var(--hair-2);border-radius:14px;
    padding:14px 6px;text-align:center;box-shadow:var(--sh-1)}
  .sum .v{font-family:var(--serif);font-size:26px;line-height:1;color:var(--ink);letter-spacing:-.02em}
  .sum .k{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;
    margin-top:6px;font-weight:600}

  .macro{display:flex;gap:8px;margin-bottom:16px}
  .macro>div{flex:1;background:var(--surface);border:.5px solid var(--hair-2);border-radius:14px;
    padding:14px 4px 12px;text-align:center;box-shadow:var(--sh-1);position:relative;overflow:hidden}
  .macro>div::before{content:"";position:absolute;top:0;left:12px;right:12px;height:2px;border-radius:0 0 2px 2px}
  .macro>div:nth-child(1)::before{background:#4ADE80}
  .macro>div:nth-child(2)::before{background:#A78BFA}
  .macro>div:nth-child(3)::before{background:#FB923C}
  .macro>div:nth-child(4)::before{background:#F5B946}
  .macro .v{font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600;
    font-variant-numeric:tabular-nums}
  .macro .k{font-size:8.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;
    margin-top:5px;font-weight:600}

  /* Meal cards (old .meal kept for compat) */
  .meal{background:var(--surface);border:.5px solid var(--hair-2);border-radius:14px;padding:14px;
    margin-bottom:8px;display:flex;gap:12px;box-shadow:var(--sh-1);transition:opacity .2s;position:relative}
  .chk{width:26px;height:26px;border-radius:8px;border:.5px solid var(--hair-3);flex-shrink:0;
       display:flex;align-items:center;justify-content:center;color:var(--ac-ink);font-size:14px;margin-top:1px;
       background:var(--sunk);transition:all var(--dur-fast) var(--ease);font-weight:700}
  .chk:active{transform:scale(.94)}
  .chk.on{background:var(--ok);border-color:var(--ok);color:#0A0B0F}
  .chk.no{background:var(--danger);border-color:var(--danger);color:#fff}
  .meal.faltou{opacity:.5}
  .meal.faltou .mi{text-decoration:line-through;text-decoration-color:var(--faint)}
  .meal .b{flex:1;min-width:0}
  .meal .mt{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.005em;line-height:1.3}
  .meal .mi{font-size:12.5px;color:var(--muted);line-height:1.55;white-space:pre-line;margin-top:5px}
  .meal .dots{width:28px;height:28px;border-radius:8px;background:transparent;color:var(--faint);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;letter-spacing:1px}

  /* Dieta hero + layout */
  .diet-hero{background:var(--surface);border:.5px solid var(--hair-2);border-radius:var(--r-lg);
    padding:22px 22px 20px;margin-bottom:16px;box-shadow:var(--sh-2);position:relative;overflow:hidden}
  .diet-hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 60% at 100% 0%,var(--ac-soft),transparent 55%)}
  .diet-hero .row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
  .diet-hero .avatar{width:48px;height:48px;border-radius:50%;background:var(--ac);color:var(--ac-ink);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;
    font-size:24px;font-weight:400;flex-shrink:0;letter-spacing:-.02em;
    box-shadow:0 4px 14px var(--ac-glow)}
  .diet-hero .greet{flex:1;min-width:0}
  .diet-hero .greet .hi{font-size:11px;color:var(--faint);letter-spacing:.16em;
    text-transform:uppercase;font-weight:600}
  .diet-hero .greet .nm{font-family:var(--serif);font-size:22px;line-height:1.15;color:var(--ink);
    letter-spacing:-.015em;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .diet-hero .today{margin-top:16px;font-size:12.5px;color:var(--muted);letter-spacing:-.005em;
    position:relative;z-index:1;font-variant-numeric:tabular-nums}
  .diet-hero .today b{font-weight:600;color:var(--ink)}

  .qa-title{font-family:var(--serif);font-size:17px;color:var(--ink);margin:18px 4px 10px;letter-spacing:-.01em}
  .qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .qa-btn{display:flex;flex-direction:column;align-items:center;gap:7px;background:transparent;
    padding:6px 2px;transition:transform var(--dur-fast) var(--ease)}
  .qa-btn:active{transform:scale(.94)}
  .qa-btn .ic{width:52px;height:52px;border-radius:16px;background:var(--surface);
    border:.5px solid var(--hair-2);display:flex;align-items:center;justify-content:center;
    color:var(--ink);box-shadow:var(--sh-1);font-size:20px}
  .qa-btn .ic svg{width:20px;height:20px;stroke-width:1.7}
  .qa-btn.accent .ic{background:var(--ac);border-color:transparent;color:var(--ac-ink);
    box-shadow:0 4px 14px var(--ac-glow)}
  .qa-btn .lb{font-size:11px;color:var(--muted);text-align:center;line-height:1.2;
    letter-spacing:-.005em;font-weight:500}

  .plan-head{display:flex;justify-content:space-between;align-items:baseline;margin:8px 4px 12px}
  .plan-head .t{font-family:var(--serif);font-size:19px;color:var(--ink);letter-spacing:-.012em}
  .plan-head .a{font-size:12.5px;color:var(--ac);font-weight:600;background:none;border:0;padding:0;letter-spacing:-.005em}

  .macros-lite{display:flex;gap:4px;margin:0 4px 14px;padding:12px 4px;background:var(--surface);
    border:.5px solid var(--hair-2);border-radius:14px;box-shadow:var(--sh-1)}
  .macros-lite>div{flex:1;text-align:center;position:relative}
  .macros-lite>div+div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;
    width:.5px;background:var(--hair-2)}
  .macros-lite .v{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .macros-lite .k{font-size:9px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;
    margin-top:4px;font-weight:600}

  .mealx{background:var(--surface);border:.5px solid var(--hair-2);border-radius:18px;
    padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--sh-1);position:relative;
    transition:opacity .2s var(--ease)}
  .mealx.done{border-color:rgba(74,222,128,.35);
    background:linear-gradient(180deg,rgba(74,222,128,.05) 0%,var(--surface) 60%)}
  .mealx.faltou{opacity:.55}
  .mealx.faltou .mx-items{text-decoration:line-through;text-decoration-color:var(--faint)}
  .mx-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .mx-head .badge{width:8px;height:8px;border-radius:50%;background:var(--ac);flex-shrink:0}
  .mealx.done .mx-head .badge{background:var(--ok)}
  .mealx.faltou .mx-head .badge{background:var(--danger)}
  .mx-name{flex:1;font-family:var(--serif);font-size:18px;color:var(--ink);
    letter-spacing:-.012em;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .mx-hora{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--sunk);
    border:.5px solid var(--hair-2);padding:4px 9px;border-radius:999px;letter-spacing:.02em;
    font-weight:500;flex-shrink:0;font-variant-numeric:tabular-nums}
  .mx-dots{width:30px;height:30px;border-radius:9px;background:transparent;color:var(--faint);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;
    letter-spacing:1px;transition:all var(--dur-fast) var(--ease)}
  .mx-dots:active{background:var(--surface-2);color:var(--ink)}
  .mx-items{font-size:13px;color:var(--muted);line-height:1.65;white-space:pre-line;
    margin:0 0 14px;padding:0 2px;letter-spacing:-.005em}
  .mx-foot{display:flex;gap:8px;align-items:center;justify-content:flex-end}
  .mx-check-mini{width:36px;height:36px;border-radius:11px;border:.5px solid var(--hair-2);
    background:var(--sunk);color:var(--muted);font-size:15px;display:flex;align-items:center;
    justify-content:center;transition:all var(--dur-fast) var(--ease);font-weight:600}
  .mx-check-mini:active{transform:scale(.94)}
  .mx-check-mini.on{background:var(--ok);border-color:var(--ok);color:#0A0B0F}
  .mx-check-mini.no{background:var(--danger);border-color:var(--danger);color:#fff}
  .mx-reg{flex:1;height:44px;border-radius:12px;background:var(--ac);color:var(--ac-ink);
    font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;
    letter-spacing:-.005em;box-shadow:0 4px 12px var(--ac-glow),inset 0 .5px 0 rgba(255,255,255,.2);
    transition:all var(--dur-fast) var(--ease)}
  .mx-reg:active{transform:scale(.98);opacity:.94}
  .mx-reg.done{background:var(--surface-2);color:var(--ac);box-shadow:none;
    border:.5px solid rgba(232,93,63,.35)}

  .extras-card{background:var(--surface);border:.5px solid var(--hair-2);border-radius:16px;
    padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh-1)}
  .extras-card .eh{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
    font-weight:600;margin-bottom:10px}
  .extras-card .ei{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:13.5px;color:var(--ink)}
  .extras-card .ei+.ei{border-top:.5px dashed var(--hair)}
  .extras-card .ei .dt{color:var(--ac);font-size:14px}

  .diary-title{font-family:var(--serif);font-size:17px;color:var(--ink);margin:22px 4px 12px;
    display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.01em}
  .diary-title button{font-size:12px;color:var(--ac);font-weight:600;background:none;
    border:0;padding:0;font-family:var(--sans);letter-spacing:-.005em}
  .diary-empty{padding:24px 18px;background:var(--surface);border:1px dashed var(--hair-2);
    border-radius:14px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
  .diary-empty b{color:var(--ink);font-weight:600}
  .diary-mini{background:var(--surface);border:.5px solid var(--hair-2);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh-1)}
  .diary-mini .top{display:flex;justify-content:space-between;align-items:baseline;
    gap:8px;margin-bottom:5px}
  .diary-mini .rn{font-size:12.5px;font-weight:600;color:var(--ac)}
  .diary-mini .dm{font-size:10.5px;color:var(--faint);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .diary-mini .tx{font-size:12.5px;color:var(--muted);line-height:1.55;white-space:pre-line;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .diet-nota{margin:4px 4px 14px;font-size:12px;color:var(--faint);line-height:1.6;
    padding:12px 14px;background:var(--surface);border:.5px dashed var(--hair-2);border-radius:12px}

  .ta{width:100%;min-height:110px;border:.5px solid var(--hair-2);border-radius:11px;background:var(--sunk);
      padding:12px;font-size:13.5px;font-family:var(--sans);color:var(--ink);outline:none;
      line-height:1.6;resize:vertical;transition:all var(--dur-fast) var(--ease)}
  .ta:focus{border-color:var(--ac);background:var(--surface);box-shadow:0 0 0 3px var(--ac-soft)}
  .ta::placeholder{color:var(--faint)}

  /* Sheets */
  .sug-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:2000;
    display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .24s var(--ease)}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sug-sheet{background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    border-radius:24px 24px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -20px 60px rgba(0,0,0,.6);border-top:.5px solid var(--hair-2);position:relative;
    -webkit-overflow-scrolling:touch}
  .sug-sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:38px;height:4px;border-radius:999px;background:var(--hair-3)}
  .sug-head{display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:18px;gap:12px;padding-top:6px}
  .sug-head .t{font-family:var(--serif);font-size:22px;line-height:1.2;color:var(--ink);letter-spacing:-.012em}
  .sug-head .s{font-size:11.5px;color:var(--faint);margin-top:5px;letter-spacing:.005em}
  .sug-close{width:34px;height:34px;border-radius:11px;background:var(--sunk);
    border:.5px solid var(--hair-2);color:var(--muted);font-size:18px;line-height:1;flex-shrink:0;
    transition:all var(--dur-fast) var(--ease)}
  .sug-close:active{background:var(--surface-2);transform:scale(.94)}
  .sug-card{background:var(--sunk);border:.5px solid var(--hair-2);border-radius:14px;
    padding:14px;margin-bottom:10px}
  .sug-card .n{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--ink);letter-spacing:-.005em}
  .sug-card .i{font-size:12.5px;color:var(--muted);line-height:1.7;white-space:pre-line;margin-bottom:10px}
  .sug-card .u{width:100%;height:40px;border-radius:11px;background:var(--ac);color:var(--ac-ink);
    font-size:12.5px;font-weight:600;letter-spacing:-.005em;
    box-shadow:0 3px 10px var(--ac-glow),inset 0 .5px 0 rgba(255,255,255,.2)}
  .sug-load{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
  .sug-load::before{content:"";display:block;width:22px;height:22px;margin:0 auto 14px;
    border:2px solid var(--hair-3);border-top-color:var(--ac);border-radius:50%;
    animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sug-err{padding:14px 16px;background:rgba(248,113,113,.08);
    border:.5px solid rgba(248,113,113,.35);border-radius:12px;color:var(--danger);
    font-size:12.5px;line-height:1.5}

  /* Coach */
  .coach-sec{background:var(--surface);border:.5px solid var(--hair-2);border-radius:14px;
    padding:14px 15px;margin-bottom:10px;box-shadow:var(--sh-1)}
  .coach-sec .hd{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint);margin-bottom:12px;font-weight:600}
  .coach-sec .hd .em{font-size:15px;letter-spacing:0;color:var(--ac)}
  .coach-treino .letter{font-family:var(--serif);font-style:italic;font-size:52px;line-height:.82;
    color:var(--ac);letter-spacing:-.04em}
  .coach-treino .row{display:flex;gap:14px;align-items:center;margin-bottom:10px}
  .coach-treino .nome{font-family:var(--serif);font-size:20px;line-height:1.2;color:var(--ink);letter-spacing:-.012em}
  .coach-body{font-size:14px;color:var(--muted);line-height:1.65;letter-spacing:-.005em}
  .coach-body b{color:var(--ink);font-weight:600}
  .coach-cargas .item{padding:11px 0;border-top:.5px dashed var(--hair);font-size:13px;line-height:1.55}
  .coach-cargas .item:first-child{border-top:none;padding-top:2px}
  .coach-cargas .nm{font-weight:600;color:var(--ink);display:block;font-size:13px;margin-bottom:3px;letter-spacing:-.005em}
  .coach-cargas .sg{color:var(--muted)}
  .coach-alert{background:rgba(245,185,70,.06);border-color:rgba(245,185,70,.35)}
  .coach-alert .hd{color:var(--warn)}
  .coach-motiv{background:linear-gradient(135deg,var(--ac-soft) 0%,rgba(126,169,255,.06) 100%);
    border-color:rgba(232,93,63,.25);font-family:var(--serif);font-size:16px;font-style:italic;
    line-height:1.5;color:var(--ink);text-align:center;padding:18px;margin-bottom:10px;letter-spacing:-.01em}
  .coach-apply{width:100%;height:48px;border-radius:12px;background:var(--ac);color:var(--ac-ink);
    font-size:14px;font-weight:600;margin-top:8px;letter-spacing:-.005em;
    box-shadow:0 4px 12px var(--ac-glow),inset 0 .5px 0 rgba(255,255,255,.2)}
  .coach-apply.done{background:var(--ok);color:#0A0B0F}

  .chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px}
  .chip{height:46px;border-radius:12px;background:var(--surface);border:.5px solid var(--hair-2);
        font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;
        justify-content:center;gap:6px;transition:all var(--dur-fast) var(--ease)}
  .chip:active{transform:scale(.97);background:var(--surface-2)}
  .chip.on{border-color:var(--ac);color:var(--ac);background:var(--ac-soft);font-weight:600}

  .log-item{background:var(--sunk);border:.5px solid var(--hair-2);border-radius:12px;
    padding:11px 13px;margin-bottom:6px;cursor:pointer;transition:all var(--dur-fast) var(--ease)}
  .log-item:active{background:var(--surface-2);transform:scale(.99)}
  .log-item .log-meta{font-size:10.5px;color:var(--faint);font-family:var(--mono);margin-bottom:3px;
    letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .log-item .log-txt{font-size:12.5px;color:var(--muted);line-height:1.5;overflow:hidden;
    text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  .sug-sheet .ed-f{margin-bottom:9px}

  .hx-kpis b,.rs-kpis b{display:block;font-family:var(--mono);font-size:18px;color:var(--ink)}
  .rs-kpis b.up{color:var(--ok)} .rs-kpis b.down{color:var(--danger)}
  .hx-kpis span,.rs-kpis span{font-size:10.5px;color:var(--faint)}
  .hx-ch{width:100%;height:70px;margin:4px 0 2px}
  .hx-ch polyline{fill:none;stroke:var(--ac);stroke-width:2.2;vector-effect:non-scaling-stroke}
  .hx-ch circle{fill:var(--ac)}
  .hx-leg{font-size:10.5px;color:var(--faint);margin-bottom:10px}
  .hx-row{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:.5px dashed var(--hair)}
  .hx-row .dt{font-family:var(--mono);font-size:12px;color:var(--faint);width:40px;flex-shrink:0}
  .hx-row .v{flex:1;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
  .hx-row .pr,.rs-pr em{font-style:normal;font-size:10px;font-weight:700;color:#0A0B0F;background:#f59e0b;border-radius:6px;padding:1px 6px}
  .rs-pr-t{font-size:13px;font-weight:700;color:#f59e0b;margin:6px 0 6px}
  .rs-pr{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:.5px dashed var(--hair);font-size:13px}
  .rs-pr span{flex:1;color:var(--muted)} .rs-pr b{font-family:var(--mono);color:var(--ink)}
  .rs-nopr{font-size:13px;color:var(--muted);line-height:1.5;padding:6px 2px}

  /* =====================================================================
     v38 · Design "pace" (protótipo rodada 3) — tokens + componentes.
     Mesma estrutura nos temas claro/escuro; só os tokens mudam.
     Cores sólidas, sem gradiente/brilho; um destaque (pc-hl) por tela.
     ===================================================================== */
  :root{
    --paper:#0F1613; --surface:#16201C; --surface-2:#1C2823; --sunk:#131C18;
    --ink:#ECF1EE; --muted:#A3AEA8; --faint:#77837D;
    --hair:#223029; --hair-2:#2C3A33; --hair-3:#3A4A42;
    --ac:#7ADBB5; --ac-ink:#0B1A13; --ac-soft:#1F3A2F; --ac-glow:transparent;
    --ok:#7ADBB5; --danger:#F08A7E; --warn:#E7B45C; --info:#6FB3F2; --blue:#6FB3F2; --water:#6FB3F2;
    --hl-bg:#EEEADC; --hl-ink:#121916; --hl-muted:#4D5A53; --hl-track:#D9D4C3;
    --btn-hl:#121916; --on-btn-hl:#F4F2EA;
    --serif:var(--sans); --display:var(--sans); --mono:var(--sans);
    --sh-1:none; --sh-2:none; --sh-3:0 18px 50px rgba(0,0,0,.45); --shadow:none; --shadow-lg:none;
    --tab-bg:#0F1613; --tap:48px;
  }
  html[data-theme="light"]{
    --paper:#F5F4EF; --surface:#FFFFFF; --surface-2:#F0EFE9; --sunk:#EDECE5;
    --ink:#14201A; --muted:#56615B; --faint:#7C8680;
    --hair:#E2E1D9; --hair-2:#D2D1C7; --hair-3:#BDBCB1;
    --ac:#1F6B4E; --ac-ink:#FFFFFF; --ac-soft:#DCEFE6;
    --ok:#1F6B4E; --danger:#B8412F; --warn:#A96A12; --info:#2F7FC8; --blue:#2F7FC8; --water:#2F7FC8;
    --hl-bg:#1E3A2F; --hl-ink:#F2F5F3; --hl-muted:#B7C8BF; --hl-track:#35584A;
    --btn-hl:#9FE3C6; --on-btn-hl:#0E2219;
    --sh-1:none; --sh-2:none; --sh-3:0 18px 50px rgba(20,22,30,.16); --shadow:none; --shadow-lg:none;
    --tab-bg:#F5F4EF;
  }
  @media (prefers-color-scheme: light){
    html[data-theme="auto"]{
      --paper:#F5F4EF; --surface:#FFFFFF; --surface-2:#F0EFE9; --sunk:#EDECE5;
      --ink:#14201A; --muted:#56615B; --faint:#7C8680;
      --hair:#E2E1D9; --hair-2:#D2D1C7; --hair-3:#BDBCB1;
      --ac:#1F6B4E; --ac-ink:#FFFFFF; --ac-soft:#DCEFE6;
      --ok:#1F6B4E; --danger:#B8412F; --warn:#A96A12; --info:#2F7FC8; --blue:#2F7FC8; --water:#2F7FC8;
      --hl-bg:#1E3A2F; --hl-ink:#F2F5F3; --hl-muted:#B7C8BF; --hl-track:#35584A;
      --btn-hl:#9FE3C6; --on-btn-hl:#0E2219;
      --sh-3:0 18px 50px rgba(20,22,30,.16); --tab-bg:#F5F4EF;
    }
  }
  body{font-size:16px;letter-spacing:0;font-feature-settings:normal}
  body *:not(svg):not(svg *){background-image:none!important;text-shadow:none!important}
  .hero::after{display:none}
  .hero .letter,.sg .l,.cell .l,.coach-treino .letter{font-style:normal}
  .wrap{padding:calc(12px + env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom))}
  .eyebrow{font-size:11px;letter-spacing:.12em}

  /* ---------- ícones ---------- */
  .pc-ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .pc-ic.sm{width:18px;height:18px}

  /* ---------- topo / títulos ---------- */
  .pc-top{display:flex;align-items:center;gap:12px;min-height:var(--tap)}
  .pc-brand{font-weight:800;font-size:28px;letter-spacing:-.04em;line-height:1;margin-right:auto;color:var(--ink);display:inline-flex;align-items:center;gap:10px}
  .pc-mark{width:32px;height:32px;flex:none}
  .mk-bg{fill:var(--ink)} .mk-ring{stroke:var(--paper)} .mk-dot{fill:var(--ac)}
  .login-mark{width:72px;height:72px;margin-bottom:4px}
  .pc-more{margin:12px 0 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .pc-more summary,.pc-dica summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;color:var(--muted);font-size:14px;font-weight:600}
  .pc-more summary::-webkit-details-marker,.pc-dica summary::-webkit-details-marker{display:none}
  .pc-more summary::after,.pc-dica summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-right:6px;transition:transform .15s}
  .pc-more[open] summary::after,.pc-dica[open] summary::after{transform:rotate(-135deg)}
  .pc-more p,.pc-dica p{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.5}
  .pc-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid var(--hair);font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pc-chip .pc-ic{width:14px;height:14px;color:var(--muted)}
  .pc-exm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pc-dica{flex:1 1 100%}
  .pc-dica summary{min-height:40px;font-size:13px}
  .pc-dica .apv{color:var(--ink);font-weight:500}
  .pc-dica .ap{margin:0 0 10px}
  .pc-stats{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px;color:var(--muted);font-size:14px}
  .pc-stats b{color:var(--ink);font-size:16px}
  .pc-avatar{width:var(--tap);height:var(--tap);border-radius:50%;border:1.5px solid var(--hair-3);font-weight:650;font-size:17px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .pc-h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.06;margin:18px 0 2px;color:var(--ink)}
  .pc-dnav{display:flex;align-items:center;gap:4px;min-height:var(--tap)}
  .pc-dnav .pc-sub{flex:1;margin:0}
  .pc-dnav.w{flex-wrap:wrap}
  .pc-dnav.w .pc-sub{flex:1 1 100%}
  .pc-dnav.w .pc-link{margin-right:auto;padding-left:0}
  .pc-sub{color:var(--muted);font-size:17px;margin:0}
  .pc-ib{width:var(--tap);height:var(--tap);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
  .pc-ib:disabled{opacity:.3}
  .pc-link{display:inline-flex;align-items:center;gap:4px;min-height:var(--tap);color:var(--ink);font-size:15px;font-weight:500}
  .pc-link.ac{color:var(--ac);font-weight:700}
  .pc-sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 10px}
  .pc-sec-h h2{font-size:22px;font-weight:750;letter-spacing:-.02em;margin:0;color:var(--ink)}
  .pc-sec-h .aside{color:var(--muted);font-size:15px;white-space:nowrap}
  .pc-why{color:var(--muted);font-size:14px;line-height:1.5;margin:10px 2px 0}
  .pc-note{color:var(--faint);font-size:13px;line-height:1.5;margin:8px 2px 0}

  /* ---------- destaque principal ---------- */
  .pc-hl{background:var(--hl-bg);color:var(--hl-ink);border-radius:18px;padding:20px;margin-top:18px}
  .pc-hl .ey{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--hl-muted)}
  .pc-hl .ey .dot{width:8px;height:8px;border-radius:50%;background:#2FBF7F}
  .pc-hl .ey .tag{letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--hl-muted);font-size:11px}
  .pc-hl .ttl{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:8px 0 4px}
  .pc-hl .meta{color:var(--hl-muted);font-size:16px;margin-bottom:16px;font-variant-numeric:tabular-nums}
  .pc-hl .big{font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .pc-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:700;font-size:17px;width:100%}
  .pc-btn .pc-ic{width:20px;height:20px}
  .pc-btn.hl{background:var(--btn-hl);color:var(--on-btn-hl)}
  .pc-btn.pri{background:var(--ac);color:var(--ac-ink)}
  .pc-btn.ghost{border:1.5px solid var(--hair-3);color:var(--ink)}
  .pc-btn.sm{min-height:var(--tap);width:auto;padding:0 16px;font-size:15px;border-radius:12px}
  .pc-btn.oac{border:1.5px solid var(--ac);color:var(--ac)}
  .pc-btn:disabled{opacity:.45}
  .pc-warn{border:1.5px solid var(--warn);border-radius:14px;padding:14px;margin-top:14px;color:var(--ink);font-size:14.5px;line-height:1.5}
  .pc-warn .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  /* ---------- linhas ---------- */
  .pc-list{border-top:1px solid var(--hair)}
  .pc-list.nb{border-top:0}
  .pc-row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left;color:var(--ink)}
  .pc-row .main{flex:1;min-width:0;text-align:left}
  .pc-row .t{font-weight:650;font-size:17px;line-height:1.3}
  .pc-row .s{color:var(--muted);font-size:15px;margin-top:2px;line-height:1.35}
  .pc-row .end{display:flex;align-items:center;gap:6px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
  .pc-row .chev{color:var(--faint);display:inline-flex}
  .pc-st-ok{width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--ac-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .pc-st-ok .pc-ic{width:18px;height:18px;stroke-width:2.6}
  .pc-st-pl{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--hair-3);color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800}
  .pc-st-pl .pc-ic{width:18px;height:18px}
  .pc-st-no{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--danger);color:var(--danger);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800}
  .pc-pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;background:var(--surface-2);color:var(--ink)}

  /* ---------- semana ---------- */
  .pc-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .pc-wd{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:var(--tap);padding:4px 0;color:var(--ink)}
  .pc-wd .k{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .pc-wd .n{font-size:16px;font-variant-numeric:tabular-nums}
  .pc-wd .c{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--hair-3);display:flex;align-items:center;justify-content:center;position:relative}
  .pc-wd .c .pc-ic{width:18px;height:18px}
  .pc-wd.done .c{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
  .pc-wd.done .c .pc-ic{stroke-width:2.6}
  .pc-wd.prog .c{border:2.5px solid var(--ac);color:var(--ac)}
  .pc-wd.x .c::after{content:"";position:absolute;bottom:-7px;width:5px;height:5px;border-radius:50%;background:var(--info)}
  .pc-wd.hj .k,.pc-wd.hj .n{color:var(--ink);font-weight:800}
  .pc-wd.sel .n{text-decoration:underline;text-underline-offset:4px}
  .pc-legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:13px;margin-top:10px}
  .pc-legend span{display:inline-flex;align-items:center;gap:6px}
  .pc-legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .pc-legend i.d{background:var(--ac)} .pc-legend i.p{border:2px solid var(--ac)} .pc-legend i.x{background:var(--info);width:8px;height:8px}

  /* ---------- barras / números ---------- */
  .pc-bar{height:10px;border-radius:6px;background:var(--hair);overflow:hidden}
  .pc-bar>i{display:block;height:100%;border-radius:6px;background:var(--ac)}
  .pc-kc{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
  .pc-kc b{font-size:36px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
  .pc-kc span{color:var(--muted);font-size:17px}
  .pc-macros{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px}
  .pc-macros>div{text-align:center;padding:2px 6px}
  .pc-macros>div+div{border-left:1px solid var(--hair)}
  .pc-macros b{display:block;font-size:19px;font-weight:750;color:var(--ink);font-variant-numeric:tabular-nums}
  .pc-macros span{color:var(--muted);font-size:13.5px}

  /* ---------- abas (componente único) ---------- */
  .pc-tabs{display:flex;border-bottom:1px solid var(--hair);margin-top:14px}
  .pc-tab{flex:1;min-height:var(--tap);font-size:17px;font-weight:600;color:var(--muted);position:relative}
  .pc-tab[aria-selected="true"]{color:var(--ac)}
  .pc-tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:var(--ac);border-radius:2px}
  .pc-period{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
  .pc-period .lbl{font-weight:650;font-size:17px}
  .pc-sel{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1.5px solid var(--hair-3);font-weight:650;font-size:17px;color:var(--ink);text-align:left}
  .pc-cmp{display:grid;grid-template-columns:1fr 1fr;margin-top:14px}
  .pc-cmp>div{padding:0 12px}
  .pc-cmp>div:first-child{padding-left:0}
  .pc-cmp>div+div{border-left:1px solid var(--hair)}
  .pc-cmp .d{color:var(--muted);font-size:14px}
  .pc-cmp .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .pc-cmp .v small{font-size:15px;font-weight:600;color:var(--muted)}
  .pc-delta{display:inline-block;margin-top:6px;font-weight:700;font-size:15px;color:var(--ac)}
  .pc-delta.neg{color:var(--danger)}
  .pc-crit{color:var(--muted);font-size:14px;margin-top:12px;line-height:1.5}

  /* ---------- barra de navegação ---------- */
  .tabbar{background:var(--tab-bg);backdrop-filter:none;-webkit-backdrop-filter:none;border-top:1px solid var(--hair)}
  .tabbar .in{padding:0;gap:0}
  .tb{height:64px;font-size:13px;color:var(--muted);border-radius:0;gap:4px}
  .tb::before{display:none}
  .tb.on{color:var(--ac);font-weight:700}
  .tb.on svg{color:var(--ac)}
  .tb svg,.tb .pc-ic{width:24px;height:24px;stroke-width:1.8}
  .tb.on .pc-ic{stroke-width:2.3}
  body.pc-session .tabbar{display:none}
  body.pc-session .wrap{padding-bottom:calc(150px + env(safe-area-inset-bottom))}

  /* ---------- sessão de treino ---------- */
  .pc-stop{display:grid;grid-template-columns:var(--tap) 1fr auto;align-items:center;gap:8px;min-height:56px}
  .pc-stop .mid{text-align:center;font-weight:700;font-size:17px;color:var(--ink)}
  .pc-stop .end{color:var(--ac);font-weight:700;font-size:17px;min-height:var(--tap);padding:0 4px}
  .pc-stop .end:disabled{opacity:.5}
  .pc-stitle{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 2px;color:var(--ink)}
  .pc-ex{margin-top:22px;padding-top:4px}
  .pc-exh{display:flex;align-items:flex-start;gap:10px}
  .pc-exn{flex:1;text-align:left;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:var(--ink);min-height:var(--tap)}
  .pc-exn small{display:block;font-size:13px;font-weight:600;color:var(--ac);letter-spacing:0;margin-top:2px}
  .pc-exm{color:var(--muted);font-size:14.5px;line-height:1.45;margin:2px 0 8px}
  .pc-ex .ap{margin:0 0 8px}
  .pc-sh,.pc-sr{display:grid;grid-template-columns:1.6rem minmax(3.2rem,1fr) minmax(4.3rem,1.15fr) minmax(4.3rem,1.15fr) var(--tap);gap:8px;align-items:center}
  .pc-sh{color:var(--muted);font-size:13px;font-weight:600;padding:0 6px 8px;border-bottom:1px solid var(--hair)}
  .pc-sh .c{text-align:center}
  .pc-sr{padding:8px 6px;border-bottom:1px solid var(--hair);border-radius:12px;margin:0}
  @media (max-width:340px){ .pc-sh,.pc-sr{grid-template-columns:1.4rem minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr) var(--tap);gap:6px} .pc-sr input{min-width:0} }
  .pc-sr.cur{outline:2px solid var(--ac);outline-offset:-2px;border-bottom-color:transparent}
  .pc-sr .ix{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .pc-sr .pv{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc-sr .w2{grid-column:span 2}
  .pc-sr input.cs{width:100%;min-height:var(--tap);height:var(--tap);border-radius:10px;border:1.5px solid var(--hair-3);background:var(--surface);text-align:center;font-size:17px;font-variant-numeric:tabular-nums;padding:0 4px;color:var(--ink);font-family:var(--sans)}
  .pc-sr input.cs::placeholder{color:var(--faint)}
  .pc-sr.done input.cs{background:transparent;border-color:var(--hair)}
  .pc-sr .set-ok{width:var(--tap);height:var(--tap);border-radius:12px;border:2px solid var(--hair-3);display:flex;align-items:center;justify-content:center;background:transparent;color:transparent;font-size:0;padding:0}
  .pc-sr .set-ok .pc-ic{width:22px;height:22px;stroke-width:2.8}
  .pc-sr.done .set-ok,.pc-sr .set-ok.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
  .pc-obs{padding:4px 6px 8px 2.3rem;border-bottom:1px solid var(--hair)}
  .pc-obs input{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--hair-2);background:var(--surface);padding:0 12px;font-size:15px;color:var(--ink)}
  .pc-exf{display:flex;justify-content:flex-end;gap:12px}
  .pc-bottom{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:1px solid var(--hair);padding:8px 20px calc(12px + env(safe-area-inset-bottom))}
  .pc-bottom .in2{max-width:520px;margin:0 auto}
  .pc-bottom .note{text-align:center;color:var(--faint);font-size:13px;margin-bottom:8px}
  body.kb-open .pc-bottom{position:static;border-top:0;padding:8px 0 16px}
  body.kb-open.pc-session .wrap{padding-bottom:24px}
  .segs{margin-top:14px}
  .sg .l{font-family:var(--sans);font-weight:800;font-size:20px}
  .datebar{margin-top:12px}

  /* cronômetro compacto (fica fora do render) */
  .rest-bar{top:auto;bottom:calc(104px + env(safe-area-inset-bottom));left:16px;right:16px;max-width:488px;background:var(--hl-bg);color:var(--hl-ink);border:0;border-radius:18px;padding:10px 12px 12px;gap:10px;box-shadow:var(--sh-3)}
  .rest-bar .rb-t{text-align:left;order:0}
  .rest-bar .rb-t small{color:var(--hl-muted);font-size:12px;letter-spacing:.1em}
  .rest-bar .rb-t b{color:var(--hl-ink);font-size:30px;font-weight:800;font-family:var(--sans);font-variant-numeric:tabular-nums}
  .rest-bar button{min-height:var(--tap);height:var(--tap);min-width:52px;background:transparent;border:1.5px solid var(--hl-ink);color:var(--hl-ink);font-size:15px;font-weight:700;border-radius:12px}
  .rest-bar .rb-x{border-color:transparent;color:var(--hl-ink)}
  .rest-bar .rb-p{background:var(--hl-track)} .rest-bar .rb-p i{background:var(--hl-ink)}
  .rest-bar [data-rb="-15"]{order:1} .rest-bar [data-rb="15"]{order:2} .rest-bar .rb-x{order:3} .rest-bar .rb-t{flex:1}

  /* toast com desfazer */
  .pc-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:95;background:var(--ink);color:var(--paper);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;width:max-content;max-width:min(92vw,480px);font-size:15px;box-shadow:var(--sh-3)}
  .pc-toast button{min-height:40px;padding:0 12px;border-radius:10px;font-weight:750;color:var(--paper);text-decoration:underline}
  body.pc-session .pc-toast{bottom:auto;top:calc(12px + env(safe-area-inset-top))}
  body.kb-open .rest-bar{display:none}
  body.pc-session .wrap{padding-bottom:calc(200px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);border:0}

  /* calendário dentro de Evolução */
  .cal{background:transparent;border:0;padding:0;margin-top:8px}
  .cell .l{font-family:var(--sans);font-weight:800}
  .sum .v{font-family:var(--sans);font-weight:800}

  /* dieta — plano */
  .mealx{background:var(--surface);border:1px solid var(--hair);box-shadow:none}
  .mx-name{font-family:var(--sans);font-weight:700}
  .db-arw{width:44px;height:44px} .db-btn{min-height:44px;display:inline-flex;align-items:center}
  .pc-obs input,.obs-in{min-height:44px}
  .cfg-seg button{min-height:44px;height:44px}
  .mx-dots{min-width:44px;min-height:44px}
  .pc-bottom .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .login-brand .nm{font-family:var(--sans);font-weight:800;font-size:44px;letter-spacing:-.04em;color:var(--ink)}
  .login-sub{font-family:var(--sans);font-style:normal;color:var(--muted)}
  .cfg-row .em svg,.cfg-row .em .pc-ic{width:18px;height:18px}
  .cfg-row{min-height:56px}
  .pc-exf .pc-link{display:inline-flex;align-items:center;gap:6px}
  .chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
  .chip .pc-ic{width:16px;height:16px}
  .mx-dots .pc-ic{width:20px;height:20px}
  .cfg-row .caret{display:inline-flex}
  .cfg-theme button .pc-ic{width:20px;height:20px}
  .pace-ia-alerta{display:flex;gap:8px;align-items:flex-start}
  .sync-badge{font-size:11px}
  .pc-jejum{border:1.5px solid var(--warn);border-radius:14px;padding:14px;margin-top:14px;font-size:14.5px;line-height:1.5;color:var(--ink)}

  /* v42 · seções em verde, gráficos, opções da refeição, 5 abas */
  .pc-sec-h{border-top:1px solid var(--hair);padding-top:22px;margin-top:28px}
  .pc-sec-h h2{color:var(--ac);display:flex;align-items:center;gap:10px}
  .pc-sec-h h2::before{content:"";width:4px;height:20px;border-radius:3px;background:var(--ac);flex:none}
  .mx-name{color:var(--ac)}
  .tb{font-size:11.5px;letter-spacing:0}
  .tb svg,.tb .pc-ic{width:22px;height:22px}
  .gx{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px 12px 6px}
  .gx svg{width:100%;height:auto;display:block;overflow:visible}
  .gx-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--muted);padding:2px 2px 4px}
  .gx-h b{color:var(--ac);font-size:15px;white-space:nowrap}
  .gx-h b.neg{color:var(--danger)}
  .gx-line{fill:none;stroke:var(--ac);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  .gx-area{fill:var(--ac);opacity:.14}
  .gx-pt{fill:var(--surface);stroke:var(--ac);stroke-width:2.5}
  .gx-pt.last{fill:var(--ac)}
  .gx-val{font:700 12.5px var(--sans);fill:var(--ink)}
  .gx-lbl{font:500 11px var(--sans);fill:var(--muted)}
  .gx-bar{fill:var(--ac);opacity:.45}
  .gx-bar.ok{opacity:1}
  .gx-fut{fill:var(--hair-2)}
  .gx-meta{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4}
  .gx-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 2px 6px}
  .gx-leg span{display:inline-flex;align-items:center;gap:6px}
  .gx-leg i{width:10px;height:10px;border-radius:3px;background:var(--ac);opacity:.45;display:inline-block}
  .gx-leg i.ok{opacity:1}
  .gx-leg i.ln{height:0;border-top:1.5px dashed var(--muted);background:none;opacity:1;border-radius:0}
  .mo{display:flex;flex-direction:column;gap:10px}
  .mo-b{background:var(--sunk);border:1px solid var(--hair);border-radius:14px;padding:12px 14px}
  .mo-h{color:var(--ac);font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .mo-b ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
  .mo-b li{font-size:15px;line-height:1.45;color:var(--ink)}
  .mo-sub{color:var(--ac);font-weight:700;font-size:14px;margin:8px 0 4px}
  .mo-obs{font-size:14px;line-height:1.45;color:var(--muted)}
  .mo-sep{color:var(--ac);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin:18px 2px 8px}
  .mo-feita{display:flex;align-items:center;gap:8px;color:var(--ac);font-weight:600;margin:14px 2px 4px}

  /* v43 · encerrar antes do fim e marcar treino como feito */
  .pc-bb{display:grid;grid-template-columns:auto 1fr;gap:10px}
  .pc-bb .pc-btn.ghost{width:auto;padding:0 18px}
  .cfm-card{max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow-y:auto}
  .cfm-ops{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .cfm-op{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;min-height:56px;padding:12px 16px;border-radius:14px;background:var(--sunk);border:1.5px solid var(--hair-2);color:var(--ink);text-align:left}
  .cfm-op .ot{font-size:16px;font-weight:700;line-height:1.3}
  .cfm-op .ot em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-left:8px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;vertical-align:2px;white-space:nowrap}
  .cfm-op .os{font-size:13.5px;color:var(--muted);line-height:1.4}
  .cfm-op.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
  .cfm-op.pri .os{color:var(--ac-ink);opacity:.8}
  .cfm-cx{display:block;width:100%;height:50px;border-radius:14px;font-size:15px;font-weight:600;margin-top:10px}
  .cal-feito{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .cal-feito .pc-ic{width:18px;height:18px}
  .h-rapido{margin:8px 0 0;font-size:12.5px;color:var(--faint);line-height:1.4}
  .pc-hl-2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:10px;border-radius:14px;border:1.5px solid var(--hl-muted);color:var(--hl-ink);font-weight:700;font-size:16px;background:transparent}
  .pc-hl-2 .pc-ic{width:18px;height:18px}

  /* ---------- contas: ativação, envio por IA, administrador ---------- */
  .login-user{font-size:16px;font-weight:650;color:var(--ink);background:var(--sunk);border:.5px solid var(--hair-2);border-radius:12px;padding:13px 14px;word-break:break-all}
  .imp-escolher{position:relative;overflow:hidden;cursor:pointer}
  .imp-escolher input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
  .imp-lista{display:grid;gap:8px;margin-top:10px}
  .imp-arq{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 14px;border:1px solid var(--hair-2);border-radius:12px}
  .imp-arq .main{flex:1;min-width:0}
  .imp-arq .t{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .imp-arq .s{color:var(--muted);font-size:13px;margin-top:2px}
  .imp-av{margin:6px 0 0 18px;padding:0;font-size:14px;line-height:1.5}
  .imp-t{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px;flex-wrap:wrap}
  .imp-t b{font-weight:800;color:var(--ac);font-size:17px}
  .imp-t span{font-weight:650;font-size:16px;color:var(--ink)}
  .imp-t small{color:var(--muted);font-size:13px}
  .imp-tab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  .imp-tab th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.04em;padding:6px 6px 6px 0;border-bottom:1px solid var(--hair-2)}
  .imp-tab td{padding:8px 6px 8px 0;border-bottom:1px solid var(--hair);vertical-align:top;color:var(--ink)}
  .imp-tab td:nth-child(2),.imp-tab th:nth-child(2){width:52px;text-align:center}
  .imp-tab td:nth-child(3),.imp-tab th:nth-child(3){width:96px}
  .imp-tab td small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .imp-sem{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .imp-sem div{border:1px solid var(--hair-2);border-radius:10px;padding:6px 0}
  .imp-sem small{display:block;color:var(--muted);font-size:12px}
  .imp-sem b{font-size:15px}
  .imp-itens{color:var(--muted);font-size:14px;line-height:1.55;white-space:pre-line}
  .adm-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .adm-row{align-items:flex-start;padding:14px 0}
  .adm-row.lido{opacity:.62}
  .adm-perigo{color:var(--danger);border-color:var(--danger)}
  .adm-link{font-family:var(--mono);font-size:13px;line-height:1.5;word-break:break-all;margin:10px 0 6px;user-select:all;-webkit-user-select:all}
  .adm-txt{white-space:pre-wrap;margin-top:6px;font-size:15.5px;line-height:1.5;color:var(--ink)}
  .adm-data{font-weight:400;color:var(--muted);font-size:13px}

  /* ---------- v46: coach, sessão compacta, recordes, grupos ---------- */
  .pc-top-r{display:inline-flex;align-items:center;gap:8px}
  .pc-coachbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--hair-3);color:var(--ink);font-size:14px;font-weight:650}
  .pc-coachbtn .pc-ic{color:var(--ac)}
  .pc-coach{margin-top:14px}
  .pc-coach-in{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--hair-2);color:var(--muted);font-size:16px;text-align:left}
  .pc-coach-in span{flex:1}
  .pc-coach-in .pc-ic:first-child{color:var(--ac)}
  .pc-coach-q,.cc-q{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .pc-coach-q::-webkit-scrollbar,.cc-q::-webkit-scrollbar{display:none}
  .pc-coach-q .chip,.cc-q .chip{flex:none;height:38px;padding:0 14px;border-radius:999px;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center}
  .pc-hint{color:var(--faint);font-size:13px;line-height:1.45;margin:0 0 4px}
  .pc-hint:empty{display:none}
  .pc-planq{margin-top:16px}
  .pc-planq-h{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:8px}
  .chips.c4{grid-template-columns:repeat(auto-fit,minmax(70px,1fr));margin-bottom:6px}
  .chips.c4 .chip{height:42px;font-size:14px;gap:4px;padding:0 4px}
  .pc-acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
  .pc-act{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;border:1px solid var(--hair-2);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600}
  .pc-act.on{border-color:var(--ac);color:var(--ac);background:var(--ac-soft)}
  /* sessão */
  .pc-sstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
  .pc-sstats>div{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:9px 10px}
  .pc-sstats b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.15}
  .pc-sstats span{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pc-dline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 4px;color:var(--muted);font-size:14px}
  .pc-dline>span{display:inline-flex;align-items:center;gap:6px}
  .pc-dline .pc-link{min-height:36px;font-size:14px;color:var(--ac)}
  .segs.sm{gap:6px;margin:8px 0 6px;overflow-x:auto;scrollbar-width:none}
  .segs.sm::-webkit-scrollbar{display:none}
  .segs.sm .sg{height:auto;min-height:40px;flex:1 0 auto;flex-direction:row;gap:6px;padding:0 10px;border-radius:999px}
  .segs.sm .sg .l{font-size:18px}
  .segs.sm .sg .s{margin-top:0;font-size:11px}
  /* evolução */
  .pc-grs{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .pc-gr .n{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:5px;color:var(--ink)}
  .pc-gr .n b{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
  .pc-gr .pc-bar{height:6px}
  .pc-gr .pc-bar i{background:var(--hair-3)}
  .pc-gr.ok .n b{color:var(--ok,#2FBF7F)}
  .pc-gr.ok .pc-bar i{background:var(--ok,#2FBF7F)}
  .pc-rec .end{flex-direction:column;align-items:flex-end;gap:2px}
  .pc-rec .end small{font-size:12px;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .pc-new{background:var(--ac-soft);color:var(--ac);border-radius:999px;padding:1px 7px;font-weight:700;font-size:11px}
  /* conversa */
  .sug-sheet.cc-sheet{height:88vh;display:flex;flex-direction:column;padding-bottom:0}
  .cc-sheet .sug-head{position:sticky;top:-1px;z-index:3;background:var(--surface);padding-top:14px;margin-top:-14px}
  .cc-sheet #sugCorpo{flex:1;display:flex;flex-direction:column;min-height:0}
  .cc{display:flex;flex-direction:column;flex:1;min-height:0}
  .cc-msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
  .cc-intro{display:flex;gap:10px;font-size:14.5px;line-height:1.5;color:var(--muted);background:var(--sunk);border-radius:14px;padding:12px 14px}
  .cc-intro b{color:var(--ink)}
  .cc-av{width:30px;height:30px;border-radius:50%;background:var(--ac-soft);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
  .cc-m{display:flex}
  .cc-m.u{justify-content:flex-end}
  .cc-m .b{max-width:86%;border-radius:16px;padding:10px 13px;font-size:15px;line-height:1.5;word-wrap:break-word}
  .cc-m.u .b{background:var(--ac);color:var(--ac-ink);border-bottom-right-radius:5px}
  .cc-m.c .b{background:var(--surface-2);color:var(--ink);border-bottom-left-radius:5px}
  .cc-m .b p{margin:0 0 6px}
  .cc-m .b p:last-child{margin-bottom:0}
  .cc-m .b ul{margin:4px 0 8px;padding-left:18px}
  .cc-m .b li{margin:2px 0}
  .cc-act{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:10px;min-height:42px;padding:0 12px;border-radius:11px;background:var(--ac);color:var(--ac-ink);font-weight:700;font-size:14.5px}
  .cc-typing{display:inline-flex;gap:4px;align-items:center;min-height:22px}
  .cc-typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4;animation:ccdot 1.2s infinite}
  .cc-typing i:nth-child(2){animation-delay:.2s} .cc-typing i:nth-child(3){animation-delay:.4s}
  @keyframes ccdot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}
  .cc-err{font-size:14px;color:var(--danger);background:rgba(248,113,113,.08);border-radius:12px;padding:10px 12px}
  .cc-err button{color:var(--ink);font-weight:700;text-decoration:underline;margin-left:6px}
  .cc-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--hair);margin:0 -2px;padding:0 2px}
  .cc-in{display:flex;gap:8px;align-items:flex-end;padding:6px 0 calc(12px + env(safe-area-inset-bottom))}
  .cc-in textarea{flex:1;resize:none;min-height:44px;max-height:140px;border-radius:14px;border:1px solid var(--hair-3);background:var(--sunk);color:var(--ink);font:inherit;font-size:16px;line-height:1.4;padding:11px 12px}
  .cc-in textarea:focus{outline:none;border-color:var(--ac);background:var(--surface)}
  .cc-send{width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--ac-ink);display:flex;align-items:center;justify-content:center;flex:none}
  .cc-send:disabled{opacity:.4}
  .cc-novo{font-size:13px;font-weight:600;color:var(--muted);padding:0 10px;height:32px;border-radius:999px;border:1px solid var(--hair-2);margin-left:auto;margin-right:8px}
  .cc-q{padding:8px 0 2px}
  .cc-q:empty{display:none}
@media (prefers-reduced-motion: reduce){ .cc-typing i{animation:none} }

  /* ---------- v47: sessão (opções, troca, meta de carga), check-in, resumo da semana, acabamento ---------- */
  .pc-stop{position:sticky;top:0;z-index:30;background:var(--paper);margin:0 -20px;padding:0 20px;box-shadow:0 1px 0 var(--hair)}
  .pc-hl-ex{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 16px}
  .pc-hl-ex span{font-size:13px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.06);color:var(--hl-ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .pc-hl-ex .mais{background:transparent;color:var(--hl-muted);padding-left:2px}
  .pc-sopts{display:flex;align-items:center;gap:8px;margin:4px 0 2px;flex-wrap:wrap}
  .pc-sopt{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--hair-2);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600}
  .pc-sopt .pc-ic{color:var(--muted)}
  .pc-sopt.on{border-color:var(--ac);background:var(--ac-soft);color:var(--ac)}
  .pc-sopt.on .pc-ic{color:var(--ac)}
  .pc-sdur{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .pc-sdur .pc-ic{width:15px;height:15px}
  .pc-ex{background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:14px 12px 6px;margin-top:14px}
  .pc-exi{flex:none;min-width:34px;height:24px;margin-top:3px;border-radius:999px;background:var(--sunk);color:var(--muted);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .pc-exn{font-size:19px}
  .pc-trocar{flex:none;display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--hair-2);color:var(--muted);font-size:13px;font-weight:600}

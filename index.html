/* Render seguro contra digitação: se o usuário está com foco num input
   editável (kg/reps/obs de série, campos [data-f] de exercício, [data-meta]
   de perfil), adia o render pra não destruir o DOM debaixo do teclado do
   iOS — que fecha silenciosamente e faz "focou mas não digita". */
function safeRender(){
  try{
    const ae = document.activeElement;
    if(ae && ae.matches && (
        ae.matches('input[data-cex]') ||
        ae.matches('input[data-cob]') ||
        ae.matches('input[data-f]')   ||
        ae.matches('[data-meta]')     ||
        ae.matches('textarea')
    )){
      clearTimeout(safeRender._t);
      safeRender._t = setTimeout(safeRender, 800);
      return;
    }
  }catch(e){}
  render();
}

/* --------------------------- Aviso pré-treino: conflito com schedule/plan --- */
function verificarConflitoIniciar(p, dEscolhido){
  const dataRef = REF();
  const sch = schedHoje(p);
  const avisos = [];
  if(sch){
    if(sch.musc && sch.musc !== dEscolhido){
      const diaSem = WDL[new Date(dataRef+"T12:00").getDay()];
      let av = `Schedule de ${diaSem} sugere treino ${sch.musc}${sch.nota?" ("+sch.nota+")":""}, mas você escolheu ${dEscolhido}.`;
      if(sch.jiu && (dEscolhido==="B" || dEscolhido==="D")) av += " Tem jiu à noite — pernas pesadas antes podem prejudicar o tatame.";
      avisos.push(av);
    } else if(!sch.musc && (dEscolhido==="B" || dEscolhido==="D") && sch.jiu){
      avisos.push(`Hoje é dia de recuperação + jiu à noite. Treino ${dEscolhido} (pernas) pode sobrecarregar antes do tatame.`);
    }
  }
  // v30: passa a letra escolhida efetiva pra conflitoPlan (não schedule bruto),
  // consistente com o card principal que também usa a letra pós-anti-repetição.
  const conf = (typeof conflitoPlan==="function") ? conflitoPlan(p, dataRef, dEscolhido) : null;
  if(conf && (dEscolhido==="B" || dEscolhido==="D") && (!sch || sch.musc===dEscolhido)){
    avisos.push(conf.msg.replace(/<[^>]+>/g,""));
  }
  return avisos.length ? "\u26A0\uFE0F " + avisos.join("\n\n") + "\n\nContinuar mesmo assim?" : null;
}

/* --------------------------------------------------------------------- HOJE */
function viewHoje(p,m){
  const days = dayset(p);
  const treinoDoDia = S.events.find(e=>e.perfil===p&&e.tipo==="musc"&&e.data===REF());
  // Preview de "amanhã · próximo treino" só faz sentido quando o usuário está
  // vendo o dia de HOJE (ui.off===0) e o treino de hoje já foi concluído.
  // Em datas passadas/futuras navegadas pelas setas, não mostrar preview.
  const modoAmanha = !!(treinoDoDia && ui.off === 0);
  let r, dRefAmanha = null;
  if(modoAmanha){
    const savedOff = ui.off; ui.off = savedOff + 1;
    try{ r = avaliar(p); dRefAmanha = new Date(REF()+"T12:00"); }
    finally{ ui.off = savedOff; }
  } else {
    r = avaliar(p);
  }
  // v30: Anti-repetição agora é UNIVERSAL, aplicada dentro de sugestaoTreino()/avaliar().
  // Todos os cenários (hoje, amanhã via modoAmanha, futuro via ui.off>0, passado)
  // recebem a mesma regra: olhar 3 dias anteriores → se letra base foi feita,
  // trocar pra alternativa mais atrasada. Não há mais blocos ad-hoc aqui.
  const d = days[r.win.d];
  let out = semanaCard(p);

  // Se já treinou nesse dia -> mostra card "concluído" (Hevy-style hero verde)
  if(treinoDoDia){
    const diaFeito = days[treinoDoDia.dia];
    if(diaFeito){
      const lblDia = ui.off===0 ? "✓ Treino concluído"
        : (ui.off<0 ? "✓ Treino registrado neste dia" : "✓ Treino registrado neste dia futuro");
      out += `<div class="hero done">
        <div class="top">
          <div class="letter">${treinoDoDia.dia}</div>
          <div class="info">
            <div class="lbl" style="color:var(--ok)">${lblDia}</div>
            <div class="ttl">${esc(diaFeito.t)}</div>
            <div class="sub">${diaFeito.ex.length} exercícios · ${diaFeito.ex.reduce((a,e)=>a+e.s,0)} séries</div>
          </div>
        </div>
      </div>`;
      out += `<button class="go" data-edittoday="${treinoDoDia.dia}" style="background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--hair)">Ver / editar treino registrado</button>`;
    }
  }

  // Card do próximo treino (ou do dia)
  // Em datas passadas/futuras com treino já registrado, não mostrar o card de próximo treino
  // (o "concluído" já resume o dia; a próxima recomendação vive na tela de HOJE).
  const escondeProxCard = !!treinoDoDia && ui.off !== 0;
  const jiuChip = r.schedJiu ? `<span style="display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:rgba(58,216,121,.14);color:var(--ac);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase">Jiu à noite</span>` : "";
  const descansoChip = r.schedRest ? `<span style="display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase">Sem musc</span>` : "";
  if(!escondeProxCard){
    // Se o schedule diz que o dia é sem musc (recuperação/descanso), renderiza card diferente
    if(r.schedRest && ui.off===0 && !treinoDoDia){
      const notaTxt = r.win.schedNota || "Descanso";
      const isDescCompleto = /descanso completo/i.test(notaTxt);
      const emo = isDescCompleto ? "😴" : (r.schedJiu ? "🥋" : "🧘");
      const titulo = r.schedJiu ? `${notaTxt} · Jiu à noite` : notaTxt;
      out += `<div class="hero">
        <div class="top">
          <div class="letter" style="font-size:26px">${emo}</div>
          <div class="info">
            <div class="lbl">Hoje</div>
            <div class="ttl">${esc(titulo)}</div>
            <div class="sub">Sem musculação · schedule fixa</div>
          </div>
        </div>
        <div class="why">${r.win.motivo}${jiuChip}</div>
      </div>`;
    } else {
      const diaSemanaAmanha = dRefAmanha ? WDL[dRefAmanha.getDay()] : "amanhã";
      const eyebrow = modoAmanha
        ? `Amanhã · ${diaSemanaAmanha}`
        : (ui.off===0?"Próximo treino":"Treino do dia");
      const msg = modoAmanha
        ? `${r.win.motivo}`
        : `${r.descanso&&!r.schedRest?"<b>Neste dia o melhor é descansar.</b> ":""}${r.win.motivo}`;

      out += `<div class="hero">
        <div class="top">
          <div class="letter">${r.win.d}</div>
          <div class="info">
            <div class="lbl">${eyebrow}${jiuChip}${descansoChip}</div>
            <div class="ttl">${esc(d.t)}</div>
            <div class="sub">${d.ex.length} exercícios · ${d.ex.reduce((a,e)=>a+e.s,0)} séries</div>
          </div>
        </div>
        <div class="why">${msg}</div>
      </div>`;
    }
  }

  // v31: Card IA "Por que esse treino?" — populado por PaceIA.hydrate() após render.
  if(ui.off === 0 && !treinoDoDia){
    out += `<div id="pace-ia-card" class="pace-ia-slot"></div>`;
  }

  // Botão Iniciar treino — SEMPRE visível (mesmo em dias de descanso).
  // Schedule é sugestão, não bloqueio. Em dia de descanso abre seletor A/B/C/D.
  if(!treinoDoDia){
    if(r.schedRest){
      out += `<button class="go" data-picktreino="1" style="background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--hair)">${ICON.play} ${ui.off<0?"Registrar treino neste dia…":"Iniciar treino mesmo assim…"}</button>`;
    } else {
      out += `<button class="go" data-abrir="${r.win.d}">${ICON.play} ${ui.off<0?"Registrar treino "+r.win.d+" em "+brd(REF()):"Iniciar treino "+r.win.d}</button>`;
    }
  }

  // ============ Quick actions: planejar atividade do dia ============
  const dataRef = REF();
  const planHoje = getPlanejado(p, dataRef) || {};
  const quicks = ATIV_QUICK[p] || ["jiu","corrida","futebol","bike"];
  out += `<div class="qa-title" style="margin-top:18px">${ui.off===0?"Planejar hoje":(ui.off>0?"Planejar "+brd(dataRef):"Atividades de "+brd(dataRef))}</div>
    <div class="chips" style="margin-bottom:10px">
      ${quicks.map(a=>{
        const on = !!planHoje[a];
        const emo = emojiAtiv(a==="jiu"?"jiu-jitsu":a);
        const lbl = ATIV_LABEL[a] || a;
        // v27: jejum usa laranja/âmbar em vez de verde
        const isJejum = a==="jejum";
        const activeStyle = isJejum
          ? "background:#f59e0b;color:#000;border-color:#f59e0b"
          : "background:var(--ac);color:#000;border-color:var(--ac)";
        return `<button class="chip ${on?"on":""}" data-planq="${a}" style="${on?activeStyle:""}">${emo} ${on?"✓ ":"+ "}${esc(lbl)}</button>`;
      }).join("")}
    </div>`;

  // Chips de atividades PLANEJADAS
  const planKeys = Object.keys(planHoje).filter(k=>k!=="musc" && planHoje[k]);
  if(planKeys.length){
    out += `<div class="extras-list" style="margin-bottom:8px">`;
    planKeys.forEach(k=>{
      const emo = emojiAtiv(k==="jiu"?"jiu-jitsu":k);
      // v27: chip de jejum planejado com destaque âmbar
      const rowStyle = k==="jejum"
        ? ' style="background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.35)"'
        : '';
      const lblExtra = k==="jejum" ? " planejado 🌙" : " planejado";
      out += `<div class="row"${rowStyle}><span>${emo} ${esc(ATIV_LABEL[k]||k)}${lblExtra}</span><button class="rm" data-planq="${k}">remover</button></div>`;
    });
    out += `</div>`;
  }

  // Aviso de conflito (jiu/corrida planejado em dia de pernas)
  // v29: passa r.win.d (letra EFETIVA após anti-repetição) — não schedule bruto.
  const conflito = conflitoPlan(p, dataRef, r.win.d);
  if(conflito && !treinoDoDia){
    out += `<div class="hero" style="border:1px solid rgba(255,196,0,.35);background:linear-gradient(135deg,rgba(255,196,0,.08),rgba(255,120,0,.04))">
      <div class="why" style="padding:2px 0 8px">⚠️ ${conflito.msg} Recomendamos trocar pro <b>${conflito.sugere}</b> (upper leve).</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="chip on" data-plansugmusc="${conflito.sugere}">Trocar pra ${conflito.sugere}</button>
        <button class="chip" data-plansugmusc="${conflito.letraAtual}" data-planforce="1">Manter ${conflito.letraAtual}</button>
      </div>
    </div>`;
  }

  out += `<button class="coach-btn" data-coach="1">${ICON.spark} <span>Pergunte ao <span class="cbr">coach</span></span></button>`;

  // Ações grandes
  const skipAtivo = temSkip(p,0);
  const extrasHoje = extrasDoDia(p, REF()).filter(e=>e.atividade && String(e.atividade).toLowerCase()!==mainSport(p));
  const extraPrinc = temExtra(p,0);

  out += `<div class="acts2">
    <button class="act2 ${skipAtivo?"on":""}" data-skip="1">
      ${ICON.moon}<span>${skipAtivo?"Descansei":"Não treinei"}</span>
    </button>
    <button class="act2 ${extraPrinc?"on":""}" data-atv="1">
      ${ICON.run}<span>${extrasHoje.length?"Atividade (+"+extrasHoje.length+")":(extraPrinc?"✓ "+m.extra:"Atividade extra")}</span>
    </button>
  </div>`;

  if(extrasHoje.length){
    out += `<div class="extras-list">`;
    extrasHoje.forEach(e=>{
      const emo = emojiAtiv(e.atividade);
      const dur = e.duracao?` · ${e.duracao} min`:"";
      const nota = e.nota?` — ${esc(e.nota)}`:"";
      out += `<div class="row"><span>${emo} ${esc(e.atividade)}${dur}${nota}</span><button class="rm" data-rmatv="${e.id}">remover</button></div>`;
    });
    out += `</div>`;
  }

  return out;
}

/* ------------------------------------------------------------------ REGISTRAR */
function viewTreino(p,m){
  const d = ui.dia, days = dayset(p), treino = days[d];
  const ant = ultimaSessao(p,d);
  const _dkey = p+":"+d;
  const _draftVazio = !S.draft[_dkey] || !Object.values(S.draft[_dkey]).some(a=>(a||[]).some(s=>s&&(s.kg||s.reps||s.sec)));
  // v33: a última sessão aparece só como referência (texto cinza dentro do campo).
  // Nada é copiado automaticamente: o que for salvo é só o que foi digitado.
  if(false){
    /* NÃO chamar salvaSoft() aqui — dispara push→pullAndMerge que
       pode re-renderizar o DOM enquanto o usuário está no input. */
  }
  const dr = S.draft[_dkey] || {};
  const dataTr = REF(), hojeIso = shift(0);
  const passado = dataTr < hojeIso, futuro = dataTr > hojeIso;
  const relTr = dataTr===hojeIso ? "hoje" : (ui.off===-1 ? "ontem" : (passado ? "há "+(-ui.off)+" dias" : "data futura"));
  let out = `<div class="datebar ${passado?"past":""} ${futuro?"fut":""}">
      <div class="db-l"><span class="db-k">${ui.editId!=null?"Editando o treino de":"Data do treino"}</span>
        <span class="db-v">${dataLonga(dataTr)}</span><span class="db-r">${relTr}</span></div>
      <label class="db-btn">Alterar<input type="date" data-trdate value="${dataTr}" max="${hojeIso}" aria-label="Alterar a data do treino"></label>
    </div>`;
  if(ui.editId!=null){
    out += `<div class="edit-note">Você está editando um treino já registrado. Ao salvar, ele é atualizado. <button data-canceledit="1">Cancelar edição</button></div>`;
  }
  out += `<div class="segs">`;
  ORDER.forEach(k=>{
    const u = evs(p,"musc").filter(e=>e.data<=REF()).find(e=>e.dia===k);
    const t = u ? (dias(u.data)===0?"neste dia":"há "+dias(u.data)+"d") : "nunca";
    out += `<button class="sg ${k===d?"on":""}" data-dia="${k}"><span class="l">${k}</span><span class="s">${t}</span></button>`;
  });
  out += `</div><div class="tbar">${ui.edit
      ? `<input class="ed-f" style="margin:0" data-f="titulo" value="${esc(treino.t)}">`
      : `<div class="t">${esc(treino.t)}</div>`}
    ${ui.edit ? `<button class="edt on" data-edit="1">Concluir</button>` : ""}
    </div>`;

  if(!ui.edit && Object.keys(ant).length){
    out += `<button class="reset" data-loadlast="1" style="margin-bottom:12px;color:var(--ac);border-color:rgba(58,216,121,.35);background:rgba(58,216,121,.06)">&#128260; usar valores da &uacute;ltima vez</button>`;
  }

  treino.ex.forEach((ex,idx)=>{
    if(ui.edit){
      out += `<div class="card ed">
        <input class="ed-f" data-ex="${ex.id}" data-f="n" value="${esc(ex.n)}" placeholder="nome do exercício">
        <input class="ed-f" data-ex="${ex.id}" data-f="ap" value="${esc(ex.ap)}" placeholder="aparelho, pegada ou observação">
        <div class="ed-row">
          <input class="ed-f" style="margin:0;flex:1" data-ex="${ex.id}" data-f="p" value="${esc(ex.p)}" placeholder="repetições">
          <div class="step"><button data-step="${ex.id}:-1">−</button><span class="v">${ex.s}</span><button data-step="${ex.id}:1">+</button></div>
        </div>
        <div class="ed-row tys">
          ${[["load","carga e reps"],["time","tempo"],["reps","só reps"]].map(([k,l])=>
            `<button class="ty ${ex.ty===k?"on":""}" data-ty="${ex.id}:${k}">${l}</button>`).join("")}
        </div>
        <div class="ed-row" style="margin-bottom:0">
          <button class="del" data-mv="${ex.id}:-1" style="width:44px">↑</button>
          <button class="del" data-mv="${ex.id}:1" style="width:44px">↓</button>
          <button class="del" data-del="${ex.id}">Remover exercício</button></div></div>`;
    }else{
      const sets = dr[ex.id]||[], a = ant[ex.id]||[], rs = resumo(ex,a);
      const _dnMeta = [ex.descanso?"descanso "+esc(ex.descanso):"", ex.notas?esc(ex.notas):""].filter(Boolean).join(" · ");
      out += `<div class="card"><div class="ex-h"><button class="ex-n ex-link" data-exhist="${ex.id}">${esc(ex.n)}<span class="ex-hi">histórico ›</span></button>
        <div class="ex-p">${ex.s} x ${esc(ex.p)}</div></div>
        ${_dnMeta?`<div style="font-size:11.5px;color:var(--muted);line-height:1.45;margin:2px 0 6px;font-family:var(--sans)">${_dnMeta}</div>`:""}
        <div class="ex-a ${rs?"has":""}">${rs?"última: "+rs:"primeira vez neste exercício"}</div>
        <input class="ap" data-ex="${ex.id}" data-f="ap" value="${esc(ex.ap)}" placeholder="aparelho, pegada ou observação">`;
      for(let i=0;i<ex.s;i++){
        const s = sets[i]||{}, av = a[i]||{};
        out += `<div class="set ${s.ok?"done":""}"><div class="i">${i+1}</div>`;
        if(ex.ty==="load"){
          out += campo(s.kg,av.kg||"kg","kg",ex.id,i,"kg");
          out += campo(s.reps,av.reps||"reps","rep",ex.id,i,"reps");
        }else if(ex.ty==="time"){
          out += campo(s.sec,av.sec||"segundos","s",ex.id,i,"sec");
        }else{
          out += campo(s.reps,av.reps||"repetições","rep",ex.id,i,"reps");
        }
        const oKey = ex.id+":"+i, temObs = !!(s.obs && String(s.obs).trim());
        out += `<button class="obs-tg ${temObs?"has":""}" data-obstg="${oKey}" aria-label="Observação da série ${i+1}">${temObs?"✎":"+"}</button><button class="set-ok ${s.ok?"on":""}" data-setok="${oKey}" aria-label="Concluir série ${i+1}">✓</button></div>`;
        if(temObs || ui.obsOpen[oKey]) out += `<div class="obs-row">${campoObs(s.obs,ex.id,i)}</div>`;
      }
      out += `</div>`;
    }
  });

  if(ui.edit){
    out += `<button class="addx" data-add="1">+ Adicionar exercício</button>
      <button class="reset" data-reset="1">Restaurar o treino ${d} original</button>
      <div style="height:70px"></div>`;
  }else{
    out += `<div style="font-size:12px;color:var(--faint);line-height:1.55;padding:2px 4px 0">
      Números em cinza são da última vez. Toque em ✓ para concluir a série: se o campo estiver vazio, repete a última carga, e o descanso começa a contar. Toque no nome do exercício para ver o histórico.</div>`;
    const cheio = temValores(dr);
    const totalSeries = treino.ex.reduce((a,e)=>a+e.s,0);
    const feitas = treino.ex.reduce((a,e)=>a+((dr[e.id]||[]).slice(0,e.s).filter(x=>x&&(x.kg||x.reps||x.sec)).length),0);
    out += `<div style="height:40px"></div><div class="save-wrap"><button class="save ${ui.saved?"done":cheio?"on":""}" id="salvar" ${ui.saving?"disabled":""}>
      ${ui.saved?"✓ Treino salvo":`<span class="sv-1">${ui.editId!=null?"Atualizar":"Salvar"} treino ${d} · ${brd(dataTr)}</span><span class="sv-2">${feitas}/${totalSeries} séries preenchidas${passado?" · data passada":""}</span>`}</button></div>`;
  }
  return out;
}

function sessaoCard(s,days,acoes){
  const t = days[s.dia]; if(!t) return "";
  return `<div class="card"><div class="h-h"><span class="h-d">${s.dia} · ${esc(t.t)}</span>
    <span style="font-family:var(--mono);font-size:12px;color:var(--faint)">${brd(s.data)}</span></div>` +
    t.ex.map(ex=>{ const r = resumo(ex,(s.entries||{})[ex.id]);
      return r?`<div class="hist"><span class="n">${esc(ex.n)}</span><span class="v">${r}</span></div>`:""; }).join("") + (acoes||"") + `</div>`;
}

/* ------------------------------------------------------------------ CAL */
function viewCal(p,m){
  const days = dayset(p);
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+ui.mes);
  const ano = base.getFullYear(), mes = base.getMonth();
  const prim = new Date(ano,mes,1), nd = new Date(ano,mes+1,0).getDate();
  const inicio = (prim.getDay()+6)%7;
  const sel = REF(), hj = shift(0);

  let out = `<div class="cal"><div class="cal-h">
      <button class="arw" data-mes="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="m">${MES[mes]} de ${ano}</div>
      <button class="arw" data-mes="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
    </div><div class="grid">
    ${["seg","ter","qua","qui","sex","sáb","dom"].map(x=>`<div class="gh">${x}</div>`).join("")}`;

  for(let i=0;i<inicio;i++) out += `<div class="cell out"></div>`;
  let nT=0, nX=0, nS=0;
  for(let d=1;d<=nd;d++){
    const dt = `${ano}-${String(mes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const mmAll = S.events.filter(e=>e.perfil===p&&e.tipo==="musc"&&e.data===dt), mm = mmAll[0];
    const xx = S.events.find(e=>e.perfil===p&&e.tipo==="extra"&&e.data===dt);
    const sk = skipDoDia(p,dt);
    if(mm) nT++; if(xx) nX++; if(sk) nS++;
    const skipCls = (!mm && !xx && sk) ? " skipd" : "";
    out += `<button class="cell${skipCls} ${dt===sel?"sel":""} ${dt===hj?"hoje":""}" data-dt="${dt}">
      <span class="n">${d}</span>
      ${mm?`<span class="l">${mm.dia}${mmAll.length>1?`<sup class="mult">${mmAll.length}</sup>`:""}</span>`
         :(sk&&!xx?`<span class="l skip" style="font-size:11px">—</span>`
                  :`<span class="l" style="color:transparent">·</span>`)}
      ${xx?`<span class="dot"></span>`:`<span class="dot" style="background:transparent"></span>`}</button>`;
  }
  out += `</div></div>`;

  out += `<div class="sum">
    <div><div class="v">${nT}</div><div class="k">musculação</div></div>
    <div><div class="v">${nX}</div><div class="k">extras</div></div>
    <div><div class="v">${nS}</div><div class="k">descansos</div></div></div>`;

  const ss = S.events.filter(e=>e.perfil===p&&e.tipo==="musc"&&e.data===sel);
  const s = ss[0];
  const xs = extrasDoDia(p,sel);
  const sk = skipDoDia(p,sel);
  const dref = new Date(sel+"T12:00");
  out += `<div class="eyebrow" style="margin-bottom:9px">${WDL[dref.getDay()]}, ${dref.getDate()} de ${MES[dref.getMonth()]}</div>`;
  if(sk) out += `<div class="card cal-row" style="padding:13px 15px;font-size:13px;color:var(--muted);background:var(--surface-2);border-color:var(--hair-2)"><span>😴 Marcado como descanso${sk.motivo?` — ${esc(sk.motivo)}`:""}</span><button class="mini" data-skip="1">desfazer</button></div>`;
  xs.forEach(e=>{
    const nome = e.atividade ? esc(e.atividade) : m.extra;
    const emo = e.atividade ? emojiAtiv(e.atividade) : "·";
    const dur = e.duracao?` · ${e.duracao} min`:"";
    const nota = e.nota?`<div style="font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5">${esc(e.nota)}</div>`:"";

  });

/* ===================== v34 · semana, descanso, histórico, resumo ===================== */
const num = v => { const n = parseFloat(String(v==null?"":v).replace(",", ".")); return isFinite(n) ? n : 0; };
const e1rm = (kg, reps) => { kg = num(kg); reps = num(reps); return (kg>0 && reps>0) ? kg*(1+reps/30) : 0; };
function metaSemanal(p){
  const sch = getSchedule(p); if(!sch) return 4;
  return Object.values(sch).filter(x=>x && x.musc).length || 4;
}
function inicioSemana(isoData){ const d = new Date(isoData+"T12:00"); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return iso(d); }
function somaDias(isoData, n){ const d = new Date(isoData+"T12:00"); d.setDate(d.getDate()+n); return iso(d); }
function treinosNaSemana(p, ini){
  const fim = somaDias(ini, 6);
  return new Set(S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.data>=ini && e.data<=fim).map(e=>e.data)).size;
}
function semanaCard(p){
  const ref = REF(), ini = inicioSemana(ref), hojeIso = shift(0), meta = metaSemanal(p);
  const feitos = treinosNaSemana(p, ini);
  let seq = 0; for(let k=1;k<=52;k++){ if(treinosNaSemana(p, somaDias(ini, -7*k)) >= meta) seq++; else break; }
  if(feitos >= meta) seq++;
  const dias = ["S","T","Q","Q","S","S","D"].map((l,i)=>{
    const dt = somaDias(ini, i);
    const m = S.events.some(e=>e.perfil===p && e.tipo==="musc" && e.data===dt);
    const x = S.events.some(e=>e.perfil===p && e.tipo==="extra" && e.data===dt);
    return `<button class="wk-d ${m?"m":""} ${x?"x":""} ${dt===ref?"sel":""} ${dt===hojeIso?"hj":""}" data-dt="${dt}" aria-label="${dataLonga(dt)}"><span>${l}</span><i></i></button>`;
  }).join("");
  const pctv = Math.min(1, feitos/meta), C = 2*Math.PI*21;
  return `<div class="wk">
    <div class="wk-ring"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" class="bg"/><circle cx="25" cy="25" r="21" class="fg" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pctv)}"/></svg><b>${feitos}<small>/${meta}</small></b></div>
    <div class="wk-r"><div class="wk-t">${feitos>=meta?"Meta da semana batida":"Treinos nesta semana"}</div>
      <div class="wk-s">${seq>0?`🔥 ${seq} ${seq===1?"semana":"semanas"} seguidas na meta`:(meta-feitos===1?"Falta 1 treino para a meta":`Faltam ${Math.max(0,meta-feitos)} treinos para a meta`)}</div>
      <div class="wk-days">${dias}</div></div>
  </div>`;
}
/* ---- cronômetro de descanso (fica fora do render) ---- */
const REST = { fim:0, total:0, t:null };
function segDescanso(ex){
  const t = String((ex && ex.descanso) || "");
  const n = parseFloat(t.replace(",", ".")); if(!isFinite(n) || n<=0) return 90;
  return /min/i.test(t) ? Math.round(n*60) : Math.round(n);
}
function iniciarDescanso(seg){
  REST.total = seg; REST.fim = Date.now() + seg*1000;
  clearInterval(REST.t); REST.t = setInterval(tickDescanso, 250); tickDescanso();
}
function pararDescanso(){ clearInterval(REST.t); REST.t=null; const el=document.getElementById("restBar"); if(el) el.remove(); }
function tickDescanso(){
  let el = document.getElementById("restBar");
  if(!el){
    el = document.createElement("div"); el.id = "restBar"; el.className = "rest-bar";
    el.innerHTML = `<div class="rb-p"><i></i></div><button data-rb="-15">−15</button><div class="rb-t"><small>Descanso</small><b></b></div><button data-rb="15">+15</button><button data-rb="0" class="rb-x">Pular</button>`;
    document.body.appendChild(el);
    el.querySelectorAll("[data-rb]").forEach(b=>b.onclick=()=>{
      const v = Number(b.dataset.rb); if(v===0){ pararDescanso(); return; }
      REST.fim = Math.max(Date.now(), REST.fim + v*1000); REST.total = Math.max(REST.total + v, 1); tickDescanso();
    });
  }
  const rest = Math.max(0, Math.round((REST.fim - Date.now())/1000));
  el.querySelector("b").textContent = `${Math.floor(rest/60)}:${String(rest%60).padStart(2,"0")}`;
  el.querySelector(".rb-p i").style.width = (REST.total ? (1 - rest/REST.total)*100 : 100) + "%";
  if(rest<=0){
    clearInterval(REST.t); REST.t=null;
    try{ navigator.vibrate && navigator.vibrate([220,120,220]); }catch(e){}
    el.classList.add("fim"); el.querySelector("small").textContent = "Descanso concluído";
    setTimeout(()=>{ if(!REST.t) pararDescanso(); }, 2500);
  }
}
function concluirSerie(exId, i){
  const p = ui.perfil, d = ui.dia, key = p+":"+d;
  const ex = dayset(p)[d].ex.find(e=>e.id===exId); if(!ex) return;
  S.draft[key] = S.draft[key] || {}; S.draft[key][exId] = S.draft[key][exId] || [];
  const cur = Object.assign({}, S.draft[key][exId][i]);
  if(cur.ok){ delete cur.ok; S.draft[key][exId][i] = cur; salvaSoft(); render(); return; }
  const vazio = !(cur.kg || cur.reps || cur.sec);
  if(vazio){
    const ant = (ultimaSessao(p,d)[exId]||[])[i] || {};
    ["kg","reps","sec"].forEach(k=>{ if(ant[k]) cur[k] = ant[k]; });
    if(!(cur.kg || cur.reps || cur.sec)){ toast("Preencha a série antes de concluir."); return; }
  }
  cur.ok = true; S.draft[key][exId][i] = cur;
  try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
  salvaSoft(); render();
  iniciarDescanso(segDescanso(ex));
}
/* ---- histórico de um exercício ---- */
function abrirHistoricoEx(exId){
  const p = ui.perfil, ex = Object.values(dayset(p)).flatMap(x=>x.ex||[]).find(e=>e.id===exId); if(!ex) return;
  const lista = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.entries && e.entries[exId])
    .map(e=>{ const sets=(e.entries[exId]||[]).filter(x=>x&&(x.kg||x.reps||x.sec));
      const best = Math.max(0,...sets.map(x=>e1rm(x.kg,x.reps))); const top = Math.max(0,...sets.map(x=>num(x.kg)));
      return {data:e.data, sets, best, top}; })
    .filter(x=>x.sets.length).sort((a,b)=> a.data<b.data?1:-1);
  let corpo = "";
  if(!lista.length) corpo = `<div class="sug-load" style="padding:28px 10px">Ainda sem registros deste exercício.</div>`;
  else{
    const pts = lista.slice(0,12).reverse(), vals = pts.map(x=>ex.ty==="load"?x.best:num(x.sets[0].sec||x.sets[0].reps));
    const mx = Math.max(...vals,1), mn = Math.min(...vals), W=300, H=70;
    const xy = vals.map((v,i)=>[pts.length>1? i*(W/(pts.length-1)) : W/2, H-6-((v-mn)/((mx-mn)||1))*(H-16)]);
    const pr = Math.max(...lista.map(x=>x.best));
    corpo += `<div class="hx-kpis"><div><b>${pr?Math.round(pr):"—"}</b><span>1RM estimado (kg)</span></div><div><b>${Math.max(...lista.map(x=>x.top))||"—"}</b><span>maior carga (kg)</span></div><div><b>${lista.length}</b><span>sessões</span></div></div>`;
    if(pts.length>1) corpo += `<svg class="hx-ch" viewBox="-6 0 312 ${H}" preserveAspectRatio="none"><polyline points="${xy.map(a=>a.join(",")).join(" ")}" /><g>${xy.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3"/>`).join("")}</g></svg><div class="hx-leg">evolução do 1RM estimado nas últimas ${pts.length} sessões</div>`;
    corpo += lista.slice(0,15).map(x=>`<div class="hx-row"><span class="dt">${brd(x.data)}</span><span class="v">${resumo(ex,x.sets)||""}</span>${x.best && x.best===pr?`<span class="pr">PR</span>`:""}</div>`).join("");
  }
  _renderSugestaoShell(ex.n, "Histórico do exercício", corpo);
}
/* ---- resumo do treino (após salvar) ---- */
function resumoTreino(p, d, entries, data, evId){
  const days = dayset(p), treino = days[d]; let vol=0, series=0; const prs=[];
  treino.ex.forEach(ex=>{
    const sets = (entries[ex.id]||[]).filter(x=>x&&(x.kg||x.reps||x.sec));
    series += sets.length;
    sets.forEach(x=>{ vol += num(x.kg)*num(x.reps); });
    if(ex.ty==="load"){
      const best = Math.max(0,...sets.map(x=>e1rm(x.kg,x.reps)));
      const antes = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.data<data && String(e.id)!==String(evId) && e.entries && e.entries[ex.id])
        .flatMap(e=>e.entries[ex.id]||[]).map(x=>x?e1rm(x.kg,x.reps):0);
      const prevBest = Math.max(0,...antes);
      if(best>0 && prevBest>0 && best>prevBest+0.01){
        const bs = sets.reduce((a,x)=> e1rm(x.kg,x.reps)>e1rm(a.kg,a.reps)?x:a, sets[0]);
        prs.push({n:ex.n, txt:`${bs.kg} kg × ${bs.reps}`, ganho: Math.round((best/prevBest-1)*100)});
      }
    }
  });
  const ult = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.dia===d && e.data<data && String(e.id)!==String(evId))
    .sort((a,b)=>a.data<b.data?1:-1)[0];
  let volAnt = 0, serAnt = 0;
  if(ult) treino.ex.forEach(ex=>(ult.entries[ex.id]||[]).forEach(x=>{ if(x && (x.kg||x.reps||x.sec)){ serAnt++; volAnt += num(x.kg)*num(x.reps); } }));
  const comparavel = volAnt>0 && series >= serAnt*0.7;
  return { vol:Math.round(vol), series, prs, delta: comparavel ? Math.round((vol/volAnt-1)*100) : null, parcial: volAnt>0 && !comparavel, dataAnt: ult ? ult.data : null };
}
function mostrarResumo(d, data, r){
  const fmt = n => n.toLocaleString("pt-BR");
  const corpo = `<div class="rs-kpis">
      <div><b>${fmt(r.vol)}</b><span>kg de volume</span></div>
      <div><b>${r.series}</b><span>séries</span></div>
      <div><b class="${r.delta==null?"":(r.delta>=0?"up":"down")}">${r.delta==null?"—":(r.delta>0?"+":"")+r.delta+"%"}</b><span>${r.parcial?"treino parcial":(r.dataAnt?"volume vs "+brd(r.dataAnt):"primeira vez")}</span></div>
    </div>
    ${r.prs.length?`<div class="rs-pr-t">🏆 ${r.prs.length===1?"Novo recorde":"Novos recordes"}</div>${r.prs.map(x=>`<div class="rs-pr"><span>${esc(x.n)}</span><b>${esc(x.txt)}</b><em>+${x.ganho}%</em></div>`).join("")}`:`<div class="rs-nopr">Sem recorde novo hoje. Consistência é o que faz o próximo vir.</div>`}
    <button class="sug-save" data-sugclose="1" style="margin-top:14px">Fechar</button>`;
  _renderSugestaoShell(`Treino ${d} salvo 💪`, dataLonga(data), corpo);
  const m = document.getElementById("sugModal"); if(m) m.querySelectorAll('[data-sugclose]').forEach(el=>el.onclick=fecharSugestao);
}

async function salvar(){
  if(ui.saving) return;
  const p = ui.perfil, d = ui.dia, key = p+":"+d, dr = S.draft[key]||{};
  if(!temValores(dr)){ toast("Preencha pelo menos uma série antes de salvar."); return; }
  // O treino é gravado na data mostrada no topo da tela (a que o usuário escolheu).
  const data = REF(), hoje = shift(0);
  if(data > hoje && !confirm(`${dataLonga(data)} é uma data futura.\n\nRegistrar o treino nesse dia mesmo assim?`)) return;
  const outro = S.events.find(e=>e.perfil===p && e.tipo==="musc" && e.data===data && String(e.id)!==String(ui.editId));
  if(outro && !confirm(`Já existe o treino ${outro.dia} registrado em ${brd(data)}.\n\nOK substitui pelo treino ${d}. Cancelar volta sem salvar.`)) return;
  ui.saving = true;
  if(outro) S.events.splice(S.events.indexOf(outro), 1);
  const entries = clone(dr);
  Object.values(entries).forEach(arr=>(arr||[]).forEach(x=>{ if(x) delete x.ok; }));
  const ed = ui.editId!=null ? S.events.find(e=>String(e.id)===String(ui.editId)) : null;
  if(ed){ ed.data = data; ed.dia = d; ed.entries = entries; }
  else S.events.unshift({id:Date.now(),perfil:p,tipo:"musc",data,dia:d,entries});
  ui.editId = null;
  S.draft[key] = {};
  ui.obsOpen = {};
  const evSalvo = ed || S.events[0];
  const rs = resumoTreino(p, d, entries, data, evSalvo && evSalvo.id);
  pararDescanso();
  const ok = await store.set(S);
  ui.saved = true; ui.toast = ok?null:"Não deu para salvar. Anote as cargas e tente de novo.";
  try{ navigator.vibrate && navigator.vibrate([30,60,30]); }catch(e){}
  render();
  setTimeout(()=>{
    ui.saved=false; ui.saving=false; ui.view="hoje"; ui.dia = avaliar(ui.perfil).win.d;
    window.scrollTo(0,0); render();
    if(ok) mostrarResumo(d, data, rs);
  },700);
}

function fecharSugestao(){

function _escSug(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _renderSugestaoShell(titulo, subtitulo, corpoHTML){

async function abrirSugestao(refId){
  const p = ui.perfil, D = S.dieta[p], r = D.refs.find(x=>x.id===refId);
  if(!r) return;
  const perfilNome = p==='gabriel'?'Gabriel':'Eduarda';
  _renderSugestaoShell(r.nome||'Sugestões', 'Alternativas para essa refeição', `<div class="sug-load">Buscando 3 sugestões com IA...</div>`);
  try{
    const resp = await fetch(SUGESTAO_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ perfil: perfilNome, refeicao: r.nome||'', itens_atuais: r.itens||'' })
    });
    const j = await resp.json();
    if(!resp.ok || !j.sugestoes){
      document.getElementById('sugCorpo').innerHTML = `<div class="sug-err">Não consegui buscar sugestões agora. ${_escSug(j.error||'')}</div>`;
      return;
    }
    const html = j.sugestoes.map((s,i)=>`<div class="sug-card">
      <div class="n">&#127869;&#65039; ${_escSug(s.nome)}</div>
      <div class="i">${_escSug(s.itens)}</div>
      <button class="u" data-usar="${i}">Usar essa</button>
    </div>`).join('');
    document.getElementById('sugCorpo').innerHTML = html;
    document.querySelectorAll('#sugCorpo [data-usar]').forEach(b=>b.onclick=async ()=>{
      const idx = Number(b.dataset.usar);
      const s = j.sugestoes[idx];
      if(!s) return;
      const rNow = S.dieta[p].refs.find(x=>x.id===refId);
      if(!rNow) return;
      if(!confirm(`Substituir os itens de "${rNow.nome}" pela sugestão "${s.nome}"?`)) return;
      rNow.itens = s.itens;
      if(s.nome && !rNow.nome) rNow.nome = s.nome;
      await store.set(S);
      fecharSugestao();
      render();
    });
  }catch(e){
    const c = document.getElementById('sugCorpo');
    if(c) c.innerHTML = `<div class="sug-err">Erro de rede: ${_escSug(String(e&&e.message||e))}</div>`;
  }
}

const COACH_URL = 'https://ojqyjbzlkmsayxmigsay.supabase.co/functions/v1/treino-coach';

function _resumoSeries(ex, sets){
  if(!Array.isArray(sets) || !sets.length) return '';
  return sets.map(s=>{
    if(!s) return null;
    if(ex && ex.ty==='time') return s.sec ? s.sec+'s' : null;
    if(ex && ex.ty==='reps') return s.reps || null;
    if(!s.kg && !s.reps) return null;
    return (s.kg||'?')+'x'+(s.reps||'?');
  }).filter(Boolean).join(' ');
}

function _historicoParaCoach(p, n){
  n = n || 20;
  const evts = S.events.filter(e=>e.perfil===p).sort((a,b)=> a.data<b.data?1:-1).slice(0,n);
  const plan = dayset(p);
  return evts.map(e=>{
    const base = { data: e.data, tipo: e.tipo };
    if(e.tipo==='musc'){
      const dia = plan[e.dia];
      const exArr = [];
      if(dia && dia.ex){
        dia.ex.forEach(ex=>{
          const sets = (e.entries||{})[ex.id];
          const s = _resumoSeries(ex, sets);
          if(s) exArr.push({ nome: ex.n, series: s });
        });
      }
      return Object.assign(base, { dia: e.dia, titulo: dia ? dia.t : '', exercicios: exArr });
    }
    if(e.tipo==='extra'){
      return Object.assign(base, { atividade: e.atividade||'', duracao: e.duracao||null, nota: e.nota||'' });
    }
    if(e.tipo==='skip'){
      return Object.assign(base, { motivo: e.motivo||'' });
    }
    return base;
  });
}

let _coachUltimo = null;

async function abrirCoach(){
  const p = ui.perfil, m = meta(p);
  const r = avaliar(p);
  const days = dayset(p);
  const d = days[r.win.d];
  const perfilNome = p==='gabriel' ? 'Gabriel' : 'Eduarda';
  const D = S.dieta[p] || {};
  const check = (S.check && S.check[p+':'+REF()]) || {};

  const limiteLog = shift(-14);
  const dieta_log = (D.log||[])
    .filter(l=>l.data>=limiteLog)
    .slice()
    .sort((a,b)=> (a.data<b.data)?1:(a.data>b.data)?-1:(a.hora<b.hora?1:-1))
    .slice(0,30)
    .map(l=>({ data:l.data, hora:l.hora, refeicao:l.refNome, texto:l.texto }));

  const payload = {
    perfil: p,
    hoje: REF(),
    plano_dia_sugerido: {
      id: r.win.d,
      nome: d.t,
      ex: d.ex.map(x=>({ n:x.n, p:x.p, s:x.s, ty:x.ty }))
    },
    historico_recente: _historicoParaCoach(p, 20),
    dieta_atual: {
      alvo: D.alvo || {},
      refs: (D.refs||[]).map(r=>({ nome:r.nome, itens:r.itens })),
      extras: (D.extras||[]).map(x=>({ nome:x.nome })),
      nota: D.nota || ''
    },
    dieta_log,
    checks: check,
    schedule: getSchedule(p) || null,
    dias_tipo: getDietaDias(p) || null,
    alvos_dia: getAlvosDia(p) || null,
    planejado_hoje: getPlanejado(p, REF()) || {},
    planejado_amanha: getPlanejado(p, shift(1)) || {},
    planejado_semana: (function(){
      const out = {};
      for(let i=0;i<7;i++){
        const iso = shift(i);
        const pl = getPlanejado(p, iso);
        if(pl && Object.keys(pl).length){
          const d = new Date(iso+"T12:00");
          out[WDK[d.getDay()]+"_"+iso] = pl;
        }
      }
      return out;
    })()
  };

  _renderSugestaoShell(
    'Análise do coach',
    `${perfilNome} · ${brd(REF())||'hoje'}`,
    `<div class="sug-load">🤖 O coach está analisando seu histórico, dieta e recuperação...<br><br><span style="font-size:11px;color:var(--faint)">isso leva uns 5–10 segundos</span></div>`
  );

  try{
    const resp = await fetch(COACH_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const j = await resp.json();
    if(!resp.ok){
      document.getElementById('sugCorpo').innerHTML = `<div class="sug-err">Não consegui buscar a análise agora. ${_escSug(j.error||resp.status)}</div>`;
      return;
    }
    _coachUltimo = j;
    _renderCoach(j);
  }catch(e){
    const c = document.getElementById('sugCorpo');
    if(c) c.innerHTML = `<div class="sug-err">Erro de rede: ${_escSug(String(e&&e.message||e))}</div>`;
  }
}

function _extraiLetraDia(reco){

  document.querySelectorAll("button[data-theme]").forEach(b=>b.onclick=()=>{

/* Delegação global de INPUT nas séries — registrada UMA vez.
   Corrige bug em que oninput deixava de disparar após re-renders (pull remoto,
   store.set etc). Como o listener vive no document, novos inputs criados por
   render() automaticamente são cobertos — sem race, sem re-registro. */
let _delegacaoInputLigada = false;
function ligarDelegacaoUmaVez(){
  if(_delegacaoInputLigada) return;
  _delegacaoInputLigada = true;
  // v25: delegação global de clique pros chips de Planejar hoje (garantia extra
  // além dos onclick registrados em ligar()). Cobre casos em que o re-render
  // ainda não rodou ou o listener direto foi perdido.
  document.addEventListener('click', function(e){
    const el = e.target && e.target.closest ? e.target.closest('[data-planq]') : null;
    if(el){
      e.preventDefault();
      const ativ = el.getAttribute('data-planq');
      try{ togglePlanejado(ui.perfil, REF(), ativ); }catch(err){ console.error('[deleg planq]', err); }
      return;
    }
    const el2 = e.target && e.target.closest ? e.target.closest('[data-plansugmusc]') : null;
    if(el2){
      e.preventDefault();
      const letra = el2.getAttribute('data-plansugmusc');
      try{ setPlanejadoMusc(ui.perfil, REF(), letra); }catch(err){ console.error('[deleg plansugmusc]', err); }
      return;
    }
  }, false);
  document.addEventListener('input', function(e){
    const el = e.target;
    if(!el || !el.matches) return;
    // kg / reps / obs de série
    if(el.matches('input[data-cex]')){
      const exId = el.dataset.cex, i = Number(el.dataset.ci), k = el.dataset.ck;
      const raw = el.value;
      const v = (k==="obs") ? raw : String(raw).replace(",",".");
      upd(ui.perfil, ui.dia, exId, i, k, v);
      return;
    }
    // título do treino / campos de exercício em modo edit
    if(el.matches('input[data-f]')){
      const f = el.dataset.f;
      if(f==="titulo"){ dayset(ui.perfil)[ui.dia].t = el.value; }
      else { const ex = acha(el.dataset.ex); if(ex) ex[f] = el.value; }
      salvaSoft();
      return;
    }
    // config de perfil (peso/kcal/prot etc)
    if(el.matches('[data-meta]')){
      if(!S.metas) S.metas={};
      if(!S.metas[ui.perfil]) S.metas[ui.perfil] = {};
      S.metas[ui.perfil][el.dataset.meta] = el.value;
      salvaSoft();
      return;
    }
  }, false); // bubble phase — safer on iOS

  // v31: se a tela do dia tem o slot PaceIA, hidrata (determinístico já cai imediato + IA async)
  try { if(ui.view==='hoje' && document.getElementById('pace-ia-card')) PaceIA.hydrate(); }
  catch(err){ console.warn('[PaceIA hydrate]', err); }
}

/* ================================================================ início */
(async function(){
  const AUTH = getAuth();
  if(!AUTH){ mostraLogin(); return; }
  ligarDelegacaoUmaVez();
  await syncEngine.bootstrap();
  if(!S.events) S.events = [];
  if(!S.draft) S.draft = {};
  if(!S.plan) S.plan = { gabriel: clone(BASE.gabriel.days), eduarda: clone(BASE.eduarda.days) };
  if(!S.dieta) S.dieta = clone(DIETA);
  if(!S.check) S.check = {};
  if(!S.metas) S.metas = {};
  Object.keys(S.check).forEach(k=>{
    if(Array.isArray(S.check[k])){
      const novo = {}; S.check[k].forEach(id=>novo[id]="ok"); S.check[k] = novo;
    }
  });
  ["gabriel","eduarda"].forEach(p=>{
    if(!S.dieta[p]) S.dieta[p] = clone(DIETA[p]);
    if(!Array.isArray(S.dieta[p].log)) S.dieta[p].log = [];
    if(Array.isArray(S.dieta[p].refs)) S.dieta[p].refs.forEach(r=>{ if(typeof r.hora !== 'string') r.hora = ''; });
  });
  ORDER.forEach(d=>{ ["gabriel","eduarda"].forEach(p=>{
    if(!S.plan[p][d]) S.plan[p][d] = clone(BASE[p].days[d]);
    S.plan[p][d].ex.forEach(e=>{ if(e.ap===undefined) e.ap=""; }); }); });
  // Seed schedule/dias/alvos_dia se faltarem (v22)
  if(S.plan.gabriel && !S.plan.gabriel.schedule) S.plan.gabriel.schedule = clone(SCHED_GABRIEL);
  if(S.plan.eduarda && !S.plan.eduarda.schedule) S.plan.eduarda.schedule = clone(SCHED_EDUARDA);
  if(S.dieta.gabriel){
    if(!S.dieta.gabriel.dias) S.dieta.gabriel.dias = clone(DIETA_DIAS_GABRIEL);
    if(!S.dieta.gabriel.alvos_dia) S.dieta.gabriel.alvos_dia = clone(DIETA_ALVOS_DIA_GABRIEL);
    // v27: garante presença dos novos tipos de dia jejum / jejum_jiu
    if(S.dieta.gabriel.alvos_dia){
      if(!S.dieta.gabriel.alvos_dia.jejum) S.dieta.gabriel.alvos_dia.jejum = clone(DIETA_ALVOS_DIA_GABRIEL.jejum);
      if(!S.dieta.gabriel.alvos_dia.jejum_jiu) S.dieta.gabriel.alvos_dia.jejum_jiu = clone(DIETA_ALVOS_DIA_GABRIEL.jejum_jiu);
    }
    // Migração: remove extras x1/x2 (água/creatina) — agora só r1 tem hidratação
    if(Array.isArray(S.dieta.gabriel.extras)){
      S.dieta.gabriel.extras = S.dieta.gabriel.extras.filter(x=>x && x.id!=='x1' && x.id!=='x2');
    }
  }
  if(S.dieta.eduarda){
    if(!S.dieta.eduarda.dias) S.dieta.eduarda.dias = clone(DIETA_DIAS_EDUARDA);
    if(!S.dieta.eduarda.alvos_dia) S.dieta.eduarda.alvos_dia = clone(DIETA_ALVOS_DIA_EDUARDA);
  }
  // v23: Sistema de atividades planejadas (jiu/corrida/futebol/bike + override musc por dia)
  if(!S.planejado) S.planejado = {gabriel:{},eduarda:{}};
  if(!S.planejado.gabriel) S.planejado.gabriel = {};
  if(!S.planejado.eduarda) S.planejado.eduarda = {};
  try{
    Object.keys(S.draft||{}).forEach(k=>{
      const [pp,dd] = k.split(":"); const ant = ultimaSessao(pp,dd);
      if(Object.keys(ant).length && JSON.stringify(S.draft[k])===JSON.stringify(ant)) S.draft[k] = {};
    });
  }catch(e){}
  ui.perfil = AUTH.perfil;
  ui.dia = avaliar(ui.perfil).win.d;
  render();
  syncEngine.start();
})();
</script>

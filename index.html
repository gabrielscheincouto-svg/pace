<body>
<div class="wrap" id="app"><div class="splash"><div class="sp-dot"></div>Carregando seus treinos…</div></div>
<div class="tabbar"><div class="in" id="tabs"></div></div>
<div class="sync-badge" id="syncBadge" style="opacity:0">&#9729; sincronizado</div>
<div id="sugModal"></div>

<script>
/* ============================================================ tema */
const THEME_KEY = "gt-theme";
function applyTheme(t){
  const v = (t==="light"||t==="auto"||t==="dark") ? t : "dark";
  document.documentElement.dataset.theme = v;
  const meta = document.getElementById("themeColor");
  if(meta){
    const isLight = v==="light" || (v==="auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
    meta.setAttribute("content", isLight ? "#F5F7FA" : "#0E1218");
  }
}
function getTheme(){ try{ return localStorage.getItem(THEME_KEY) || "dark"; }catch(e){ return "dark"; } }
function setTheme(t){ try{ localStorage.setItem(THEME_KEY, t); }catch(e){} applyTheme(t); }
applyTheme(getTheme());
if(window.matchMedia){
  try{ window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", ()=>{ if(getTheme()==="auto") applyTheme("auto"); }); }catch(e){}
}

/* ============================================================ armazenagem
   Cópia local do documento do grupo da conta (funciona sem internet).
   As chaves levam o grupo no nome: duas contas no mesmo aparelho não se misturam. */
const SUPA_URL = 'https://ojqyjbzlkmsayxmigsay.supabase.co';
const SUPA_KEY = 'sb_publishable_s0FBWPYPcIXO5ln95i5f6g_oPj7Bsar';
const IA_URL = SUPA_URL + '/functions/v1/pace-ia';
const GRUPO_LEGADO = 'gabi_eduarda';   // documento do app antes das contas: a cópia local antiga passa para as chaves novas
const CHAVES = { estado:"", versao:"", base:"" };
function definirChaves(grupo){
  CHAVES.estado = "pace-estado:"+grupo; CHAVES.versao = "pace-versao:"+grupo; CHAVES.base = "pace-base:"+grupo;
  try{
    if(grupo===GRUPO_LEGADO && localStorage.getItem(CHAVES.estado)===null && localStorage.getItem("gt-state-v2")!==null){
      [["gt-state-v2",CHAVES.estado],["gt-version-v2",CHAVES.versao],["gt-base-v1",CHAVES.base]].forEach(([de,para])=>{
        const v = localStorage.getItem(de); if(v!==null) localStorage.setItem(para, v);
      });
      ["gt-state-v2","gt-version-v2","gt-base-v1"].forEach(k=>localStorage.removeItem(k));
    }
  }catch(e){ console.warn("[chaves]", e); }
}
const store = {
  async get(){
    try{ const s = localStorage.getItem(CHAVES.estado); return s?JSON.parse(s):null; }catch(e){ return null; }
  },
  async set(v){
    const s = JSON.stringify(v);
    try{ localStorage.setItem(CHAVES.estado, s); syncEngine.schedulePush(); return true; }catch(e){ syncEngine.schedulePush(); return false; }
  }
};

/* ============================================================ merge (3 vias)
   Combina o que mudou neste aparelho (local) com o que outro aparelho enviou
   (remoto), usando a última versão sincronizada (base) como referência.
   - só um lado mudou: fica a mudança
   - os dois mudaram: combina campo a campo; listas com "id" (eventos, diário,
     exercícios) combinam item a item; exclusões são respeitadas
   - conflito no mesmo valor simples: prevalece o local                         */
const _eqJ = (a,b) => JSON.stringify(a)===JSON.stringify(b);
const _isObj = x => x!==null && typeof x==='object' && !Array.isArray(x);
const _isIdArr = x => Array.isArray(x) && x.every(e=>e && typeof e==='object' && e.id!=null);
function merge3(b,l,r){
  if(_eqJ(l,r)) return l;
  if(b!==undefined && _eqJ(l,b)) return r;
  if(b!==undefined && _eqJ(r,b)) return l;
  if(_isObj(l) && _isObj(r)){
    const bo = _isObj(b) ? b : {};
    const out = {};
    new Set([...Object.keys(l),...Object.keys(r),...Object.keys(bo)]).forEach(k=>{
      const inL = k in l, inR = k in r, inB = k in bo;
      if(inL && inR){ out[k] = merge3(inB?bo[k]:undefined, l[k], r[k]); return; }
      if(inL){ if(inB && _eqJ(l[k], bo[k])) return; out[k] = l[k]; return; }
      if(inR){ if(inB && _eqJ(r[k], bo[k])) return; out[k] = r[k]; return; }
    });
    return out;
  }
  if(_isIdArr(l) && _isIdArr(r) && (b==null || _isIdArr(b))){
    const idx = a => { const m = new Map(); (a||[]).forEach(e=>m.set(String(e.id), e)); return m; };
    const B = idx(b), L = idx(l), R = idx(r);
    const out = [];
    const ordem = [...L.keys(), ...[...R.keys()].filter(k=>!L.has(k))];
    ordem.forEach(id=>{
      const inL = L.has(id), inR = R.has(id), inB = B.has(id);
      if(inL && inR){ out.push(merge3(inB?B.get(id):undefined, L.get(id), R.get(id))); return; }
      if(inL){ if(inB && _eqJ(L.get(id), B.get(id))) return; out.push(L.get(id)); return; }
      if(inR){ if(inB && _eqJ(R.get(id), B.get(id))) return; out.push(R.get(id)); return; }
    });
    // eventos e diário (ids numéricos = data de criação): mais recente primeiro
    if(out.length && out.every(e=>/^\d+$/.test(String(e.id)))) out.sort((x,y)=>Number(y.id)-Number(x.id));
    return out;
  }
  return l;
}
if(typeof window!=='undefined') window.PaceMerge = { merge3 };

/* ============================================================ servidor
   Tudo passa por funções do banco que conferem a sessão (pace_*): o app não lê
   nem grava tabelas diretamente. */
let SB = null;
try { SB = window.supabase ? window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } }) : null; } catch(e) { console.warn('supabase init falhou', e); }
async function rpc(nome, args){
  if(!SB) throw new Error('Sem conexão com o servidor.');
  const { data, error } = await SB.rpc(nome, args || {});
  if(error){
    const msg = String((error && (error.message || error.details)) || error);
    const e = new Error(msg);
    e.sessao = /sessao_invalida/.test(msg);
    throw e;
  }
  return data;
}

/* ============================================================ syncEngine */
const syncEngine = (function(){
  const DEVICE_ID = (function(){
    let d = null;
    try{ d = localStorage.getItem('gt-device-id'); }catch(e){}
    if(!d){ d = 'dev-'+Math.random().toString(36).slice(2,10); try{localStorage.setItem('gt-device-id',d);}catch(e){} }
    return d;
  })();
  let localVersion = 0;
  let base = null;
  let pushTimer = null;
  let pushInflight = false;
  let pendingWhile = false;
  let statusEl = null;
  let applyingRemote = false;
  let parado = false;
  const cl = o => JSON.parse(JSON.stringify(o));
  const setBase = o => { base = cl(o); try{ localStorage.setItem(CHAVES.base, JSON.stringify(base)); }catch(e){} };
  function configurar(grupo){
    definirChaves(grupo);
    try{ localVersion = Number(localStorage.getItem(CHAVES.versao) || 0); }catch(e){ localVersion = 0; }
    try{ const b = localStorage.getItem(CHAVES.base); base = b ? JSON.parse(b) : null; }catch(e){ base = null; }
  }
  function falhaSessao(e){
    if(!(e && e.sessao) || parado) return false;
    parado = true;
    clearTimeout(pushTimer);
    if(typeof sessaoEncerrada === 'function') sessaoEncerrada();
    return true;
  }
  const setStatus = (kind, txt) => {
    if(!statusEl) statusEl = document.getElementById('syncBadge');
    if(!statusEl) return;
    statusEl.className = 'sync-badge ' + (kind||'');
    statusEl.textContent = txt;
    clearTimeout(statusEl._t);
    if(kind==='ok'){ statusEl._t = setTimeout(()=>{ statusEl.textContent=''; }, 800); }
  };
  const getVersion = () => localVersion;
  const setLocalVersion = v => { localVersion = v; try{localStorage.setItem(CHAVES.versao, String(v));}catch(e){} };
  const temAlteracaoLocal = () => base ? !_eqJ(S, base) : false;

  // aplica um estado no S sem trocar a referência (o resto do app usa S direto)
  function aplicar(obj){
    applyingRemote = true;
    try{
      Object.keys(S).forEach(k=>{ if(!(k in obj)) delete S[k]; });
      Object.assign(S, obj);
      if(!S.events) S.events = [];
      if(!S.draft) S.draft = {};
      if(!S.check) S.check = {};
      if(typeof prepararEstado === 'function') prepararEstado();
      try{ localStorage.setItem(CHAVES.estado, JSON.stringify(S)); }catch(e){}
      if(typeof safeRender === 'function') safeRender();
    } finally { applyingRemote = false; }
  }

  // documento do grupo da sessão: { data, version } (data = null se o grupo ainda não gravou nada)
  async function pullOnce(){
    const r = await rpc('pace_estado', { p_token: SESSAO.token });
    if(r && r.conta && typeof atualizarConta === 'function') atualizarConta(r.conta);
    return { data: (r && r.data && typeof r.data === 'object') ? r.data : null, version: Number((r && r.version) || 0) };
  }

  async function pushNow(){
    if(parado || !SESSAO) return;
    if(!SB){ setStatus('offline','offline'); return; }
    if(pushInflight){ pendingWhile = true; return; }
    if(!navigator.onLine){ setStatus('offline','offline'); return; }
    pushInflight = true;
    setStatus('saving','salvando…');
    try {
      for(let tentativa=0; tentativa<4; tentativa++){
        const remote = await pullOnce();
        const rv = remote.version;
        const remoteHas = remote.data && Object.keys(remote.data).length;
        // outro aparelho enviou antes: combina antes de enviar, para não apagar nada
        if(remoteHas && rv !== localVersion){
          aplicar(merge3(base || undefined, cl(S), remote.data));
          setBase(remote.data);
          setLocalVersion(rv);
        }
        const snap = cl(S);
        const r = await rpc('pace_gravar', { p_token: SESSAO.token, p_data: snap, p_versao: rv, p_dispositivo: DEVICE_ID });
        if(r && r.ok){
          setLocalVersion(Number(r.version));
          setBase(snap);
          setStatus('ok','sincronizado');
          return;
        }
        // versão mudou no meio do caminho: busca de novo e combina
      }
      setStatus('offline','tentando sincronizar…');
      pendingWhile = true;
    } catch(e){
      if(falhaSessao(e)) return;
      console.warn('push falhou', e);
      setStatus('offline','offline');
    } finally {
      pushInflight = false;
      if(pendingWhile && !parado){ pendingWhile = false; schedulePush(); }
    }
  }

  function schedulePush(){
    if(applyingRemote || parado) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 800);
  }

  async function pullAndMerge(){
    if(parado || !SESSAO || !SB || !navigator.onLine || pushInflight){ return; }
    try {
      const remote = await pullOnce();
      if(pushInflight || parado) return;
      const rv = remote.version;
      const remoteHas = remote.data && Object.keys(remote.data).length;
      if(rv > localVersion && remoteHas){
        if(temAlteracaoLocal()){
          aplicar(merge3(base, cl(S), remote.data));
          setBase(remote.data); setLocalVersion(rv);
          schedulePush();
        } else {
          aplicar(cl(remote.data));
          setBase(remote.data); setLocalVersion(rv);
        }
        setStatus('ok','sincronizado');
      } else if(temAlteracaoLocal()){
        schedulePush();
      } else {
        setStatus('ok','sincronizado');
      }
    } catch(e){
      if(falhaSessao(e)) return;
      console.warn('pull falhou', e);
      setStatus('offline','offline');
    }
  }

  async function bootstrap(){
    let remote = null;
    try { remote = await pullOnce(); }
    catch(e){ if(falhaSessao(e)) return; console.warn('pull inicial falhou', e); }
    const local = await store.get();
    const remoteHas = remote && remote.data && Object.keys(remote.data).length;
    const rv = remote ? remote.version : 0;
    let enviar = false;
    if(remoteHas){
      if(local && base && !_eqJ(local, base)){
        // alterações feitas sem conexão (ou não enviadas): combina com o remoto
        Object.assign(S, merge3(base, local, remote.data)); enviar = true;
      } else if(local && !base && rv < localVersion){
        Object.assign(S, local); enviar = true;
      } else {
        Object.assign(S, remote.data);
      }
      setBase(remote.data);
      setLocalVersion(rv);
      try{ localStorage.setItem(CHAVES.estado, JSON.stringify(S)); }catch(e){}
      setStatus('ok','sincronizado');
    } else if(local){
      Object.assign(S, local);
      if(local.events && local.events.length) enviar = true;
    }
    if(enviar) schedulePush();
    if(!navigator.onLine) setStatus('offline','offline');
  }

  let iniciado = false;
  function start(){
    if(iniciado) return; iniciado = true;
    setInterval(pullAndMerge, 15000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pullAndMerge(); });
    window.addEventListener('online', ()=>{ if(parado) return; setStatus('saving','reconectando…'); pullAndMerge().then(()=>schedulePush()); });
    window.addEventListener('offline', ()=>setStatus('offline','offline'));
  }
  // há algo neste aparelho que ainda não chegou ao servidor?
  const pendente = () => base ? !_eqJ(S, base) : true;

  return { configurar, schedulePush, pushNow, pullAndMerge, bootstrap, start, getVersion, pendente, parado: ()=>parado };
})();

let salvaTimer = null;
const salvaSoft = () => { clearTimeout(salvaTimer); salvaTimer = setTimeout(()=>store.set(S), 400); };

/* ========================================================== perfis e plano
   Treinos, cronograma, dieta e preferências de cada pessoa ficam só no
   documento sincronizado do grupo dela (S). O código não guarda dados pessoais. */
const LETRAS_POSSIVEIS = ["A","B","C","D","E","F","G","H"];
const clone = o => JSON.parse(JSON.stringify(o));
/* letras do plano da pessoa, em ordem (A, B, C...) */
function letras(p){
  const d = (S.plan && S.plan[p]) || {};
  return LETRAS_POSSIVEIS.filter(L => d[L] && typeof d[L]==="object" && Array.isArray(d[L].ex));
}
const temPlano = p => letras(p).length > 0;
const WDK = ["dom","seg","ter","qua","qui","sex","sab"];
const TIPO_DIA_LABEL = {musc_jiu:"Musc + Jiu",musc:"Só Musc",jiu:"Só Jiu",musc_corrida:"Musc + Corrida",corrida:"Só Corrida",descanso:"Descanso",jejum:"Jejum",jejum_jiu:"Jejum + Jiu"};
const tipoDiaLabel = t => TIPO_DIA_LABEL[t] || String(t||"").split("_").map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(" + ");
const ATIV_LABEL = { jiu:"Jiu", corrida:"Corrida", futebol:"Futebol", bike:"Bike", natacao:"Natação", caminhada:"Caminhada", jejum:"Jejum" };
/* esporte principal fora da musculação: nome usado nos registros de atividade */
const ESPORTE_NOME = { jiu:"Jiu-jitsu", corrida:"Corrida", futebol:"Futebol", bike:"Bike", natacao:"Natação", caminhada:"Caminhada" };
const PERFIL_PADRAO = { label:"", extra:"", principal:"", agua:2.5, ativ:["corrida","bike","caminhada"], meta_semanal:null, jejum:null, coach:"" };
const META_SEMANAL_PADRAO = { peito:1, costas:2, perna_ant:1, perna_post:1, ombro:1, biceps:1, triceps:1, core:2, cardio:2, antebraco:0, panturrilha:0 };

function getSchedule(p){
  const s = S.plan && S.plan[p] && S.plan[p].schedule;
  return (s && typeof s==="object") ? s : null;
}
function getDietaDias(p){
  const d = S.dieta && S.dieta[p] && S.dieta[p].dias;
  return (d && typeof d==="object") ? d : null;
}
function getAlvosDia(p){
  const a = S.dieta && S.dieta[p] && S.dieta[p].alvos_dia;
  return (a && typeof a==="object") ? a : null;
}
/* ============ Planejado (atividades dinâmicas por data) ============
   S.planejado[perfil][YYYY-MM-DD] = {jiu:true, corrida:true, musc:"A", ...} */
function getPlanejado(p, dataISO){
  if(!S.planejado) S.planejado = {};
  if(!S.planejado[p]) S.planejado[p] = {};
  return S.planejado[p][dataISO] || null;
}
function setPlanejado(p, dataISO, obj){
  if(!S.planejado) S.planejado = {};
  if(!S.planejado[p]) S.planejado[p] = {};
  if(!obj || Object.keys(obj).length===0) delete S.planejado[p][dataISO];
  else S.planejado[p][dataISO] = obj;
}
/* v45: jiu só conta quando a pessoa MARCA no dia (planejado) ou REGISTRA o treino de jiu.
   O jiu do cronograma semanal é só a intenção da rotina: sem marcar, o dia vira um dia comum
   (dia "livre por causa do jiu" vira dia de treino; notas do tipo "leve pra jiu" não valem). */
function jiuMarcado(p, dataISO){
  const pl = S.planejado && S.planejado[p] && S.planejado[p][dataISO];
  if(pl && pl.jiu) return true;
  return (S.events||[]).some(e=>e.perfil===p && e.data===dataISO && e.tipo==="extra" && /jiu/i.test(String(e.atividade||"")));
}
async function togglePlanejado(p, dataISO, ativ){
  try{
    const atual = getPlanejado(p, dataISO) || {};
    const willActivate = !atual[ativ];
    // v46: jejum marcado tira a musculação da sugestão do dia (sem confirmação; dá para treinar mesmo assim)
    atual[ativ] = !atual[ativ];
    if(!atual[ativ]) delete atual[ativ];
    setPlanejado(p, dataISO, atual);
    // Render primeiro (feedback imediato), persiste depois
    render();
    try{ await store.set(S); }catch(e){ console.error("[togglePlanejado] persist error", e); }
  }catch(e){ console.error("[togglePlanejado] error", e); }
}
async function setPlanejadoMusc(p, dataISO, letra){
  try{
    const atual = getPlanejado(p, dataISO) || {};
    atual.musc = letra;
    setPlanejado(p, dataISO, atual);
    render();
    try{ await store.set(S); }catch(e){ console.error("[setPlanejadoMusc] persist error", e); }
  }catch(e){ console.error("[setPlanejadoMusc] error", e); }
}
// v25: expõe pra window pra permitir handlers globais/delegação
if(typeof window !== "undefined"){
  window.togglePlanejado = togglePlanejado;
  window.setPlanejadoMusc = setPlanejadoMusc;
}
/* Atividade planejada no dia (jiu, corrida, futebol) em dia de treino de membros inferiores:
   sugere trocar por um treino de superiores do plano. */
function conflitoPlan(p, dataISO, letraEfetiva){
  const plan = getPlanejado(p, dataISO); if(!plan) return null;
  const sch = getSchedule(p); if(!sch) return null;
  const d = new Date(dataISO+"T12:00");
  const dia = sch[WDK[d.getDay()]]; if(!dia) return null;
  // usa a letra EFETIVA (depois do anti-repetição do avaliar()) quando fornecida; senão, a do cronograma
  const letraSchedule = letraEfetiva || plan.musc || dia.musc;
  const days = dayset(p) || {};
  const isPernas = !!(letraSchedule && days[letraSchedule] && days[letraSchedule].cat==="inf");
  const temAtividade = plan.jiu || plan.corrida || plan.futebol || plan.bike;
  if(isPernas && temAtividade){
    const sup = letras(p).find(L => days[L].cat==="sup");
    if(!sup) return null;
    const ativ = plan.jiu?"jiu":(plan.corrida?"corrida":(plan.futebol?"futebol":"bike"));
    return {
      msg:`Você planejou ${ATIV_LABEL[ativ]||ativ} ${dataISO===shift(0)?"hoje":"neste dia"}. O treino sugerido (<b>${letraSchedule}</b>) é de pernas — pode sobrecarregar antes.`,
      sugere: sup, ativ, letraAtual: letraSchedule
    };
  }
  return null;
}
function schedHoje(p){
  const s = getSchedule(p); if(!s) return null;
  const iso = REF(); const d = new Date(iso+"T12:00");
  const orig = s[WDK[d.getDay()]];
  if(!orig) return null;
  const merged = Object.assign({}, orig);
  // v45: jiu do cronograma não conta sozinho; a nota escrita para o dia de jiu também não
  const marcado = jiuMarcado(p, iso);
  if(orig.jiu && !marcado) merged.nota = "";
  merged.jiu = marcado;
  const plan = getPlanejado(p, iso);
  if(plan){
    if(Object.prototype.hasOwnProperty.call(plan,'musc')) merged.musc = plan.musc;
    if(plan.corrida) merged.corrida = true;
    if(plan.futebol) merged.futebol = true;
    if(plan.bike) merged.bike = true;
  }
  return merged;
}
function tipoDiaHoje(p){
  const dd = getDietaDias(p); if(!dd) return null;
  const iso = REF(); const d = new Date(iso+"T12:00");
  let tipo = dd[WDK[d.getDay()]] || null;
  // v45: tipo de dieta pensado para o jiu só vale com jiu marcado no dia
  if(tipo && /jiu/.test(tipo) && !jiuMarcado(p, iso)){
    if(tipo==="musc_jiu") tipo = "musc";
    else if(tipo==="jiu"){
      const treinou = S.events.some(e=>e.perfil===p && e.tipo==="musc" && e.data===iso);
      const sug = treinou || !!(sugestaoTreino(p, iso)||{}).musc;
      tipo = sug ? "musc" : "descanso";
    }
  }
  const plan = getPlanejado(p, iso);
  if(plan){
    // jejum sobrepõe os outros tipos; com jiu no mesmo dia vira jejum_jiu quando há meta para isso
    if(plan.jejum){
      const alvos = getAlvosDia(p) || {};
      if(plan.jiu && alvos.jejum_jiu) return "jejum_jiu";
      return "jejum";
    }
    // atividade principal planejada: musc vira musc_<atividade>; descanso vira <atividade>
    const princ = meta(p).principal;
    if(princ && plan[princ]){
      if(tipo==="musc") tipo = "musc_"+princ;
      else if(tipo==="descanso") tipo = princ;
    }
  }
  return tipo;
}

/* ============================================================================
   sugestaoTreino(perfil, dataISO) — v30
   ---------------------------------------------------------------------------
   Função UNIVERSAL de sugestão de treino pra qualquer data (passado, hoje,
   amanhã, futuro). Substitui os fixes pontuais das v24/v28 (que só cobriam
   cenários específicos) por uma regra única aplicada em toda leitura.

   v45: jiu só conta quando MARCADO no dia (planejado) ou registrado. Dia que o
   cronograma deixa sem musculação por causa do jiu vira dia de treino se o jiu não
   for marcado; jiu marcado em dia de pernas troca por superiores.

   Regras (nesta ordem):
     1. Se o usuário JÁ TREINOU nesse dia → devolve o treino registrado com
        jaTreinou:true. Sem tentativa de "sugerir por cima".
     2. Calcula a LETRA BASE = override manual (S.planejado[perfil][data].musc)
        OU o schedule fixo do dia da semana.
     3. Sem letra base (dia de descanso) → schedRest:true, musc:null.
     4. ANTI-REPETIÇÃO UNIVERSAL: olha os eventos musc dos ÚLTIMOS 3 DIAS
        antes de dataISO. Se a letra base foi feita em algum deles, escolhe a
        alternativa do plano parada há mais tempo (excluindo todas que
        aparecem nesses 3 dias). Assim, quem fez B ontem e tem B no cronograma
        de hoje não recebe B de novo.
     5. Se o cronograma aponta para uma letra que não existe mais no plano
        (plano trocado), sugere a letra parada há mais tempo.

   Retorno estável:
     { musc, motivo, jaTreinou, override, letraOriginal,
       schedRest, schedJiu, schedNota }
============================================================================ */
/* v46: atividades que pesam nas pernas, marcadas em "Planejar hoje" ou registradas no dia */
const ATIV_PERNAS = ["jiu","corrida","futebol","bike"];
function atividadesMarcadas(p, dataISO){
  const pl = (S.planejado && S.planejado[p] && S.planejado[p][dataISO]) || {};
  const set = new Set(ATIV_PERNAS.filter(a=>pl[a]));
  if(jiuMarcado(p, dataISO)) set.add("jiu");
  (S.events||[]).forEach(e=>{
    if(e.perfil!==p || e.data!==dataISO || e.tipo!=="extra") return;
    const t = String(e.atividade||"").toLowerCase();
    if(/corr/.test(t)) set.add("corrida");
    else if(/fut/.test(t)) set.add("futebol");
    else if(/bike|bici|cicl|pedal/.test(t)) set.add("bike");
  });
  return ATIV_PERNAS.filter(a=>set.has(a));
}
function listaAtiv(arr){
  const l = arr.map(a=>ATIV_LABEL[a]||a);
  return l.length<=1 ? (l[0]||"") : l.slice(0,-1).join(", ")+" e "+l[l.length-1];
}
function sugestaoTreino(perfil, dataISO){
  const r = _sugestaoBase(perfil, dataISO);
  if(r.jaTreinou) return r;
  const plan = (S.planejado && S.planejado[perfil] && S.planejado[perfil][dataISO]) || null;
  const escolhidaNaMao = !!(plan && plan.musc);
  const quando = dataISO===shift(0) ? 'hoje' : 'neste dia';
  const ativs = atividadesMarcadas(perfil, dataISO);
  const extra = { ativs };
  // v46: jejum marcado → dia sem musculação (orientação, não bloqueio: dá para treinar mesmo assim)
  if(plan && plan.jejum && !escolhidaNaMao){
    return Object.assign({}, r, extra, {
      musc: null, schedRest: true, jejum: true, override: !!r.musc, letraOriginal: r.musc || null,
      schedNota: 'Jejum',
      motivo: `Você marcou jejum ${quando}: dia sem musculação${r.musc?` (o treino seria o <b>${r.musc}</b>)`:''}. Se quiser treinar mesmo assim, escolha o treino.`
    });
  }
  // v46: jiu, corrida, futebol ou bike marcados + treino de pernas → troca por superiores
  // (a não ser que a pessoa tenha escolhido a letra na mão para esse dia; aí só avisa — ver conflitoPlan)
  if(!r.musc || !ativs.length) return Object.assign({}, r, extra);
  const days = dayset(perfil);
  if(!days[r.musc] || days[r.musc].cat !== 'inf' || escolhidaNaMao) return Object.assign({}, r, extra);
  const ctx = _sugContexto(perfil, dataISO);
  const sups = ctx.ordem.filter(L=>days[L] && days[L].cat==='sup');
  if(!sups.length) return Object.assign({}, r, extra);
  const livres = sups.filter(L=>!ctx.recSet.has(L));
  const alt = ctx.rankParado(livres.length ? livres : sups)[0];
  return Object.assign({}, r, extra, {
    musc: alt.L, override: true, letraOriginal: r.musc,
    motivo: `Você marcou ${listaAtiv(ativs).toLowerCase()} ${quando}: em vez de pernas (<b>${r.musc}</b>), sugerindo <b>${alt.L}</b> (${ctx.fmtParado(alt)}). Mantenha RIR 2-3 nos compostos.`
  });
}

/* histórico recente e ranking "parado há mais tempo", usados pela sugestão */
function _sugContexto(perfil, dataISO){
  const d = new Date(dataISO+'T12:00:00');
  const recentes = [];
  for(let i=1; i<=3; i++){
    const dPrev = new Date(d); dPrev.setDate(dPrev.getDate()-i);
    const ev = S.events.find(e=>e.perfil===perfil && e.data===iso(dPrev) && e.tipo==='musc');
    if(ev && ev.dia) recentes.push({dia: ev.dia, distancia: i});
  }
  const recSet = new Set(recentes.map(x=>x.dia));
  const ordem = letras(perfil);
  const rankParado = lista => lista.map(L => {
    const ultEv = S.events
      .filter(e=>e.perfil===perfil && e.tipo==='musc' && e.dia===L && e.data<dataISO)
      .sort((a,b)=> a.data<b.data?1:-1)[0];
    const diasParado = ultEv ? Math.floor((d - new Date(ultEv.data+'T12:00:00'))/86400000) : 999;
    return {L, diasParado};
  }).sort((a,b)=> b.diasParado-a.diasParado || ordem.indexOf(a.L)-ordem.indexOf(b.L));
  const fmtParado = x => x.diasParado===999 ? 'nunca feito' : (x.diasParado===1 ? 'parado há 1 dia' : `parado há ${x.diasParado} dias`);
  return { d, recentes, recSet, ordem, rankParado, fmtParado };
}

function _sugestaoBase(perfil, dataISO){
  const days = dayset(perfil);

  // 1) Já treinou nesse dia?
  const evJa = S.events.find(e=>e.perfil===perfil && e.data===dataISO && e.tipo==='musc');
  if(evJa){
    return {
      musc: evJa.dia,
      motivo: `Você registrou o treino <b>${evJa.dia}</b> neste dia.`,
      jaTreinou: true, override: false, letraOriginal: null,
      schedRest: false, schedJiu: false, schedNota: ''
    };
  }

  // 2) Letra base = override manual OU schedule fixo do dia da semana
  const ctx = _sugContexto(perfil, dataISO);
  const { d, recentes, recSet, ordem, rankParado, fmtParado } = ctx;
  const sched = getSchedule(perfil);
  const diaSched = sched ? (sched[WDK[d.getDay()]] || null) : null;
  const plan = (S.planejado && S.planejado[perfil] && S.planejado[perfil][dataISO]) || null;
  const muscOverride = (plan && Object.prototype.hasOwnProperty.call(plan,'musc')) ? plan.musc : null;
  // v45: jiu só conta se marcado no dia (ou registrado); o do cronograma é só a intenção
  const diaDeJiu = !!(diaSched && diaSched.jiu);
  const jiu  = jiuMarcado(perfil, dataISO);
  const nota = (diaSched && diaSched.nota && (jiu || !diaDeJiu)) ? diaSched.nota : '';
  const letraBase = (muscOverride !== null ? muscOverride : (diaSched ? diaSched.musc : null));
  const diaSem = WDL[d.getDay()];

  // 3) Sem letra base
  if(!letraBase){
    // v45: o dia só estava sem musculação por causa do jiu, e o jiu não foi marcado → dia de treino
    if(diaDeJiu && !jiu && ordem.length){
      const ontem = recentes.find(x=>x.distancia===1);
      const catOntem = ontem && days[ontem.dia] ? days[ontem.dia].cat : null;
      let cands = ordem.filter(L=>days[L] && !recSet.has(L));
      if(!cands.length) cands = ordem.filter(L=>days[L]);
      // evita o mesmo tipo (superiores/inferiores) de ontem
      const outraCat = (catOntem && catOntem!=='full') ? cands.filter(L=>days[L].cat!==catOntem) : cands;
      const escolhida = rankParado(outraCat.length ? outraCat : cands)[0];
      if(escolhida){
        const quando = dataISO===shift(0) ? 'hoje' : 'neste dia';
        return {
          musc: escolhida.L,
          motivo: `No cronograma, ${diaSem} fica sem musculação por causa do jiu, mas você não marcou jiu ${quando}. Sugerindo <b>${escolhida.L}</b> (${fmtParado(escolhida)}).`,
          jaTreinou: false, override: true, letraOriginal: null,
          schedRest: false, schedJiu: false, schedNota: ''
        };
      }
    }
    return {
      musc: null,
      motivo: `Cronograma de ${diaSem}: <b>${nota||'sem musculação'}</b>${jiu?' · Jiu marcado':''}.`,
      jaTreinou: false, override: false, letraOriginal: null,
      schedRest: true, schedJiu: jiu, schedNota: nota
    };
  }

  // 4) A letra do cronograma não existe mais no plano: sugere a parada há mais tempo
  if(!days[letraBase] && ordem.length){
    const lista = ordem.filter(L => !recSet.has(L));
    const escolhida = rankParado(lista.length ? lista : ordem)[0];
    return {
      musc: escolhida.L,
      motivo: `O cronograma pede o treino <b>${letraBase}</b>, que não está no plano atual. Sugerindo <b>${escolhida.L}</b> (${fmtParado(escolhida)}).`,
      jaTreinou: false, override: true, letraOriginal: letraBase,
      schedRest: false, schedJiu: jiu, schedNota: nota
    };
  }

  // 5) Anti-repetição: a letra foi feita nos 3 dias anteriores → alternativa parada há mais tempo
  if(recSet.has(letraBase)){
    const alternativas = ordem.filter(L => !recSet.has(L) && days[L]);
    if(alternativas.length > 0){
      const escolhida = rankParado(alternativas)[0];
      const rec = recentes.find(x=>x.dia===letraBase);
      const qdo = rec.distancia===1 ? 'ontem' : rec.distancia===2 ? 'anteontem' : `há ${rec.distancia} dias`;
      return {
        musc: escolhida.L,
        motivo: `Você fez <b>${letraBase}</b> ${qdo}. O cronograma de ${diaSem} pediria <b>${letraBase}</b> de novo — sugerindo <b>${escolhida.L}</b> (${fmtParado(escolhida)}) pra não repetir.`,
        jaTreinou: false, override: true, letraOriginal: letraBase,
        schedRest: false, schedJiu: jiu, schedNota: nota
      };
    }
  }

  // 6) Letra base OK — sem repetição recente
  let motivo = muscOverride !== null
    ? `Você escolheu o treino <b>${letraBase}</b> para este dia${nota?` — ${nota}`:''}.`
    : `Cronograma de ${diaSem}: <b>${letraBase}</b>${nota?` — ${nota}`:''}.`;
  if(jiu) motivo += ' Jiu marcado — mantenha RIR 2-3 nos compostos.';
  return {
    musc: letraBase, motivo,
    jaTreinou: false, override: false, letraOriginal: null,
    schedRest: false, schedJiu: jiu, schedNota: nota
  };
}

function avaliar(p){
  const ref = REF();
  const musc = evs(p,"musc").filter(e=>e.data<=ref);
  const ultimo = musc[0];
  const days = dayset(p);
  const ordem = letras(p);
  const eH = temExtra(p,0), eO = temExtra(p,-1), eA = temExtra(p,1);

  // sem plano ainda (primeiro acesso): nada a sugerir
  if(!ordem.length){
    return { win:{ d:null, score:0, bloq:null, notas:[], desde:0, motivo:"" }, resto:[], descanso:true, semPlano:true };
  }

  /* ==== v30: Schedule fixo delega pra sugestaoTreino (anti-repetição universal) ==== */
  const sched = getSchedule(p);
  if(sched){
    const sug = sugestaoTreino(p, ref);
    if(!sug.musc){
      // Dia sem musc (recuperação/descanso)
      const fallbackD = ordem[0];
      const win = { d:fallbackD, score:0, bloq:"sem musc hoje", notas:[], desde:0,
                    motivo: sug.motivo, schedJiu: sug.schedJiu, schedNota: sug.schedNota, schedRest: true, jejum: !!sug.jejum, letraOriginal: sug.letraOriginal||null, ativs: sug.ativs||[] };
      const resto = ordem.filter(d=>d!==fallbackD).map(d=>({d,score:0,notas:[],desde:0}));
      return { win, resto, descanso:true, schedRest:true, schedJiu:sug.schedJiu };
    }
    const win = {
      d: sug.musc, score: 0,
      bloq: sug.jaTreinou ? "já treinou neste dia" : null,
      notas: sug.schedNota ? [sug.schedNota] : [],
      desde: 0,
      motivo: sug.motivo,
      schedJiu: sug.schedJiu, schedNota: sug.schedNota,
      antiRepeticao: sug.override, letraOriginal: sug.letraOriginal, ativs: sug.ativs||[]
    };
    const resto = ordem.filter(d=>d!==sug.musc).map(d=>({d,score:0,notas:[],desde:0}));
    return { win, resto, descanso:false, schedRest:false, schedJiu:sug.schedJiu };
  }

  /* Sem cronograma semanal: rotação pelo treino parado há mais tempo, evitando repetir
     o mesmo tipo (superiores, inferiores) em 48 h e perna perto da atividade principal. */
  const princ = String(meta(p).extra || "").trim();
  const princTxt = princ.toLowerCase();
  const CAT_NOME = { sup:"superiores", inf:"inferiores", full:"corpo inteiro" };
  const desde = {};
  ordem.forEach(d=>{ const u = musc.find(e=>e.dia===d); desde[d] = u ? dias(u.data) : 99; });

  const cand = ordem.map(d=>{
    const c = days[d].cat;
    let score = Math.min(desde[d],14);
    const notas = []; let bloq = null;

    if(ultimo && ultimo.data===ref) bloq = "já treinou neste dia";
    else if(ultimo && days[ultimo.dia] && c && days[ultimo.dia].cat===c && dias(ultimo.data) < 2)
      bloq = (CAT_NOME[c] || "mesmo tipo de treino") + " em recuperação do " + ultimo.dia;

    if(princTxt && c==="inf"){
      if(eA){ score -= 6; notas.push(`${princTxt} no dia seguinte, perna hoje pode atrapalhar`); }
      else if(eH){ score -= 6; notas.push(`${princTxt} no mesmo dia, perna junto atrapalha as duas coisas`); }
      else if(eO){ score -= 6; notas.push(`${princTxt} na véspera, dê 48 h antes de perna`); }
    }else if(princTxt && c==="sup" && (eH||eO||eA)){ score += 2; notas.push(`superiores não conflita com ${princTxt}`); }
    return {d,score,bloq,notas,desde:desde[d]};
  });

  const livres = cand.filter(x=>!x.bloq);
  const lista = (livres.length?livres:cand).sort((a,b)=> b.score-a.score || ordem.indexOf(a.d)-ordem.indexOf(b.d));
  const resto = cand.filter(x=>x.d!==lista[0].d).sort((a,b)=> (a.bloq?1:0)-(b.bloq?1:0) || b.score-a.score);
  const win = lista[0];

  const marcas = [eO&&"na véspera", eH&&"no dia", eA&&"no dia seguinte"].filter(Boolean);
  let motivo;
  if(win.notas.length) motivo = win.notas[0].charAt(0).toUpperCase()+win.notas[0].slice(1)+".";
  else if(ultimo) motivo = `Último treino foi o <b>${ultimo.dia}</b>${dias(ultimo.data)===0?" neste dia":" há "+dias(ultimo.data)+(dias(ultimo.data)===1?" dia":" dias")}. O ${win.d} é o que está parado há mais tempo.`;
  else motivo = `Sem registros ainda. Comece pelo ${ordem[0]} e siga a rotação.`;
  if(marcas.length && princ) motivo += ` <b>${esc(princ)} marcado ${marcas.join(", ")}.</b>`;

  return { win:Object.assign({},win,{motivo}), resto, descanso: livres.length===0 };
}

/* ==========================================================================
   PaceScoring (v31) — histórico real dos últimos 14 dias + IA validadora
   -----------------------------------------------------------------------
   Módulo puro determinístico que:
     - carrega histórico de 14 dias (S.events)
     - calcula fadiga por grupo com decay meia-vida 2 dias
     - conta dias desde último estímulo por grupo
     - jiu conta como cardio + core + 30% fadiga em perna (MI leve)
     - devolve top-1 candidato + evita 48h entre grupos grandes
   Depois entrega tudo pra IA (função pace-ia, ação "dia").
   ========================================================================== */
/* grupos musculares de cada treino: os gravados no plano ou, se faltarem,
   deduzidos do título e dos nomes dos exercícios */
const GRUPOS_TREINO = ['peito','costas','ombro','biceps','triceps','antebraco','perna_ant','perna_post','panturrilha','core','cardio'];
const GRUPO_PALAVRAS = [
  ['peito', /supino|peito|peitoral|crucifixo(?! inverso)|pec ?deck|voador|crossover|flex[aã]o de bra/],
  ['costas', /costas|remada|puxada|pulldown|pull ?down|barra fixa|graviton|serrote|levantamento terra/],
  ['ombro', /ombro|desenvolvimento|eleva[cç][aã]o lateral|eleva[cç][aã]o frontal|face ?pull|crucifixo inverso|arnold|deltoide/],
  ['biceps', /b[ií]ceps|rosca/],
  ['triceps', /tr[ií]ceps|testa|franc[eê]s|mergulho|paralelas|coice/],
  ['antebraco', /antebra[cç]o|pegada|farmer|pendurad/],
  ['perna_ant', /agachamento|leg ?press|extensora|hack|quadr[ií]ceps|afundo|passada|b[uú]lgaro|sissy/],
  ['perna_post', /stiff|flexora|terra romeno|posterior|gl[uú]teo|p[eé]lvica|hip thrust|abdu[cç][aã]o|abdutora/],
  ['panturrilha', /panturrilha|g[eê]meos/],
  ['core', /abdominal|abd[oô]men|prancha|\bcore\b|lombar|infra|supra|remador/],
  ['cardio', /esteira|bike|bicicleta|corrida|el[ií]ptico|cardio|escada|hiit|pular corda/]
];
function gruposDoTreino(t){
  if(!t) return [];
  if(Array.isArray(t.grupos) && t.grupos.length) return t.grupos.filter(g=>GRUPOS_TREINO.includes(g));
  const txt = [t.t||""].concat((t.ex||[]).map(e=>e.n||"")).join(" | ").toLowerCase();
  return GRUPO_PALAVRAS.filter(([,re])=>re.test(txt)).map(([g])=>g);
}
function gruposPorLetra(p){
  const d = dayset(p), out = {};
  letras(p).forEach(L=>{ out[L] = gruposDoTreino(d[L]); });
  return out;
}
/* treino de uma sessão registrada: o do plano atual ou, se o plano foi trocado depois,
   o plano arquivado que tem os exercícios dessa sessão */
function treinoDaSessao(e, days){
  if(!e || !e.dia) return null;
  const atual = (days || dayset(e.perfil))[e.dia];
  const ids = Object.keys(e.entries || {});
  if(!ids.length) return atual || null;
  // o treino (atual ou arquivado) que tem mais exercícios desta sessão; empate fica com o atual
  const conta = t => (t && Array.isArray(t.ex)) ? ids.filter(id=>t.ex.some(x=>x.id===id)).length : 0;
  let melhor = atual || null, n = conta(atual);
  if(n === ids.length) return melhor;
  for(const h of ((S.planHist && S.planHist[e.perfil]) || [])){
    const t = (h.plano || {})[e.dia], c = conta(t);
    if(c > n){ melhor = t; n = c; if(c === ids.length) break; }
  }
  return melhor;
}
const metaSemanalGrupos = p => { const m = meta(p).meta_semanal; return (m && typeof m==="object") ? m : META_SEMANAL_PADRAO; };
function _paceContribMusc(perfil, letra, ev){
  const grupos = gruposDoTreino(ev ? treinoDaSessao(ev) : dayset(perfil)[letra]);
  const c = {};
  grupos.forEach(g=>{ c[g] = (g==='core'||g==='panturrilha'||g==='antebraco') ? 0.5 : 1.0; });
  return c;
}
function _paceContribJiu(){
  // v31.2: impactos ajustados — pesa na decisão, mas não zera. Consciência > bloqueio.
  return { cardio: 1.0, core: 0.7, perna_ant: 0.5, perna_post: 0.5, panturrilha: 0.4 };
}
function _paceContribAtiv(atividade){
  atividade = String(atividade||'').toLowerCase();
  if(atividade==='jiu') return _paceContribJiu();
  if(atividade==='corrida') return { cardio: 1.0, perna_ant: 0.4, perna_post: 0.4, panturrilha: 0.5 };
  if(atividade==='bike')    return { cardio: 0.8, perna_ant: 0.3, perna_post: 0.2 };
  if(atividade==='futebol') return { cardio: 1.0, perna_ant: 0.5, perna_post: 0.5, core: 0.3 };
  if(atividade==='caminhada') return { cardio: 0.4 };
  if(atividade==='natacao')   return { cardio: 1.0, costas: 0.3, ombro: 0.4, core: 0.3 };
  return {};
}
const PaceScoring = {
  carregarHistorico(perfil, n){
    n = Number(n||14);
    const hoje = REF();
    const limite = shift(-n);
    return (S.events||[])
      .filter(e=>e.perfil===perfil && e.data>=limite && e.data<=hoje)
      .sort((a,b)=> a.data<b.data ? 1 : -1);
  },
  calcularFadiga(perfil, hist){
    const hoje = new Date(REF()+'T12:00:00');
    const fad = {};
    (hist||[]).forEach(e=>{
      const dEv = new Date(e.data+'T12:00:00');
      const dias = Math.max(0, Math.floor((hoje - dEv)/86400000));
      const decay = Math.pow(0.5, dias/2);
      let contrib = {};
      if(e.tipo==='musc' && e.dia) contrib = _paceContribMusc(perfil, e.dia, e);
      else if(e.tipo==='extra')    contrib = _paceContribAtiv(e.atividade);
      Object.entries(contrib).forEach(([g,peso])=>{ fad[g] = (fad[g]||0) + peso*decay; });
    });
    return fad;
  },
  diasDesde(perfil, hist){
    const hoje = new Date(REF()+'T12:00:00');
    const all = new Set();
    Object.values(gruposPorLetra(perfil)).forEach(gs=> gs.forEach(g=> all.add(g)));
    all.add('cardio');
    const gap = {};
    all.forEach(g=>{ gap[g] = 999; });
    (hist||[]).forEach(e=>{
      let contrib = {};
      if(e.tipo==='musc' && e.dia) contrib = _paceContribMusc(perfil, e.dia, e);
      else if(e.tipo==='extra')    contrib = _paceContribAtiv(e.atividade);
      const dEv = new Date(e.data+'T12:00:00');
      const dias = Math.max(0, Math.floor((hoje - dEv)/86400000));
      Object.keys(contrib).forEach(g=>{
        if(contrib[g] >= 0.5 && dias < gap[g]) gap[g] = dias;
      });
    });
    return gap;
  },
  scoreCandidato(perfil){
    const hist = this.carregarHistorico(perfil, 14);
    const fad  = this.calcularFadiga(perfil, hist);
    const gap  = this.diasDesde(perfil, hist);
    const meta = metaSemanalGrupos(perfil);
    const gruposDia = gruposPorLetra(perfil);
    const GRANDES = new Set(['peito','costas','perna_ant','perna_post']);

    // v31.2: pós-jiu vira consciência (não bloqueio). Fadiga já penaliza o score
    // via _paceContribJiu; a IA + flag avisoJiu cuidam da justificativa.
    const MS_GROUPS = new Set(['peito','costas','ombro','biceps','triceps','antebraco']);
    const MI_CORE   = new Set(['perna_ant','perna_post','panturrilha','core']);
    const hoje0 = new Date(REF()+'T12:00:00');
    const jiuDias = (hist||[])
      .filter(e=>e.tipo==='extra' && String(e.atividade||'').toLowerCase()==='jiu')
      .map(e=>Math.max(0, Math.floor((hoje0 - new Date(e.data+'T12:00:00'))/86400000)));
    const jiu24  = jiuDias.some(d=>d<=1);       // treinou jiu nas últimas 24h
    const jiu72_2x = jiuDias.filter(d=>d<=3).length >= 2; // sinal informativo, não bloqueio
    const jiu48    = jiuDias.some(d=>d<=2);

    const scores = letras(perfil).map(letra=>{
      const grupos = gruposDia[letra] || [];
      let s = 0, bloq = null;
      grupos.forEach(g=>{
        const w = meta[g] || 1;
        const gapG = gap[g]==null ? 999 : gap[g];
        const fadG = fad[g] || 0;
        s += (Math.min(gapG,7) * w) - fadG;
        if(GRANDES.has(g) && (fadG > 0.6 || gapG < 2)) bloq = g;
      });
      return { letra, score: s, bloq, grupos };
    });

    // Preferir letras livres. Se todas bloqueadas por regra pós-jiu, cair pra MS
    // ordenado por maior dias_desde; se nada de MS, sinalizar descanso.
    let livres = scores.filter(x=>!x.bloq);
    let fallbackDescanso = false;
    if(!livres.length){
      const somenteMS = scores.filter(x=>{
        const gs = x.grupos || [];
        return gs.length && gs.every(g=> MS_GROUPS.has(g));
      });
      if(somenteMS.length){
        // reordena MS por maior dias_desde do grupo primário
        somenteMS.sort((a,b)=>{
          const ga = Math.max(...a.grupos.map(g=> gap[g]==null?0:gap[g]));
          const gb = Math.max(...b.grupos.map(g=> gap[g]==null?0:gap[g]));
          return gb - ga;
        });
        livres = somenteMS;
      } else {
        fallbackDescanso = true;
      }
    }
    const lista = (livres.length ? livres : scores).sort((a,b)=> b.score - a.score);
    const win = lista[0];
    // v31.2: se o vencedor toca MI/core E houve jiu nas últimas 24h → marca aviso
    const winGrupos = fallbackDescanso ? [] : (win.grupos || []);
    const avisoJiu = !fallbackDescanso && jiu24 && winGrupos.some(g=>MI_CORE.has(g));
    const intensidade = fallbackDescanso ? 'descanso'
      : (avisoJiu ? 'leve'
        : (win.bloq ? 'leve' : (Object.values(fad).some(v=>v>1.5) ? 'moderada' : 'forte')));
    return {
      candidato: {
        letra: fallbackDescanso ? 'DESCANSO' : win.letra,
        grupos_alvo: winGrupos,
        intensidade,
        avisoJiu,
        descricao_sugerida: avisoJiu ? 'curto e leve (volume reduzido pós-jiu)' : null,
        bloqueio_pos_jiu: null,
        jiu_recente: { jiu24, jiu48, jiu72_2x }
      },
      fadiga: fad,
      dias_desde: gap,
      score_detalhado: scores,
      historico: hist.map(e=>({
        data: e.data,
        tipo: e.tipo,
        grupos: e.tipo==='musc' ? gruposDoTreino(treinoDaSessao(e)) : Object.keys(_paceContribAtiv(e.atividade||'')),
        duracao_min: e.duracao || null,
        intensidade: e.intensidade || null,
        atividade: e.atividade || null,
        dia_musc: e.dia || null
      }))
    };
  }
};

/* ============================================================ IA do app
   Todas as chamadas passam pela função pace-ia, que confere a sessão da conta. */
async function iaChamar(acao, payload, o){
  o = o || {};
  if(!SESSAO) throw new Error("Entre de novo no app.");
  const ctrl = new AbortController(), timer = setTimeout(()=>ctrl.abort(), o.tempo || 60000);
  let resp, j = null;
  try{
    resp = await fetch(o.url || IA_URL, { method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(Object.assign({}, payload, { acao, token: SESSAO.token })), signal: ctrl.signal });
    try{ j = await resp.json(); }catch(e){ j = null; }
  }catch(e){
    clearTimeout(timer);
    throw new Error(e && e.name==='AbortError' ? 'A IA demorou demais para responder. Tente de novo.'
      : (navigator.onLine ? 'Não foi possível falar com a IA agora. Tente de novo.' : 'Sem internet. Conecte-se e tente de novo.'));
  }
  clearTimeout(timer);
  if(resp.status===401 || (j && j.sessao)){
    try{ syncEngine.pullAndMerge(); }catch(e){}
    throw new Error((j && j.error) || 'Sua sessão terminou. Entre de novo.');
  }
  if(!resp.ok || !j || j.ok===false){ const err = new Error((j && j.error) || ('Erro '+resp.status+' na IA.')); err.dados = j; throw err; }
  return j;
}
/* o que a IA precisa saber do perfil: nome, esporte, orientações e os treinos do plano */
function iaPerfil(p){
  const m = meta(p), d = dayset(p);
  return {
    perfil_nome: m.label,
    esporte: m.extra || "",
    esporte_chave: m.principal || "",

  cache: {},
  _boundOnce: false,
  async hydrate(){
    const holder = document.getElementById('pace-ia-card');
    if(!holder) return;
    const perfil = ui.perfil;
    const hoje = REF();

    const gaps = Object.entries(s.dias_desde)
      .filter(([g,d])=>d<99 && (meta[g]||0)>0)

    const detTxt = `Regra: <b>${s.candidato.letra}</b> · alvo ${s.candidato.grupos_alvo.join(', ')} · ${s.candidato.intensidade}`;

          <div class="pace-ia-ai"><span class="pace-ia-muted">IA analisando os últimos 14 dias…</span></div>

      </div>`;

    const tog = holder.querySelector('[data-pace-toggle]');
    if(tog) tog.onclick = (ev)=>{
      const box = holder.querySelector('.pace-ia-box');
      if(!box) return;
      box.classList.toggle('collapsed');
      ev.currentTarget.textContent = box.classList.contains('collapsed') ? '▸' : '▾';
    };

    const key = perfil+':'+hoje;
    if(this.cache[key]){ this._render(this.cache[key]); return; }

    const payload = Object.assign({
      perfil, hoje,
      ultimos_14_dias: s.historico,
      meta_semanal: meta,
      candidato_regras: s.candidato,
      fadiga_atual: s.fadiga,
      dias_desde: s.dias_desde
    }, iaPerfil(perfil));
    try {
      const j = await iaChamar('dia', payload, { tempo: 45000 });
      this.cache[key] = j;
      this._render(j);
    } catch(e){
      this._renderErr(navigator.onLine ? 'IA indisponível agora; valem as regras acima.' : 'Sem internet; valem as regras acima.');
    }
  },
  _render(j){
    const holder = document.getElementById('pace-ia-card'); if(!holder) return;
    const aiEl = holder.querySelector('.pace-ia-ai'); if(!aiEl) return;
    const t = j.treino_hoje || {};
    const th = `<div class="pace-ia-th"><b>IA:</b> ${esc(String(t.letra||'?'))} — ${esc(String(t.nome||''))} · ${esc(String(t.intensidade||''))}</div>`;
    const jus = j.justificativa ? `<div class="pace-ia-jus">${esc(j.justificativa)}</div>` : '';
    const alerta = j.alerta ? `<div class="pace-ia-alerta">${pic("alert","sm")} ${esc(j.alerta)}</div>` : '';
    const prox = Array.isArray(j.proximos_3_dias) && j.proximos_3_dias.length
      ? '<div class="pace-ia-prox"><div class="pace-ia-prox-t">Próximos 3 dias</div>' +
        j.proximos_3_dias.map(d=>`<div class="pace-ia-prox-l"><b>${esc(String(d.data||''))}</b> · ${esc(String(d.letra||''))} ${esc(String(d.nome||''))} <span class="pace-ia-muted">— ${esc(String(d.por_que||''))}</span></div>`).join('') +
        '</div>'

function campo(v,ph,suf,exId,i,k){
  return `<div class="fw"><input class="cs" type="text" data-cex="${exId}" data-ci="${i}" data-ck="${k}" value="${esc(String(v==null?"":v))}" placeholder="${ph||""}" inputmode="decimal" pattern="[0-9.,]*" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"><span>${suf}</span></div>`;
}
function campoObs(v,exId,i){
  return `<input class="obs-in" type="text" data-cex="${exId}" data-ci="${i}" data-ck="obs" value="${esc(String(v==null?"":v))}" placeholder="obs (opcional)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">`;
}
function resumo(ex,sets){
  if(!sets) return null;
  const a = sets.map(s=>{
    if(!s) return null;
    if(ex.ty==="time") return s.sec?s.sec+"s":null;
    if(ex.ty==="reps") return s.reps||null;
    if(!s.kg&&!s.reps) return null;
    return (s.kg||"?")+"×"+(s.reps||"?");
  }).filter(Boolean);
  return a.length?a.join("  "):null;
}
/* "Anterior" de cada exercício: o registro mais recente deste treino em que ele tem valor.
   Se o último treino foi encerrado antes do fim, o exercício que ficou de fora usa a sessão anterior. */
function ultimaSessao(p, d){
  const t = treinoSessao(p, d); if(!t) return {};
  const todos = evs(p,"musc").filter(x=>x.data<=REF() && (ui.editId==null || String(x.id)!==String(ui.editId)));
  const lista = todos.filter(x=>x.dia===d);
  const tem = id => x=>((x.entries||{})[id]||[]).some(s=>s && (s.kg||s.reps||s.sec));
  const out = {};
  t.ex.forEach(ex=>{
    // v47: o último registro no mesmo treino; se não houver (exercício trocado ou de outro treino), o último em qualquer treino
    const e = lista.find(tem(ex.id)) || todos.find(tem(ex.id));
    if(e) out[ex.id] = e.entries[ex.id];
  });
  return out;
}
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* primeiro acesso: sem treino no plano (ou sem dieta e sem ter pulado essa etapa) */
function precisaBoasVindas(p){
  if(!temPlano(p)) return true;
  const pf = (S.perfis && S.perfis[p]) || {};
  const D = (S.dieta && S.dieta[p]) || {};
  return !pf.onb && !(D.refs || []).length;
}
function render(){

  if(!boasVindas && ui.view==="treino" && !dayset(p)[ui.dia]){
    ui.dia = avaliar(p).win.d || letras(p)[0] || null;

  document.body.classList.toggle("pc-session", sessao);
  let out = "";

  else {

  }
  if(ui.toast) out += `<div class="toast" role="status">${ui.toast}</div>`;
  document.getElementById("app").innerHTML = out;
  const NAV = [["hoje","Início","home"],["treinos","Treinos","dumbbell"],["dieta","Dieta","fork"],["agenda","Calendário","cal"],["cal","Evolução","chart"]];

/* Render seguro contra digitação: se o usuário está com foco num input
   editável (kg/reps/obs de série, campos [data-f] de exercício, [data-meta]
   de perfil), adia o render pra não destruir o DOM debaixo do teclado do
   iOS — que fecha silenciosamente e faz "focou mas não digita". */
function safeRender(){
  try{
    const ae = document.activeElement;
    if(ae && ae.matches && (
        ae.matches('input[data-cex]') ||
        ae.matches('input[data-cob]') ||
        ae.matches('input[data-f]')   ||
        ae.matches('[data-meta]')     ||
        ae.matches('textarea')
    )){
      clearTimeout(safeRender._t);
      safeRender._t = setTimeout(safeRender, 800);
      return;
    }
  }catch(e){}
  render();
}

/* --------------------------- Aviso pré-treino: conflito com schedule/plan --- */
function verificarConflitoIniciar(p, dEscolhido){
  const dataRef = REF();
  const sch = schedHoje(p);
  const avisos = [];
  const t = dayset(p)[dEscolhido];
  const pernas = !!(t && t.cat==="inf");
  // v45: compara com a sugestão do app (que já desvia do cronograma para não repetir,
  // ou por causa do jiu marcado), não com o cronograma cru — senão o app reclama da
  // própria sugestão
  const sugEf = (sugestaoTreino(p, dataRef) || {}).musc || null;
  if(sch){
    if(sch.musc && sch.musc !== dEscolhido && sugEf !== dEscolhido){
      const diaSem = WDL[new Date(dataRef+"T12:00").getDay()];
      let av = sugEf && sugEf !== sch.musc
        ? `O sugerido para hoje é o treino ${sugEf}, mas você escolheu o ${dEscolhido}.`
        : `O cronograma de ${diaSem} prevê o treino ${sch.musc}${sch.nota?" ("+sch.nota+")":""}, mas você escolheu o ${dEscolhido}.`;
      if(sch.jiu && pernas) av += " Você marcou jiu: pernas pesadas antes podem prejudicar o tatame.";
      avisos.push(av);
    } else if(!sch.musc && pernas && sch.jiu){
      avisos.push(`Você marcou jiu hoje. O treino ${dEscolhido} (pernas) pode sobrecarregar antes do tatame.`);
    }
  }
  // usa a letra escolhida (não o cronograma bruto), igual ao card principal
  const conf = (typeof conflitoPlan==="function") ? conflitoPlan(p, dataRef, dEscolhido) : null;
  if(conf && pernas && (!sch || sch.musc===dEscolhido)){
    avisos.push(conf.msg.replace(/<[^>]+>/g,""));
  }
  return avisos.length ? avisos.join("\n\n") + "\n\nContinuar mesmo assim?" : null;
}

function sessaoCard(s,days,acoes){
  const t = treinoDaSessao(s, days); if(!t) return "";
  // exercícios do treino + os registrados nesta sessão que saíram do plano depois
  const lista = (t.ex || []).slice(), vistos = new Set(lista.map(x=>x.id));
  Object.keys(s.entries || {}).forEach(id=>{ if(!vistos.has(id)){ const e = exInfo(s.perfil, id); if(e){ lista.push(e); vistos.add(id); } } });
  return `<div class="card"><div class="h-h"><span class="h-d">${s.dia} · ${esc(t.t)}</span>
    <span style="font-family:var(--mono);font-size:12px;color:var(--faint)">${brd(s.data)}</span></div>` +
    lista.map(ex=>{ const r = resumo(ex,(s.entries||{})[ex.id]);
      return r?`<div class="hist"><span class="n">${esc(ex.n)}</span><span class="v">${r}</span></div>`:""; }).join("") +
    (Number(s.rapido)>0 ? `<p class="h-rapido">Marcado como feito · ${Number(s.rapido)} ${Number(s.rapido)===1?"série":"séries"} com o valor da última vez</p>` : "") +
    (acoes||"") + `</div>`;
}

/* ---------- treino em andamento (rascunho datado) ---------- */
function marcaDraft(p, d){
  if(!S.draftMeta) S.draftMeta = {};
  const k = p+":"+d, m = S.draftMeta[k];
  if(!m || m.data !== REF()) S.draftMeta[k] = { data: REF(), inicio: Date.now() };
  else if(m.aguarda){ m.inicio = Date.now(); delete m.aguarda; }   // v47: o tempo conta a partir da 1ª série
}
/* treino começado antes da meia-noite e ainda em curso (até 8 h): continua valendo para o dia em que começou */
function viraDia(m){ return !!(m && m.data===shift(-1) && m.inicio && (Date.now()-m.inicio) < 8*3600*1000); }
/* sessão ao vivo que passou da meia-noite: começou no próprio dia do treino (não é registro feito depois) */
function passouMeiaNoite(m, data){ return !!(m && m.data===data && viraDia(m) && iso(new Date(m.inicio))===m.data); }
function limpaDraftMeta(p, d){ if(S.draftMeta) delete S.draftMeta[p+":"+d]; }
function contaSeries(t, dr){
  let total = 0, ok = 0, pre = 0;
  t.ex.forEach(e=>{ total += e.s; (dr[e.id]||[]).slice(0,e.s).forEach(x=>{ if(!x) return; if(x.ok) ok++; if(x.kg||x.reps||x.sec) pre++; }); });
  return { total, ok, pre };
}
/* Um treino só está "em andamento" se tem rascunho com valores iniciado HOJE e ainda não foi salvo. */
function sessaoAberta(p){
  const hoje = shift(0);
  for(const L of letras(p)){
    const k = p+":"+L, m = S.draftMeta && S.draftMeta[k], dr = S.draft && S.draft[k], t = treinoSessao(p, L);
    if(m && !m.edicao && (m.data===hoje || viraDia(m)) && dr && t && temValores(dr)) return Object.assign({ L, t, inicio:m.inicio, data:m.data }, contaSeries(t, dr));
  }
  return null;
}

/* ---------- toast com desfazer (fora do render) ---------- */
function toastUndo(msg, undo){
  const old = document.getElementById("pcToast"); if(old) old.remove();
  clearTimeout(toastUndo._t);
  const el = document.createElement("div"); el.id = "pcToast"; el.className = "pc-toast"; el.setAttribute("role","status");
  el.innerHTML = `<span>${esc(msg)}</span>${undo?`<button type="button">Desfazer</button>`:""}`;
  document.body.appendChild(el);
  if(undo) el.querySelector("button").onclick = ()=>{ el.remove(); undo(); };
  toastUndo._t = setTimeout(()=>el.remove(), undo ? 5000 : 2400);
}

/* teclado aberto: a barra fixa do treino vira bloco normal para não cobrir os campos */
(function(){
  if(typeof window==="undefined" || !window.visualViewport) return;
  let base = window.innerHeight;
  const chk = ()=> document.body && document.body.classList.toggle("kb-open", window.visualViewport.height < base - 150);
  window.visualViewport.addEventListener("resize", chk);

})();

function pcRefeicoesDia(p){
  const D = S.dieta[p], marc = S.check[p+":"+REF()] || {};
  const refs = D.refs || [], feitas = refs.filter(r=>marc[r.id]==="ok");
  const temKcal = refs.some(r=>r.kcal!=null && r.kcal!=="");
  const kcal = feitas.reduce((a,r)=>a + (Number(r.kcal)||0), 0);
  const tipo = tipoDiaHoje(p), alvos = getAlvosDia(p), alvoHoje = (tipo && alvos && alvos[tipo]) ? alvos[tipo] : null;
  const alvoK = alvoHoje ? Number(alvoHoje.kcal) : parseFloat(String(D.alvo && D.alvo.kcal || "").replace(/[^\d.]/g,"")) || null;
  return { refs, feitas, temKcal, kcal, tipo, alvoHoje, alvoK, marc };
}

function viewHoje(p,m){
  const days = dayset(p), hj = shift(0);

  const modoAmanha = !!(treinoDoDia && ui.off === 0);
  let r;
  if(modoAmanha){ const sv = ui.off; ui.off = sv + 1; try{ r = avaliar(p); } finally{ ui.off = sv; } }

  } else if(treinoDoDia){
    const tf = days[treinoDoDia.dia];
    const nSer = Object.values(treinoDoDia.entries||{}).reduce((a,arr)=>a+(arr||[]).filter(x=>x&&(x.kg||x.reps||x.sec)).length,0);
    out += `<section class="pc-hl" aria-label="Treino concluído"><div class="ey">${pic("check","sm")}${ui.off===0?"Treino concluído":"Treino registrado neste dia"}</div>
      <div class="ttl">${esc(tf?tf.t:"Treino "+treinoDoDia.dia)}</div>
      <div class="meta">Treino ${treinoDoDia.dia} · ${nSer} séries registradas</div>
      <button class="pc-btn hl" data-edittoday="${treinoDoDia.dia}"><span>Ver ou editar treino</span>${pic("arrow")}</button></section>`;
  } else if(r.schedRest && ui.off===0){
    const jj = !!r.win.jejum;
    const nota = jj ? "Dia de jejum" : (r.win.schedNota || "Descanso");
    out += `<section class="pc-hl" aria-label="Dia sem musculação"><div class="ey">${jj?"Você marcou jejum":"Pelo seu cronograma"}${jj?"":tagJiu}</div>
      <div class="ttl">${esc(nota)}</div>
      <div class="meta">Sem musculação hoje${jj && r.win.letraOriginal?` · seria o treino ${esc(r.win.letraOriginal)}`:""}</div>
      <button class="pc-btn hl" data-picktreino="1"><span>Treinar mesmo assim</span>${pic("arrow")}</button></section>`;
    if(r.win.motivo) out += `<details class="pc-more"><summary>${pic("info","sm")}<span>Por que sem musculação</span></summary><p>${r.win.motivo}</p></details>`;
  } else {
    const passado = REF() < hj;
    out += `<section class="pc-hl" aria-label="Treino sugerido"><div class="ey">${ui.off===0?"Sugerido para hoje":passado?"Treino deste dia":"Sugerido para este dia"}${tagJiu}</div>
      <div class="ttl">${esc(d.t)}</div>
      <div class="meta">Treino ${r.win.d} · ${d.ex.length} exercícios · ~${duracaoMin(d)} min</div>
      <div class="pc-hl-ex">${d.ex.slice(0,3).map(e=>`<span>${esc(e.n)}</span>`).join("")}${d.ex.length>3?`<span class="mais">+${d.ex.length-3}</span>`:""}</div>
      <button class="pc-btn hl" data-abrir="${r.win.d}"><span>${passado?"Registrar treino "+r.win.d:"Iniciar treino"}</span>${pic("arrow")}</button>
      ${passado?`<button class="pc-hl-2" data-feitorapido="1">${pic("check","sm")}<span>Já fiz: marcar como feito</span></button>`
        : (ui.off===0 ? `<button class="pc-hl-2" data-curto30="${r.win.d}">${pic("bolt","sm")}<span>Tenho só 30 min</span></button>` : "")}</section>`;
    if(r.win.motivo) out += `<details class="pc-more"><summary>${pic("info","sm")}<span>${r.descanso&&!r.schedRest?"Neste dia o melhor é descansar":"Por que este treino"}</span></summary><p>${r.win.motivo}</p></details>`;

    return `<button class="chip ${on?"on":""}" data-planq="${a}" aria-pressed="${on}">${pic(on?"check":ico,"sm")}<span>${esc(ATIV_LABEL[a]||a)}</span></button>`;

  if(ui.off===0) out += pcCoachBar(p, r);

  out += `<div class="pc-list" style="margin-top:14px">` + pcAgua(p);

  // próxima atividade

    out += `<button class="pc-row" data-dt="${am}">${pic("cal")}<div class="main"><div class="t">Amanhã</div><div class="s">${esc(txt)}</div></div><span class="chev">${pic("right")}</span></button>`;

  });
  if(extrasHoje.length) out += `</div>`;
  out += `<div class="pc-acts2">
    <button class="pc-act" data-atv="1">${pic("run","sm")}<span>Atividade extra</span></button>
    <button class="pc-act ${skipAtivo?"on":""}" data-skip="1" aria-pressed="${skipAtivo}">${pic("moon","sm")}<span>${skipAtivo?"Descanso marcado":"Não treinei"}</span></button>
  </div>`;
  return out;
}

function metaExercicio(ex, ant, leve){
  const a = (ant||[]).filter(Boolean);
  if(!a.length) return null;
  const porSerie = [];
  for(let i=0;i<ex.s;i++){ const x = (ant||[])[i] || a[a.length-1]; porSerie.push({ kg:x.kg, reps:x.reps, sec:x.sec }); }

  const fx = faixaReps(ex.p), sets = a.filter(x=>num(x.kg)>0 && num(x.reps)>0);
  if(!fx || !sets.length) return { porSerie, sobe:false };
  const kgTop = Math.max(...sets.map(x=>num(x.kg)));
  const noTop = sets.filter(x=>num(x.kg)===kgTop);
  const bateu = noTop.length >= Math.min(ex.s, 2) && noTop.every(x=>num(x.reps)>=fx.max);

}

/* ------------------------------------------------------------------ EVOLUÇÃO */
function pcMelhor(ex, arr){
  const v = (arr||[]).filter(x=>x && (x.kg||x.reps||x.sec));
  if(!v.length) return null;
  if(ex.ty==="time") return v.reduce((b,x)=> num(x.sec)>num(b.sec)?x:b);
  if(ex.ty==="reps") return v.reduce((b,x)=> num(x.reps)>num(b.reps)?x:b);
  return v.reduce((b,x)=>{ const kx=num(x.kg), kb=num(b.kg); if(kx!==kb) return kx>kb?x:b; return num(x.reps)>num(b.reps)?x:b; });
}
function viewCal(p,m){
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+ui.mes);
  const ano = base.getFullYear(), mes = base.getMonth(), ym = `${ano}-${String(mes+1).padStart(2,"0")}`;
  let out = pcTopo() + `<h1 class="pc-h1">Evolução</h1><p class="pc-sub">Seu histórico, com contexto.</p>`;
  out += `<div class="pc-period"><button class="pc-ib" data-mes="-1" aria-label="Mês anterior">${pic("left")}</button>
    <span class="lbl">${cap(MES[mes])} de ${ano}</span>
    <button class="pc-ib" data-mes="1" aria-label="Próximo mês" ${ui.mes>=0?"disabled":""}>${pic("right")}</button></div>`;
  const days = dayset(p), hj = shift(0);
  const ses = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.data.startsWith(ym)).sort((a,b)=>a.data<b.data?-1:1);
  const ab = ym===hj.slice(0,7) ? sessaoAberta(p) : null;
  const semana = ym===hj.slice(0,7) ? treinosNaSemana(p, inicioSemana(hj)) : null;
  out += `<section class="pc-hl" aria-label="Treinos concluídos no mês"><div class="ey">Treinos concluídos</div>
    <div style="display:flex;align-items:baseline;gap:14px;margin-top:6px"><span class="big">${ses.length}</span><span style="font-size:18px">em ${MES[mes]}</span></div>
    <div class="meta" style="margin:8px 0 0">${semana!=null?`${semana} nesta semana · meta de ${metaSemanal(p)}`:"mês encerrado"}${ab?" · 1 em andamento (não conta)":""}</div></section>`;
  out += pcGraficoSemanas(p, ano, mes);
  if(ym===hj.slice(0,7)) out += pcGruposSemana(p);
  out += pcRecordes(p);

  // por exercício — só exercícios presentes nas sessões do período
  const todos = letras(p).flatMap(L=>(days[L]?days[L].ex:[]).map(ex=>Object.assign({L}, ex)));
  const presentes = todos.filter(ex=>ses.some(e=>e.dia===ex.L && pcMelhor(ex,(e.entries||{})[ex.id])));
  if(!presentes.find(x=>x.id===ui.evoEx)) ui.evoEx = presentes.length ? presentes[0].id : null;
  out += pcSec("Por exercício");
  if(!ui.evoEx){ out += `<p class="pc-note" style="font-size:15px">Nenhum treino concluído neste período.</p>`; }
  else{
    const ex = presentes.find(x=>x.id===ui.evoEx);
    const comE = ses.filter(e=>e.dia===ex.L && pcMelhor(ex,(e.entries||{})[ex.id]));
    const un = ex.ty==="time" ? "segundos" : ex.ty==="reps" ? "repetições" : "kg (como anotado no treino)";
    out += `<button class="pc-sel" data-evoex="1" aria-label="Escolher exercício"><span>${esc(ex.n)}</span>${pic("down")}</button>
      <p class="pc-note" style="font-size:14px">Treino ${ex.L} · unidade: ${un} · ${comE.length} ${comE.length===1?"sessão":"sessões"} no período</p>`;
    out += pcGraficoEx(p, ex, ym);
    const a = comE[0], b = comE[comE.length-1], bA = pcMelhor(ex,a.entries[ex.id]), bB = pcMelhor(ex,b.entries[ex.id]);
    const val = x => ex.ty==="time" ? `${x.sec}<small> s</small>` : ex.ty==="reps" ? `${x.reps}<small> rep</small>` : `${x.kg}<small> kg</small> × ${x.reps||"—"}`;
    if(comE.length===1){
      out += `<div class="pc-cmp" style="grid-template-columns:1fr"><div><div class="d">${brd(a.data)} · Treino ${a.dia}</div><div class="v">${val(bA)}</div></div></div>
        <p class="pc-crit">Só uma sessão com este exercício no período — sem comparação.</p>`;
    } else {
      const dif = ex.ty==="time" ? num(bB.sec)-num(bA.sec) : ex.ty==="reps" ? num(bB.reps)-num(bA.reps) : num(bB.kg)-num(bA.kg);
      const u = ex.ty==="time" ? "s" : ex.ty==="reps" ? "rep" : "kg";
      out += `<div class="pc-cmp"><div><div class="d">${brd(a.data)} · primeira do mês</div><div class="v">${val(bA)}</div></div>
        <div><div class="d">${brd(b.data)} · última do mês</div><div class="v">${val(bB)}</div>
        <span class="pc-delta ${dif<0?"neg":""}">${dif>0?"+":""}${Math.round(dif*100)/100} ${u}</span></div></div>`;
    }
    out += `<p class="pc-crit">Série exibida: a de <b>maior ${ex.ty==="load"?"carga":ex.ty==="time"?"tempo":"número de repetições"}</b> em cada sessão${ex.ty==="load"?"; em empate, a com mais repetições":""}. Comparação entre a primeira e a última sessão do período que contêm este exercício.</p>`;
    out += `<div class="pc-list" style="margin-top:10px">${comE.slice().reverse().map(e=>`<button class="pc-row" style="min-height:56px" data-evodt="${e.data}">
      <div class="main"><div class="t" style="font-size:16px">${brd(e.data)} · Treino ${e.dia}</div><div class="s">${(e.entries[ex.id]||[]).filter(x=>x&&(x.kg||x.reps||x.sec)).map(x=>pcFmtSet(ex,x)).join(" · ")}</div></div>
      <span class="end">${pcFmtSet(ex, pcMelhor(ex,e.entries[ex.id]))}</span></button>`).join("")}</div>`;
  }

  // últimas sessões
  out += pcSec("Últimas sessões") + `<div class="pc-list">`;
  if(ab) out += `<button class="pc-row" data-continuar="${ab.L}"><div class="main"><div class="t">Hoje, ${brd(hj)}</div><div class="s">Treino ${ab.L} · ${esc(ab.t.t)}</div></div><span class="pc-pill">Em andamento</span><span class="chev">${pic("right")}</span></button>`;
  const lista = ses.slice().reverse().slice(0, 6);
  lista.forEach(e=>{ const t = treinoDaSessao(e, days);
    out += `<button class="pc-row" data-evodt="${e.data}"><div class="main"><div class="t">${e.data===hj?"Hoje, ":""}${brd(e.data)}</div><div class="s">Treino ${e.dia}${t?" · "+esc(t.t):""}</div></div>
      <span class="pc-pill" style="background:transparent"><span class="pc-st-ok" style="width:22px;height:22px">${pic("check")}</span>Concluído</span><span class="chev">${pic("right")}</span></button>`; });
  if(!ab && !lista.length) out += `<p class="pc-note" style="font-size:15px">Sem sessões neste período.</p>`;
  out += `</div>`;
  return out;
}
/* ---- gráficos da Evolução (SVG, sem biblioteca) ---- */
function pcGraficoSemanas(p, ano, mes){
  const meta = metaSemanal(p) || 0, fim = new Date(ano, mes+1, 0), hj = shift(0);
  let ini = inicioSemana(`${ano}-${String(mes+1).padStart(2,"0")}-01`);
  const sem = [];
  while(ini <= `${ano}-${String(mes+1).padStart(2,"0")}-${String(fim.getDate()).padStart(2,"0")}` && sem.length < 6){
    const f = somaDias(ini, 6);
    const n = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.data>=ini && e.data<=f).length;
    sem.push({ini, f, n, futura: ini > hj});
    ini = somaDias(ini, 7);
  }
  const W = 340, H = 150, top = 22, bot = 28, max = Math.max(meta, ...sem.map(s=>s.n), 1);
  const bw = Math.min(40, (W-20)/sem.length - 14), gap = (W - bw*sem.length)/(sem.length+1);
  const y = v => top + (H-top-bot) * (1 - v/max);
  let g = "";
  if(meta){ g += `<line x1="0" x2="${W}" y1="${y(meta)}" y2="${y(meta)}" class="gx-meta"/><text x="${W}" y="${y(meta)-5}" text-anchor="end" class="gx-lbl">meta ${meta}</text>`; }
  sem.forEach((s,i)=>{
    const x = gap + i*(bw+gap), h = Math.max(s.n ? (H-top-bot)*s.n/max : 2, 2);
    const ok = meta && s.n >= meta;
    g += `<rect x="${x}" y="${H-bot-h}" width="${bw}" height="${h}" rx="6" class="${s.futura?"gx-fut":ok?"gx-bar ok":"gx-bar"}"/>`;
    if(!s.futura) g += `<text x="${x+bw/2}" y="${H-bot-h-6}" text-anchor="middle" class="gx-val">${s.n}</text>`;
    g += `<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" class="gx-lbl">${brd(s.ini).slice(0,5)}</text>`;
  });
  return pcSec("Treinos por semana") + `<div class="gx"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Treinos por semana em ${MES[mes]}: ${sem.map(s=>s.n).join(", ")}">${g}</svg>
    <p class="gx-leg"><span><i class="ok"></i>bateu a meta</span><span><i></i>abaixo da meta</span>${meta?`<span><i class="ln"></i>meta semanal</span>`:""}</p></div>`;
}
function pcGraficoEx(p, ex, ym){
  // últimas 10 sessões com este exercício até o fim do mês exibido
  const fimMes = ym + "-31";
  const lista = S.events.filter(e=>e.perfil===p && e.tipo==="musc" && e.dia===ex.L && e.data<=fimMes && pcMelhor(ex,(e.entries||{})[ex.id]))
    .sort((a,b)=>a.data<b.data?-1:1).slice(-10);
  if(lista.length < 2) return "";
  const v = e => { const b = pcMelhor(ex, e.entries[ex.id]); return ex.ty==="time" ? num(b.sec) : ex.ty==="reps" ? num(b.reps) : num(b.kg); };
  const pts = lista.map(e=>({d:e.data, v:v(e)}));
  const u = ex.ty==="time" ? "s" : ex.ty==="reps" ? "rep" : "kg";
  let lo = Math.min(...pts.map(x=>x.v)), hi = Math.max(...pts.map(x=>x.v));
  if(hi===lo){ lo = Math.max(0, lo - 2); hi = hi + 2; } else { const pad = (hi-lo)*.2; lo = Math.max(0, lo-pad); hi = hi+pad; }
  const W = 340, H = 170, L = 8, R = 8, T = 24, B = 30;
  const X = i => L + (W-L-R) * (pts.length===1 ? .5 : i/(pts.length-1));
  const Y = val => T + (H-T-B) * (1 - (val-lo)/(hi-lo));
  const linha = pts.map((q,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(q.v).toFixed(1)}`).join(" ");
  const area = linha + ` L${X(pts.length-1).toFixed(1)},${H-B} L${X(0).toFixed(1)},${H-B} Z`;
  const fmt = n => String(Math.round(n*100)/100).replace(".",",");
  let g = `<path d="${area}" class="gx-area"/><path d="${linha}" class="gx-line"/>`;
  pts.forEach((q,i)=>{
    const ult = i===pts.length-1;
    g += `<circle cx="${X(i)}" cy="${Y(q.v)}" r="${ult?5.5:4}" class="gx-pt ${ult?"last":""}"/>`;
    const mostra = pts.length<=6 || ult || i===0 || q.v===Math.max(...pts.map(z=>z.v));
    if(mostra) g += `<text x="${Math.min(W-14, Math.max(14, X(i)))}" y="${Y(q.v)-10}" text-anchor="middle" class="gx-val">${fmt(q.v)}</text>`;
  });
  g += `<text x="${L}" y="${H-8}" class="gx-lbl">${brd(pts[0].d).slice(0,5)}</text><text x="${W-R}" y="${H-8}" text-anchor="end" class="gx-lbl">${brd(pts[pts.length-1].d).slice(0,5)}</text>`;
  const dif = pts[pts.length-1].v - pts[0].v;
  return `<div class="gx" style="margin-top:12px"><div class="gx-h"><span>${ex.ty==="load"?"Carga":ex.ty==="time"?"Tempo":"Repetições"} nas últimas ${pts.length} sessões</span>
      <b class="${dif<0?"neg":""}">${dif>0?"+":""}${fmt(dif)} ${u}</b></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ex.n)}: ${pts.map(q=>brd(q.d).slice(0,5)+" "+fmt(q.v)+" "+u).join("; ")}">${g}</svg></div>`;
}

function pcCalendario(p, m, ano, mes){
  const days = dayset(p);
  const prim = new Date(ano,mes,1), nd = new Date(ano,mes+1,0).getDate(), inicio = (prim.getDay()+6)%7;
  const sel = REF(), hj = shift(0), ab = sessaoAberta(p);
  let out = `<div class="cal"><div class="grid">${["seg","ter","qua","qui","sex","sáb","dom"].map(x=>`<div class="gh">${x}</div>`).join("")}`;
  for(let i=0;i<inicio;i++) out += `<div class="cell out"></div>`;
  let nT=0, nX=0, nS=0;
  for(let d=1; d<=nd; d++){
    const dt = `${ano}-${String(mes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const mmAll = S.events.filter(e=>e.perfil===p&&e.tipo==="musc"&&e.data===dt), mm = mmAll[0];
    const xx = S.events.find(e=>e.perfil===p&&e.tipo==="extra"&&e.data===dt);
    const sk = skipDoDia(p,dt), prog = !mm && ab && dt===hj;
    if(mm) nT++; if(xx) nX++; if(sk) nS++;
    const skipCls = (!mm && !xx && sk) ? " skipd" : "";
    out += `<button class="cell${skipCls} ${dt===sel?"sel":""} ${dt===hj?"hoje":""}" data-dt="${dt}" aria-label="${d} de ${MES[mes]}${mm?", treino "+mm.dia+" concluído":prog?", treino em andamento":""}">
      <span class="n">${d}</span>
      ${mm?`<span class="l">${mm.dia}${mmAll.length>1?`<sup class="mult">${mmAll.length}</sup>`:""}</span>`
        : prog ? `<span class="l" style="color:var(--ac)">${pic("clock","sm")}</span>`
        : (sk&&!xx?`<span class="l skip" style="font-size:11px">—</span>`:`<span class="l" style="color:transparent">·</span>`)}
      ${xx?`<span class="dot"></span>`:`<span class="dot" style="background:transparent"></span>`}</button>`;
  }
  out += `</div></div>`;
  out += `<div class="pc-legend"><span><b style="color:var(--ac)">${(()=>{ const Ls = letras(p); return Ls.length>1 ? Ls[0]+"–"+Ls[Ls.length-1] : (Ls[0]||"A"); })()}</b> treino concluído</span><span>${pic("clock","sm")} em andamento</span><span><i class="x"></i>extra</span><span>— descanso</span></div>`;
  out += `<div class="pc-macros" style="margin-top:14px"><div><b>${nT}</b><span>musculação</span></div><div><b>${nX}</b><span>extras</span></div><div><b>${nS}</b><span>descansos</span></div></div>`;

  const ss = S.events.filter(e=>e.perfil===p&&e.tipo==="musc"&&e.data===sel);
  const xs = extrasDoDia(p,sel), sk = skipDoDia(p,sel);
  out += pcSec(cap(dataLonga(sel)));
  if(sk) out += `<div class="pc-row">${pic("moon")}<div class="main"><div class="t">Marcado como descanso</div>${sk.motivo?`<div class="s">${esc(sk.motivo)}</div>`:""}</div><button class="pc-btn sm ghost" data-skip="1">Desfazer</button></div>`;
  xs.forEach(e=>{
    out += `<div class="pc-row">${pic("run")}<div class="main"><div class="t">${e.atividade?esc(e.atividade):esc(m.extra||"Atividade")}</div><div class="s">${e.duracao?e.duracao+" min":""}${e.nota?(e.duracao?" · ":"")+esc(e.nota):""}</div></div><button class="pc-btn sm ghost" data-rmatv="${e.id}">Remover</button></div>`;
  });
  if(ss.length>1) out += `<div class="warn-dup">Há ${ss.length} treinos registrados neste dia. Exclua os repetidos ou edite para mudar a data.</div>`;
  ss.forEach(ev=>{ out += sessaoCard(ev,days,`<div class="cal-acts"><button data-caledit="${ev.id}">Editar ou mudar data</button><button class="del-x" data-caldel="${ev.id}">Excluir</button></div>`); });
  if(!ss.length && ab && sel===hj) out += `<button class="pc-row" data-continuar="${ab.L}"><div class="main"><div class="t">Treino ${ab.L} · ${esc(ab.t.t)}</div><div class="s">${ab.ok} de ${ab.total} séries concluídas</div></div><span class="pc-pill">Em andamento</span></button>`;
  if(!ss.length && sel<=hj && !(ab && sel===hj)) out += `<div class="cal-feito">
      <button class="pc-btn pri" data-feitorapido="1">${pic("check","sm")} Marcar treino como feito</button>
      <button class="pc-btn ghost" data-calreg="1">${pic("edit","sm")} Preencher série por série</button></div>`;
  if(!ss.length && !xs.length && !sk && !(ab && sel===hj)) out += `<p class="pc-note" style="font-size:14px">Sem registro neste dia.</p>`;
  return out;
}

/* ===================== v37 · confirmação em folha (no lugar da caixa nativa do navegador) ===================== */
function confirmar(texto, o){
  o = o || {};
  return new Promise(res=>{
    const velho = document.getElementById("cfmSheet");
    if(velho){ try{ velho._fim && velho._fim(false); }catch(e){} }
    const partes = String(texto).split("\n\n");
    const titulo = o.titulo || partes.shift();
    const corpo = (o.titulo ? String(texto).split("\n\n") : partes).map(x=>esc(x).replace(/\n/g,"<br>")).join("<br><br>");
    const el = document.createElement("div"); el.id = "cfmSheet"; el.className = "cfm";
    el.innerHTML = `<div class="cfm-bg" data-c="0"></div>
      <div class="cfm-card" role="alertdialog" aria-modal="true" aria-labelledby="cfmT">
        <div class="cfm-t" id="cfmT">${esc(titulo)}</div>${corpo?`<div class="cfm-x">${corpo}</div>`:""}
        <div class="cfm-b"><button class="cfm-no" data-c="0">${esc(o.cancelar||"Cancelar")}</button>
          <button class="cfm-ok ${o.perigo?"perigo":""}" data-c="1">${esc(o.ok||"Confirmar")}</button></div>
      </div>`;
    let feito = false;
    const kd = e=>{ if(e.key==="Escape") fim(false); };
    function fim(v){ if(feito) return; feito = true; document.removeEventListener("keydown", kd);
      el.id = ""; el.classList.remove("on"); setTimeout(()=>el.remove(), 200); res(v); }
    el._fim = fim;
    el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>fim(b.dataset.c==="1"));
    document.addEventListener("keydown", kd);
    document.body.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("on")));
    setTimeout(()=>{ const b = el.querySelector(".cfm-ok"); if(b) b.focus({preventScroll:true}); }, 60);
  });
}

  if(!S.prefs) S.prefs = {};

}

async function atualizaTelaLigada(){
  const quer = ui.view==="treino" && pref("telaLigada") && document.visibilityState==="visible";

    if(quer && !WAKE && navigator.wakeLock){ WAKE = await navigator.wakeLock.request("screen"); WAKE.addEventListener("release", ()=>{ WAKE = null; }); }

/* ---- cronômetro de descanso (fica fora do render) ---- */
const REST = { fim:0, total:0, t:null };
function segDescanso(ex){

    if(Number(ex.d) > 0) return Math.round(Number(ex.d));

function iniciarDescanso(seg){
  REST.total = seg; REST.fim = Date.now() + seg*1000;

}
function pararDescanso(){ clearInterval(REST.t); REST.t=null; const el=document.getElementById("restBar"); if(el) el.remove(); }
function tickDescanso(){
  let el = document.getElementById("restBar");
  if(!el){
    el = document.createElement("div"); el.id = "restBar"; el.className = "rest-bar";
    el.innerHTML = `<div class="rb-p"><i></i></div><button data-rb="-15">−15</button><div class="rb-t"><small>Descanso</small><b></b></div><button data-rb="15">+15</button><button data-rb="0" class="rb-x">Pular</button>`;
    document.body.appendChild(el);
    el.querySelectorAll("[data-rb]").forEach(b=>b.onclick=()=>{
      const v = Number(b.dataset.rb); if(v===0){ pararDescanso(); return; }
      REST.fim = Math.max(Date.now(), REST.fim + v*1000); REST.total = Math.max(REST.total + v, 1); tickDescanso();
    });
  }
  const rest = Math.max(0, Math.round((REST.fim - Date.now())/1000));
  el.querySelector("b").textContent = `${Math.floor(rest/60)}:${String(rest%60).padStart(2,"0")}`;
  el.querySelector(".rb-p i").style.width = (REST.total ? (1 - rest/REST.total)*100 : 100) + "%";
  if(rest<=0){
    clearInterval(REST.t); REST.t=null;
    vibrar([220,120,220]);
    el.classList.add("fim"); el.querySelector("small").textContent = "Descanso concluído";
    setTimeout(()=>{ if(!REST.t) pararDescanso(); }, 2500);
  }
}

function abrirHistoricoEx(exId){
